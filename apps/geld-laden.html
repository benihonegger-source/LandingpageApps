      ${nextBtn}
    </section>
    ${side}

  ${usesDrawer ? drawerV(r,t) : ''}`;

/* ----- Unter der Lupe ----- */
function exploreV(){
  const m=MOD(st.m), set = m.id===1 ? [100,200,500,1000,2000,5000,10000] : [5,10,20,50,100];
  const v = st.ex || set[0], D = DEN[v];
  let facts = '';
  if(v<100){
    const n=100/v;
    facts = `<p><b>${n} Stück</b> davon sind 1 Franken:</p><div class="many">${Array(n).fill(coinV(v)).join('')}</div>${hundredV([v])}`;
  } else if(v===100 && st.m===6){
    facts = `<p><b>1 Franken = 100 Rappen.</b> Zum Beispiel:</p>
      <div class="many">${coinV(50)}${coinV(50)}</div><div class="many">${Array(5).fill(coinV(20)).join('')}</div><div class="many">${Array(10).fill(coinV(10)).join('')}</div>`;
  } else {
    const fr=v/100, tens=Math.floor(fr/10), ones=fr%10;
    facts = `<p>So viel sind ${fr} Franken: ${tens?`<b>${tens} Zehner</b>`:''}${tens&&ones?' und ':''}${ones?`<b>${ones} Einer</b>`:''}</p>
      <div class="tens" aria-hidden="true">${Array(tens).fill(`<span class="ten">${'<i></i>'.repeat(10)}</span>`).join('')}${Array(ones).fill('<span class="one"></span>').join('')}</div>
      ${fr<=20 ? `<p>Das sind so viele 1-Franken-Stücke:</p><div class="many">${Array(fr).fill(coinV(100)).join('')}</div>` : ''}`;
  }
  const tip = m.id===6
    ? 'Die Grösse verrät den Wert nicht: Der Halbfranken (50 Rp.) ist kleiner als das 20-Rappen-Stück. Lies immer die Zahl!'
    : 'Münzen sind aus Metall, Noten aus Papier. Je grösser die Zahl, desto mehr ist das Geld wert.';
  return `
  <header class="top">
    <button class="btn iconbtn" data-a="toModule" aria-label="Zurück zur Übung">${ic('back')}</button>
    <div class="modhead"><div><small>Unter der Lupe</small><h1>${m.id===1?'Unser Geld':'Die Rappen'}</h1></div></div>
    <div class="spacer"></div>
    ${starsV()}
  </header>
  <div class="explore">
    <div class="faecher explore-lade" style="--n:${set.length};--m:${Math.min(set.length,4)}">${set.map(x=>`<button class="fach ${x===v?'sel':''}" data-a="exSel" data-v="${x}" aria-pressed="${x===v}" aria-label="${DEN[x].name} unter die Lupe legen"><span class="cw">${coinV(x)}</span><small>${shortName(x)}</small></button>`).join('')}</div>
    <div class="lupe">
      <div class="lens">${coinV(v)}</div>
      <div class="facts">
        <div><h2>${D.name}</h2><p class="nick">${D.long}${D.nick!==D.long?` · man sagt auch «${D.nick}»`:''}</p></div>
        ${facts}
      </div>
    </div>
    <div class="note-line">${ic('bulb')}<span>${tip}</span></div>
  </div>`;
}

function endV(){
  const r=st.round, s=r.score, n = s>=7?3 : s>=5?2 : s>=3?1 : 0;
  const msg = s>=7?'Wow, super gemacht!' : s>=5?'Sehr gut!' : s>=3?'Gut geübt! Weiter so.' : 'Das war schwierig. Übe nochmal in Ruhe.';
  const up = s>=DONE && st.L<3, down = s<=3 && st.L>1;
  return `
  <div class="end">
    ${foxV('hop')}
    <div class="bigstars" aria-label="${n} von 3 Sternen">${[1,2,3].map(i=>ic('star', i<=n?'':'off')).join('')}</div>
    <div class="score">${s} von ${ROUND} richtig</div>
    <p class="sub">${msg}</p>
    <div class="progress big">${r.results.map(v=>`<i class="dot ${v||''}"></i>`).join('')}</div>
    ${s>=DONE ? `<div class="won">${ic('check')}Stufe «${LEVELS[st.L].n}» geschafft!</div>` : ''}
    <div class="endbtns">
      ${up?`<button class="btn primary wide" data-a="up">Nächste Stufe: ${LEVELS[st.L+1].n} ${ic('arrow')}</button>`:''}
      ${down?`<button class="btn wide easier" data-a="down">Etwas leichter: ${LEVELS[st.L-1].n}</button>`:''}
      <button class="btn wide ${up?'':'primary'}" data-a="again">${ic('retry')}Nochmal spielen</button>
      <button class="btn wide" data-a="toModule">Andere Stufe wählen</button>
      <button class="btn wide" data-a="home">${ic("home")}Zurück zum Regal</button>
    </div>
    <div class="legend"><span><i class="dot g"></i>sofort richtig</span><span><i class="dot y"></i>mit Hilfe</span><span><i class="dot o"></i>nochmal geübt</span></div>
  </div>`;
}

function modalV(){
  if(st.modal==='quit') return `
    <div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mh">
      <h3 id="mh">Runde beenden?</h3><p>Die angefangene Runde zählt dann nicht.</p>
      <div class="mbtns"><button class="btn mbtn" data-a="closeModal">Weiter üben</button><button class="btn mbtn stop" data-a="quitYes">Ja, beenden</button></div>
    </div></div>`;
  if(st.modal==='info') return `
    <div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mh">
      <h3 id="mh">Für Eltern und Lehrpersonen</h3>
      <ul>
        <li><b>Franken (1. Klasse):</b> nur ganze Franken. Geld kennen, zählen, legen, mit wenig Stücken bezahlen und Rückgeld geben (Lehrplan 21, MA.3.A.1: Münzen und Noten, Beträge legen).</li>
        <li><b>Rappen (2. Klasse), sorgfältig aufgebaut:</b> zuerst die Münzen entdecken (Grösse ≠ Wert, ½ Fr. = 50 Rp.), dann Rappen bis 1 Franken mit dem Hunderterfeld, Ergänzen bis 1 Franken, Wechseln und erst zuletzt gemischte Beträge und Rückgeld.</li>
        <li><b>Handelnd:</b> Geld aus der Kassenlade in die Münzschale ziehen oder ein Fach antippen. Antippen in der Schale legt es zurück. Die Fächer sind nach dem Wert geordnet, die Münzen erscheinen in echten Grössenverhältnissen. Der Kassenzettel druckt jeden Schritt mit.</li>
        <li><b>3 Stufen pro Übung.</b> Leicht: Zwischensummen auf dem Kassenzettel und das Hunderterfeld sind sichtbar. Mittel und Schwer: grössere Beträge, Hilfen nur über den Knopf «Hilfe» (zählt als «mit Hilfe»).</li>
        <li><b>Eine Runde hat ${ROUND} Aufgaben.</b> Nach einem Fehler gibt es einen Tipp, nach dem zweiten die Lösung. Die Aufgabe kommt später nochmals. Geschafft ist eine Stufe bei mindestens ${DONE} von ${ROUND} beim ersten Versuch ohne Hilfe.</li>
        <li><b>Rückgeld</b> wird nach der Kassierer-Methode gezählt: vom Preis aus weiter bis zum bezahlten Betrag, bei Rappen zuerst bis zum nächsten Franken.</li>
        <li><b>Datenschutz:</b> keine Speicherung im Browser, keine Cookies, keine Verbindung ins Internet. Beim Schliessen ist alles weg. Der Lernstand-Code enthält keinen Namen.</li>
      </ul>
      <div class="setrow"><b>Schreibweise gemischter Beträge</b>
        <span class="seg" role="group" aria-label="Schreibweise">
          <button class="btn" data-a="dot" data-v="0" aria-pressed="${!st.dot}">3 Fr. 40 Rp.</button>
          <button class="btn" data-a="dot" data-v="1" aria-pressed="${st.dot}">Fr. 3.40</button>
        </span></div>
      <div class="mbtns"><button class="btn mbtn primary" data-a="closeModal">Alles klar</button></div>
    </div></div>`;
  return '';
}

function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2800);
}

/* ---------------- Spielablauf ---------------- */
function startRound(){
  clearTimeout(nextTimer);
  const tasks = makeTasks(st.m, st.L);
  st.round = { list: tasks.map((t,i)=>Object.assign({}, t, {oi:i, retry:false})), pos:0, results:Array(ROUND).fill(null), streak:0 };
  st.screen='play'; beginTask();
}
function beginTask(){
  const r=st.round;
  r.cur=r.list[r.pos]; r.plate=[]; r.inp={f:'',r:''}; r.field='f'; r.sorted=[]; r.wrongPick=null; r.lastAdd=-1;
  r.tries=0; r.help=false; r.unitFr=false; r.phase='ask'; r.msg=''; r.mood=''; r.shake=false;
  render();
}
const active = () => { const r=st.round; return r && st.screen==='play' && (r.phase==='ask'||r.phase==='wrong1'); };

function addCoin(v){
  if(!active()) return; const r=st.round;
  if(r.plate.length>=40){ toast('Der Teller ist voll.'); return; }
  r.plate.push(v); r.lastAdd=r.plate.length-1; r.shake=false; snd.coin(v); render();
}
function remCoin(i){ if(!active()) return; const r=st.round; const v=r.plate.splice(i,1)[0]; r.lastAdd=-1; if(v) snd.back(); render(); }

function correct(){
  const r=st.round, t=r.cur;
  snd.ok(); r.phase='correct'; r.streak++; r.mood='hop';
  const clean = r.tries===0 && !r.help;
  if(!t.retry){ r.results[t.oi] = clean?'g':'y'; if(clean) st.stars++; }
  r.msg = pick(clean?PRAISE:PRAISE2);
  if(t.kind==='change') r.msg += ' ' + P(`${fmt(t.item.price)} + ${fmt(t.target)} = ${fmt(t.paid)}`);
  if(r.streak%5===0){ r.msg=`${r.streak} richtig hintereinander!`; setTimeout(()=>{ snd.star(); confetti(); },250); }
  render(); nextTimer=setTimeout(nextTask, t.kind==='change'?2300:1500);
}
function wrong(msg){
  const r=st.round, t=r.cur;
  r.tries++; r.streak=0; snd.bad();
  if(r.tries===1){
    r.phase='wrong1'; r.shake=true; r.mood='';
    r.msg = msg + ' ' + (t.hint||'');
    render();
    setTimeout(()=>{ if(st.round===r && r.shake){ r.shake=false; r.wrongPick=null; render(); } }, 750);
  } else reveal();
}
function reveal(){
  const r=st.round, t=r.cur;
  r.phase='reveal'; r.mood=''; r.shake=false; r.wrongPick=null; r.help=true;
  let sol='';
  if(['lay','few','change','swap'].includes(t.kind)){
    r.plate = bestCombo(t.target - sumOf(t.locked), t.wallet) || [];
    sol = P(`So geht es: ${r.plate.map(shortName).join(' + ')}${r.plate.length>1?` = ${fmt(sumOf(r.plate))}`:''}`);
  } else if(t.kind==='count'){
    r.unitFr=false;
    r.inp = t.unit==='frrp' ? {f:String(Math.floor(t.answer/100)), r:String(t.answer%100)} : {f:String(t.unit==='rp'?t.answer:t.answer/100), r:''};
    sol = P(`Es sind ${t.unit==='rp'?fmtR(t.answer):fmt(t.answer)}`);
  } else if(t.kind==='sort'){ sol = 'So ist die Reihe richtig.'; }
  else sol = `Das ist ${DEN[t.answer].name}${t.answer===50?' (Halbfranken)':''}.`;
  if(!t.retry){
    r.results[t.oi]='o';
    r.list.splice(Math.min(r.pos+3, r.list.length), 0, Object.assign({}, t, {retry:true}));
    r.msg = sol + ' Diese Aufgabe kommt gleich nochmal.';
  } else r.msg = sol;
  render();
}
function check(){
  if(!active()) return;
  const r=st.round, t=r.cur;
  if(t.kind==='count'){
    let v;
    if(t.unit==='frrp'){ if(r.inp.f==='' && r.inp.r==='') return; v = (parseInt(r.inp.f||'0',10))*100 + parseInt(r.inp.r||'0',10); }
    else { if(r.inp.f==='') return; v = parseInt(r.inp.f,10) * (t.unit==='rp' && !r.unitFr ? 1 : 100); }
    if(v===t.answer){ correct(); if(t.unit==='rp' && r.unitFr){ r.msg = pick(PRAISE) + ' 1 Franken = 100 Rappen.'; render(); } return; }
    if(t.unit==='frrp' && parseInt(r.inp.r||'0',10)>=100) return wrong('Mehr als 99 Rappen gibt es nicht: 100 Rappen sind 1 Franken!');
    r.inp={f:'',r:''}; r.field='f';
    return wrong(v<t.answer ? 'Das ist zu wenig.' : 'Das ist zu viel.');
  }
  if(!r.plate.length) return;
  const tot = sumOf(r.plate)+sumOf(t.locked);
  if(t.kind==='few'){
    if(tot===t.target && r.plate.length<=t.best.length) return correct();
    if(tot===t.target) return wrong(`Der Betrag stimmt! Aber es geht mit weniger Stücken: nur ${t.best.length}.`);
  } else if(tot===t.target) return correct();
  const diff = Math.abs(tot-t.target), showDiff = st.L===1 || r.help;
  const what = t.kind==='change' ? 'Rückgeld' : 'Geld';
  wrong(tot<t.target ? `Das ist zu wenig ${what}.${showDiff?' '+P(`Es fehlen noch ${fmt(diff)}`):''}` : `Das ist zu viel ${what}.${showDiff?` Es sind ${fmt(diff)} zu viel.`:''}`);
}
function pickChoice(v){
  if(!active()) return; const r=st.round, t=r.cur;
  if(v===t.answer){ r.wrongPick=null; snd.coin(v); return correct(); }
  r.wrongPick=v;
  wrong(t.kind==='compare' ? `Nein, das ist ${DEN[v].name}.` : `Das ist ${DEN[v].name}.`);
}
function pickSort(v){
  if(!active()) return; const r=st.round, t=r.cur;
  const next = t.answer[r.sorted.length];
  if(v===next){ r.sorted.push(v); r.wrongPick=null; snd.coin(v); if(r.sorted.length===t.answer.length) return correct(); render(); return; }
  r.wrongPick=v;
  wrong(`${DEN[v].name} ist nicht das kleinste. Es gibt noch etwas mit weniger Wert.`);
}
function digit(d){
  if(!active()) return; const r=st.round, t=r.cur; if(t.kind!=='count') return;
  snd.tap(); const k=r.field, max = k==='r' ? 2 : 3;
  if(r.inp[k]==='0') r.inp[k]=String(d); else if(r.inp[k].length<max) r.inp[k]+=String(d);
  r.shake=false; render();
}
function delDigit(){
  if(!active()) return; const r=st.round; snd.tap();
  if(r.inp[r.field]==='' && r.field==='r') r.field='f'; else r.inp[r.field]=r.inp[r.field].slice(0,-1);
  render();
}
function nextTask(){
  clearTimeout(nextTimer);
  const r=st.round; if(!r || st.screen!=='play') return;
  r.pos++;
  if(r.pos>=r.list.length) endRound(); else beginTask();
}
function endRound(){
  clearTimeout(nextTimer);
  const r=st.round, score=r.results.filter(x=>x==='g').length, p=prog(st.m,st.L);
  p.r++; p.t+=ROUND; p.c+=score; p.h+=r.results.filter(x=>x==='y').length; p.b=Math.max(p.b,score);
  r.score=score; st.dirty=true; st.screen='end';
  if(score>=DONE) setTimeout(()=>{ snd.star(); confetti(); },200);
  render();
}

// Münzregen: Gold- und Silbermünzen fallen und drehen sich
function confetti(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.createElement('canvas'); cv.className='confetti'; document.body.appendChild(cv);
  cv.width=innerWidth; cv.height=innerHeight; const ctx=cv.getContext('2d');
  const cols=[['#e3bb4c','#a87f1c'],['#dfe2e6','#8f959e']];
  const ps=Array.from({length:60},()=>({x:Math.random()*cv.width,y:-Math.random()*cv.height*.6,vx:(Math.random()-.5)*3,vy:Math.random()*3+3,s:Math.random()*10+16,ph:Math.random()*6.28,vp:Math.random()*.18+.08,c:Math.random()<.35?0:1}));
  const t0=performance.now();
  (function f(t){
    ctx.clearRect(0,0,cv.width,cv.height); let alive=false;
    for(const p of ps){
      p.x+=p.vx; p.y+=p.vy; p.vy+=.05; p.ph+=p.vp; if(p.y<cv.height+30) alive=true;
      const k=Math.cos(p.ph), w=Math.max(1.2,Math.abs(k)*p.s/2);
      ctx.fillStyle = k>=0 ? cols[p.c][0] : cols[p.c][1];
      ctx.beginPath(); ctx.ellipse(p.x,p.y,w,p.s/2,0,0,Math.PI*2); ctx.fill();
    }
    if(alive && t-t0<4000) requestAnimationFrame(f); else cv.remove();
  })(t0);
}

/* ---------------- Ziehen und Ablegen (Finger, Stift, Maus) ---------------- */
$app.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-drag]'); if(!b || b.disabled || !active()) return;
  drag = {v:+b.dataset.drag, x:e.clientX, y:e.clientY, id:e.pointerId, ghost:null, src:b};
});
window.addEventListener('pointermove', e => {
  if(!drag || e.pointerId!==drag.id) return;
  if(!drag.ghost){
    if(Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < 9) return;
    const g=document.createElement('div'); g.className='ghost'; g.innerHTML=coinV(drag.v); document.body.appendChild(g); drag.ghost=g;
  }
  e.preventDefault();
  drag.ghost.style.left=e.clientX+'px'; drag.ghost.style.top=e.clientY+'px';
  const p=document.getElementById('plate');
  if(p){ const rc=p.getBoundingClientRect(); p.classList.toggle('drop', e.clientX>=rc.left && e.clientX<=rc.right && e.clientY>=rc.top && e.clientY<=rc.bottom); }
}, {passive:false});
function endDrag(e, cancel){
  if(!drag || (e && e.pointerId!==drag.id)) return;
  const d=drag; drag=null;
  if(!d.ghost) return;            // kein Ziehen: der normale Klick legt das Geld hin
  d.ghost.remove(); suppressClick=true; setTimeout(()=>suppressClick=false, 50);
  const p=document.getElementById('plate'); if(!p) return;
  p.classList.remove('drop');
  if(cancel) return;
  const rc=p.getBoundingClientRect();
  if(e.clientX>=rc.left && e.clientX<=rc.right && e.clientY>=rc.top && e.clientY<=rc.bottom) addCoin(d.v);
}
window.addEventListener('pointerup', e => endDrag(e,false));
window.addEventListener('pointercancel', e => endDrag(e,true));

/* ---------------- Bedienung ---------------- */
const act = {
  sound(){ st.sound=!st.sound; snd.on=st.sound; if(st.sound) snd.tap(); render(); },
  home(){ clearTimeout(nextTimer); st.round=null; st.screen='home'; st.modal=null; render(); },
  openMod(d){ snd.tap(); st.m=+d.m; st.L=recLevel(st.m); st.screen='module'; render(); },
  level(d){ snd.tap(); st.L=+d.l; render(); },
  start(){ snd.tap(); startRound(); },
  explore(){ snd.tap(); st.explored[st.m]=true; st.ex=null; st.screen='explore'; render(); },
  exSel(d){ const v=+d.v; st.ex=v; snd.coin(v); render(); speak(`${DEN[v].name}. ${DEN[v].long}.${v<100?` ${100/v} davon sind ein Franken.`:''}`); },
  toModule(){ clearTimeout(nextTimer); st.round=null; st.screen='module'; render(); },
  add(d){ addCoin(+d.v); },
  rem(d){ remCoin(+d.i); },
  clear(){ if(!active()) return; st.round.plate=[]; snd.back(); render(); },
  check(){ check(); },
  pick(d){ pickChoice(+d.v); },
  pickSort(d){ pickSort(+d.v); },
  unit(){ if(!active()) return; st.round.unitFr=!st.round.unitFr; snd.tap(); render(); },
  field(d){ if(!active()) return; st.round.field=d.f; snd.tap(); render(); },
  d(d){ digit(d.d); }, del(){ delDigit(); },
  next(){ snd.tap(); nextTask(); },
  help(){ const r=st.round; if(!r||!active()) return; snd.tap(); r.help=true; if(!r.msg) r.msg=r.cur.hint; render(); },
  speak(){ const t=st.round && st.round.cur; if(!t) return; speak(t.say); },
  quit(){ st.modal='quit'; render(); },
  quitYes(){ clearTimeout(nextTimer); st.modal=null; st.round=null; st.screen='module'; render(); },
  closeModal(){ st.modal=null; render(); },
  again(){ startRound(); }, up(){ st.L=Math.min(3,st.L+1); startRound(); }, down(){ st.L=Math.max(1,st.L-1); startRound(); },
  info(){ st.modal='info'; render(); },
  dot(d){ st.dot = d.v==='1'; render(); },
  qr(){ LernstandQR.open(); },
};
$app.addEventListener('click', e => {
  if(suppressClick) return;
  const b=e.target.closest('[data-a]'); if(!b || b.disabled) return;
  const fn=act[b.dataset.a]; if(fn) fn(b.dataset);
});
document.addEventListener('keydown', e => {
  if(e.target && e.target.tagName==='INPUT') return;
  if(st.modal){ if(e.key==='Escape') act.closeModal(); return; }
  if(st.screen!=='play' || !st.round) return;
  const r=st.round;
  if(/^[0-9]$/.test(e.key)) digit(e.key);
  else if(e.key==='Backspace'){ e.preventDefault(); delDigit(); }
  else if(e.key==='Tab' && r.cur.unit==='frrp'){ e.preventDefault(); r.field = r.field==='f'?'r':'f'; render(); }
  else if(e.key==='Enter'){ e.preventDefault(); if(r.phase==='reveal') nextTask(); else check(); }
});
window.addEventListener('beforeunload', e => { if(st.dirty){ e.preventDefault(); e.returnValue=''; } });

/* ---------------- Lernstand-Code fürs Lehrerzimmer ---------------- */
LernstandQR.init({
  app:'geldladen', title:'Geld-Laden',
  build(){
    let doneLv=0, totT=0, totC=0, totH=0, any=false;
    MODULES.forEach(m=>[1,2,3].forEach(L=>{ const p=peek(m.id,L); if(p.b>=DONE) doneLv++; totT+=p.t; totC+=p.c; totH+=p.h; if(p.r) any=true; }));
    if(!any) return null;
    const cellOf=(id,L)=>{ const p=peek(id,L), s=lvState(id,L); return s==='done' ? [`${p.b}/${ROUND}`,'g'] : s==='played' ? [p.b>0?`${p.b}/${ROUND}`:'geübt','y'] : ['offen','n']; };
    const rows=MODULES.map(m=>[`${m.id}. ${m.title}${m.id===5||m.id===10?(m.y===1?' (Fr.)':' (Rp.)'):''}`, cellOf(m.id,1), cellOf(m.id,2), cellOf(m.id,3)]);
    const steps=[], notStarted=[], mastered=[];
    MODULES.forEach(m=>{
      if(![1,2,3].some(L=>peek(m.id,L).r>0)){ notStarted.push(m.id); return; }
      if([1,2,3].every(L=>lvState(m.id,L)==='done')){ mastered.push(m.id); return; }
      steps.push(`Übung ${m.id} (${m.title}): weiter mit Stufe ${LEVELS[recLevel(m.id)].n}`);
    });
    const lines=steps.slice();
    if(mastered.length) lines.push(`Alle Stufen geschafft: Übung ${mastered.join(', ')}`);
    if(notStarted.length) lines.push(`Noch nicht begonnen: Übung ${notStarted.join(', ')}`);
    return { s:'Rechnen mit Franken und Rappen', b:[
      {k:'kpi', i:[[String(st.stars),'Sterne gesammelt'],[`${doneLv} von 30`,'Stufen geschafft'],[totT?`${Math.round(totC/totT*100)} %`:'–','beim 1. Versuch richtig'],[String(totH),'mit Hilfe gelöst']]},
      {k:'tab', h:['Übung','Leicht','Mittel','Schwer'], r:rows},
      {k:'legend', i:[['g',`geschafft: mind. ${DONE} von ${ROUND} beim 1. Versuch`],['y','geübt (bestes Ergebnis)'],['n','noch offen']]},
      {k:'h', x:'So geht es weiter'},
      {k:'list', i:lines},
      {k:'p', s:'muted', o:1, x:'Übungen 1–5: ganze Franken (1. Klasse). Übungen 6–10: Rappen (2. Klasse). Leicht: mit sichtbarer Summe oder Hunderterfeld. Mittel/Schwer: Hilfe nur auf Wunsch.'}
    ]};
  }
});

render();
