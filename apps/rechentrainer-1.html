/* Layout: Materialtisch. Die Fläche ist Karton, darauf liegen Karteikarten, ein Zettel und das 20er-Feld.
   Rot und Blau gehören den Wendeplättchen. Blau führt durch die App (Hauptfarbe), Leuchtstift-Gelb markiert (Akzent). */
:root{
  color-scheme:light;
  /* ---- Farben ---- */
  --table:#e3d2b3;      /* Karton */
  --table-deep:#cbb187;
  --paper:#fcf8f0;
  --paper-hi:#fffdf8;
  --paper-2:#f3ebda;
  --line:#e2d4bb;
  --ink:#2a231e;
  --ink-soft:#5c4f43;
  --ink-faint:#9a8a78;
  --red:#d33a2c; --red-deep:#9f2a1f; --red-soft:#f8e0db;
  --blue:#2350b5; --blue-hi:#2b5cc8; --blue-deep:#173a88; --blue-soft:#dfe7f7; --blue-line:#bccbea;
  --mark:#f5bd1f; --mark-soft:#fdeaa8; --mark-ink:#6b4a00;
  --ok:#2c7a50; --ok-deep:#1d5638; --ok-soft:#d8ecdc;
  --again:#cf6428;
  --fox:#e0742c; --fox-deep:#b4561a; --fox-cream:#fff4e3;
  --shade:42 35 30; /* RGB-Werte für Schatten */

  /* ---- Schrift ---- */
  --font-display: "Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-text: "Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
  --ratio:1.25;
  --text-base: clamp(1.05rem, .97rem + .4vw, 1.3rem);
  --text-sm: calc(var(--text-base) / var(--ratio));
  --text-xs: calc(var(--text-sm) / var(--ratio));
  --text-lg: calc(var(--text-base) * var(--ratio));
  --text-xl: calc(var(--text-lg) * var(--ratio));
  --text-2xl: calc(var(--text-xl) * var(--ratio));
  --text-3xl: calc(var(--text-2xl) * var(--ratio));
  --text-4xl: calc(var(--text-3xl) * var(--ratio));
  --text-5xl: calc(var(--text-4xl) * var(--ratio));
  --text-6xl: calc(var(--text-5xl) * var(--ratio));
  --font-regular:400; --font-bold:700; /* Outfit ist in zwei Schnitten eingebettet */
  --leading-body:1.5; --leading-heading:1.2; --leading-solid:1;
  --tracking-label:.07em;

  /* ---- Raum (wächst mit der Basisgrösse) ---- */
  --s1:calc(var(--text-base) * .25); --s2:calc(var(--text-base) * .5); --s3:calc(var(--text-base) * .75);
  --s4:var(--text-base); --s5:calc(var(--text-base) * 1.5); --s6:calc(var(--text-base) * 2); --s7:calc(var(--text-base) * 3);
  --r-card:6px; --r-key:14px; --r-pill:999px;
  --lift: 0 1px 0 rgb(var(--shade) / .08), 0 12px 20px -14px rgb(var(--shade) / .55);
  --press: 0 4px 0 var(--table-deep);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:clip}
body{
  margin:0;min-height:100%;background:var(--table);color:var(--ink);
  background-image:radial-gradient(rgb(var(--shade) / .06) 1px, transparent 1.3px);background-size:7px 7px;
  font-family:var(--font-text);font-size:var(--text-base);font-weight:var(--font-regular);line-height:var(--leading-body);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0;text-align:inherit}
input{font:inherit;-webkit-user-select:text;user-select:text}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:var(--font-bold);line-height:var(--leading-heading);text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{
  max-width:68rem;margin:0 auto;display:flex;flex-direction:column;gap:var(--s5);
  padding-block:var(--s4) var(--s7);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.ico{width:1.25em;height:1.25em;flex:none;display:block}

/* ---- Knöpfe: Kartonplättchen, die man hinunterdrückt ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:44px;min-width:44px;
  border-radius:var(--r-key);background:var(--paper);color:var(--ink);box-shadow:var(--press);
  font-family:var(--font-display);font-weight:var(--font-bold);line-height:var(--leading-heading);
  transition:transform .08s ease-out, box-shadow .08s ease-out, background-color .15s;
}
.btn:hover:not(:disabled){background:var(--paper-hi)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--table-deep)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--blue);color:var(--paper-hi);box-shadow:0 4px 0 var(--blue-deep)}
.btn.primary:hover:not(:disabled){background:var(--blue-hi)}
.btn.primary:active:not(:disabled){box-shadow:0 1px 0 var(--blue-deep)}
.iconbtn{width:calc(var(--text-base) * 2.7);height:calc(var(--text-base) * 2.7);padding:0}
.iconbtn .ico{width:50%;height:50%}

/* ---- Kopfzeile ---- */
.top{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.spacer{flex:1}
.brand{display:flex;align-items:center;gap:var(--s3)}
.brand b{display:block;font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-xl);line-height:var(--leading-heading)}
.brand small{display:block;font-size:var(--text-sm);font-weight:var(--font-regular);color:var(--ink-soft)}
.chips{display:inline-flex;gap:3px}
.chip{width:1.05em;height:1.05em;border-radius:50%;display:inline-block}
.chip.r{background:var(--red);box-shadow:inset 0 -2px 0 var(--red-deep)}
.chip.b{background:var(--blue);box-shadow:inset 0 -2px 0 var(--blue-deep)}
.brand .chips .chip{width:1.4em;height:1.4em}
.stars{
  display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;padding:var(--s1) var(--s4) var(--s1) var(--s3);
  background:var(--paper);border-radius:var(--r-pill);box-shadow:var(--lift);
  font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-lg);font-variant-numeric:tabular-nums;
}
.stars .ico{color:var(--mark);width:1.3em;height:1.3em}

/* ---- Fuchs ---- */
.fox{display:block;width:calc(var(--text-base) * 3.4);height:auto;flex:none;overflow:visible}
.fx-o{fill:var(--fox)} .fx-d{fill:var(--fox-deep)} .fx-c{fill:var(--fox-cream)} .fx-i{fill:var(--ink)} .fx-w{fill:var(--paper-hi)}
.fx-l{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.fox.hop{animation:hop .55s ease-out}

/* ---- Startseite: Raster mit bewusstem Bruch ---- */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:end;gap:var(--s4);padding-top:var(--s3)}
.hero .fox{width:calc(var(--text-base) * 5.2);transform:rotate(-9deg) translateY(14%)}
.hero-txt{display:flex;flex-direction:column;gap:var(--s2);padding-bottom:var(--s2);min-width:0}
.eyebrow{font-size:var(--text-sm);font-weight:var(--font-bold);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-soft)}
.hero h1{font-size:var(--text-4xl);max-width:13ch}
.hero h1 em{font-style:normal;padding-inline:.06em;background:linear-gradient(transparent 58%, var(--mark) 58%, var(--mark) 92%, transparent 92%)}
@media (min-width:760px){
  .hero{grid-template-columns:1fr 3fr 1fr}
  .hero .fox{grid-column:1;justify-self:end;width:calc(var(--text-base) * 6.4)}
  .hero-txt{grid-column:2}
  .hero h1{font-size:var(--text-5xl)}
}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,11.5rem),1fr));gap:var(--s5) var(--s4);padding-top:var(--s2)}
.card{

}

.card:nth-child(4n+2){--tilt:.9deg}

.card .num{position:absolute;bottom:var(--s2);right:var(--s3);font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-2xl);line-height:var(--leading-solid);color:var(--line)}
.card .mini{width:100%;max-width:9.5rem;height:auto;margin-bottom:var(--s1)}
.card .tt{font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-lg);line-height:var(--leading-heading)}
.card .st{font-size:var(--text-sm);font-weight:var(--font-regular);color:var(--ink-soft);line-height:var(--leading-heading)}
.pips{display:flex;gap:var(--s2);margin-top:auto;padding-top:var(--s2)}
.pip{width:.85em;height:.85em;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink-faint)}

  position:relative;display:flex;flex-wrap:wrap;gap:var(--s4);align-items:center;justify-content:space-between;

/* ---- Übungsseite ---- */
.modhead{display:flex;align-items:center;gap:var(--s3);min-width:0}

.level .ds{font-family:var(--font-text);font-size:var(--text-sm);font-weight:var(--font-regular);color:var(--ink-soft);min-height:2.6em}
.level .stt{display:inline-flex;align-items:center;gap:var(--s1);margin-top:var(--s2);padding:var(--s1) var(--s3);border-radius:var(--r-pill);background:var(--paper-2);font-family:var(--font-text);font-size:var(--text-xs);font-weight:var(--font-regular)}

.tip{position:absolute;top:-.9em;left:50%;transform:translateX(-50%) rotate(-3deg);padding:.15em .75em;border-radius:4px;background:var(--mark);color:var(--ink);font-size:var(--text-xs);letter-spacing:var(--tracking-label);text-transform:uppercase;white-space:nowrap}
.lv{display:inline-flex;gap:.22em;vertical-align:middle}
.lv i{width:.62em;height:.62em;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink-faint)}
.lv i.on{background:var(--red);box-shadow:inset 0 -2px 0 var(--red-deep)}
.modes{display:grid;grid-template-columns:1.6fr 1fr;gap:var(--s4)}
.mode{flex-direction:column;gap:var(--s1);padding:var(--s5) var(--s3);font-size:var(--text-2xl);text-align:center}

/* ---- Spielseite ---- */
.tag{display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;padding:var(--s1) var(--s4);background:var(--paper);border-radius:var(--r-pill);box-shadow:var(--lift);font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-sm)}

}
.taskcard{display:flex;flex-direction:column;align-items:center;gap:var(--s4);min-width:0;padding:var(--s5) var(--s4);background:var(--paper);border-radius:var(--r-card);box-shadow:var(--lift)}
.qrow{display:flex;align-items:center;gap:var(--s3);align-self:stretch}
.q{flex:1;min-width:0;font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-xl);line-height:var(--leading-heading)}

.speak{width:calc(var(--text-base) * 2.6);height:calc(var(--text-base) * 2.6);flex:none;background:var(--blue-soft);color:var(--blue);box-shadow:0 4px 0 var(--blue-line)}
.speak .ico{width:55%;height:55%}
.badge{display:inline-flex;align-items:center;gap:var(--s1);padding:var(--s1) var(--s3);border-radius:4px;background:var(--mark-soft);color:var(--mark-ink);font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-xs);white-space:nowrap}
.ref{padding:var(--s1) var(--s4);border-radius:var(--r-key);background:var(--ok-soft);color:var(--ok);font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-2xl);line-height:var(--leading-heading);font-variant-numeric:tabular-nums}

/* 20er-Feld: Kartonschale mit Mulden */
.frame{width:100%;max-width:40rem;padding:var(--s2);background:var(--table);border-radius:12px;box-shadow:inset 0 2px 7px rgb(var(--shade) / .22)}
.fgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) .7rem repeat(5,minmax(0,1fr));gap:clamp(4px,1.2vw,9px) clamp(3px,1vw,8px);padding:var(--s2)}
.sep{display:block;border-left:2px dashed var(--table-deep);margin:12% 0 12% calc(50% - 1px)}
.cell{position:relative;display:grid;place-items:center;aspect-ratio:1/1;max-width:100%;border-radius:50%;background:rgb(var(--shade) / .1);box-shadow:inset 0 2px 3px rgb(var(--shade) / .28)}
.d{display:block;position:relative;width:88%;height:88%;border-radius:50%}
.d.r{background:var(--red);box-shadow:inset 0 -3px 0 var(--red-deep),0 2px 2px rgb(var(--shade) / .3)}
.d.b{background:var(--blue);box-shadow:inset 0 -3px 0 var(--blue-deep),0 2px 2px rgb(var(--shade) / .3)}

.d.x{opacity:.6}
.d.x::before,.d.x::after{content:"";position:absolute;left:14%;right:14%;top:44%;height:12%;border-radius:3px;background:var(--paper-hi);transform:rotate(45deg)}

.hidecard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s3);width:100%;max-width:40rem;min-height:9rem;padding:var(--s4);border-radius:12px;border:2.5px dashed var(--table-deep);background:var(--paper-2);text-align:center;font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-lg)}
.hidecard .ico.big{width:2.6em;height:2.6em;color:var(--ink-soft)}
.hidecard .fox{width:calc(var(--text-base) * 3.6)}
.smallbtn{padding:var(--s2) var(--s4);font-size:var(--text-base);background:var(--mark-soft);box-shadow:0 4px 0 var(--mark)}
.smallbtn:active:not(:disabled){box-shadow:0 1px 0 var(--mark)}
.timebar{width:100%;max-width:40rem;height:.6rem;border-radius:var(--r-pill);background:var(--blue-soft);overflow:hidden}
.timebar i{display:block;height:100%;background:var(--blue);border-radius:var(--r-pill);animation:shrink linear forwards}

/* Zahlenhaus */
.house{display:flex;flex-direction:column;align-items:center;width:12rem;max-width:100%}
.roof{display:grid;place-items:end center;width:100%;height:4.4rem;padding-bottom:.35rem;background:var(--ink);clip-path:polygon(50% 0,100% 100%,0 100%);color:var(--paper);font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-2xl);line-height:var(--leading-solid)}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);width:84%;padding:var(--s2);background:var(--paper-2);border:3px solid var(--ink);border-top:0;border-radius:0 0 6px 6px}
.room{padding:var(--s1);border-radius:6px;background:var(--paper-hi);text-align:center;font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-2xl);line-height:var(--leading-heading)}
.room.l{color:var(--red);box-shadow:inset 0 0 0 2.5px var(--red)}
.room.r{color:var(--blue);box-shadow:inset 0 0 0 2.5px var(--blue)}

/* Rechnung: die gesuchte Zahl ist das Grösste auf dem Bildschirm */
.formula{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.22em;font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-5xl);line-height:var(--leading-solid);font-variant-numeric:tabular-nums}
.formula .op{color:var(--ink-faint)}
.slot{display:inline-grid;place-items:center;min-width:1.5em;height:1.3em;padding:0 .18em;border-radius:12px;font-size:var(--text-6xl);background:var(--mark-soft);color:var(--ink);box-shadow:inset 0 0 0 5px var(--mark)}
.slot.empty{color:var(--mark-ink)}
@media (max-width:560px){.formula{font-size:var(--text-4xl)}.slot{font-size:var(--text-5xl)}}
.slot.ok{background:var(--ok-soft);color:var(--ok);box-shadow:inset 0 0 0 5px var(--ok);animation:pop .35s ease-out}
.slot.bad{background:var(--red-soft);color:var(--red-deep);box-shadow:inset 0 0 0 5px var(--red);animation:shake .3s 2}
.slot.rev{background:var(--blue-soft);color:var(--blue);box-shadow:inset 0 0 0 5px var(--blue)}
.mascot{display:flex;align-items:center;justify-content:center;gap:var(--s3);align-self:stretch;min-height:3.5rem}
.mascot .fox{width:calc(var(--text-base) * 3.2)}
.bubble{position:relative;max-width:32rem;padding:var(--s2) var(--s4);border-radius:14px;background:var(--paper-2);font-family:var(--font-display);font-weight:var(--font-regular);font-size:var(--text-lg);line-height:var(--leading-heading)}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-9px;border:9px solid transparent;border-right-color:var(--paper-2);border-left:0}

/* Zahlenfeld */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);width:100%;max-width:24rem;margin:0 auto}
.key{height:calc(var(--text-base) * 3.5);font-size:var(--text-3xl);line-height:var(--leading-solid);font-variant-numeric:tabular-nums}
.key .ico{width:.8em;height:.8em}
.key.del{background:var(--paper-2);color:var(--ink-soft)}
.key.ok{background:var(--ok);color:var(--paper-hi);box-shadow:0 4px 0 var(--ok-deep)}
.key.ok:hover:not(:disabled){background:var(--ok)}
.key.ok:active:not(:disabled){box-shadow:0 1px 0 var(--ok-deep)}
.next{grid-column:1/-1;height:calc(var(--text-base) * 3.5);font-size:var(--text-2xl)}

/* Ende einer Runde */
.end{display:flex;flex-direction:column;align-items:center;gap:var(--s3);width:100%;max-width:36rem;margin:0 auto;padding:var(--s6) var(--s5);background:var(--paper);border-radius:var(--r-card);box-shadow:var(--lift);text-align:center}
.end .fox{width:calc(var(--text-base) * 6)}
.bigstars{display:flex;gap:var(--s3)}
.bigstars .ico{width:calc(var(--text-base) * 3.2);height:calc(var(--text-base) * 3.2);color:var(--mark)}
.bigstars .ico.off{color:var(--line)}
.score{font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-3xl);line-height:var(--leading-heading)}
.sub{font-size:var(--text-lg);font-weight:var(--font-regular);color:var(--ink-soft)}
.progress.big .dot{width:1.5em;height:1.5em}
.won{display:inline-flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s4);border-radius:4px;background:var(--ok-soft);color:var(--ok);font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-base)}
.endbtns{display:grid;gap:var(--s3);width:100%;margin-top:var(--s2)}
.wide{padding:var(--s3) var(--s4);font-size:var(--text-xl)}
.wide.easier{background:var(--mark-soft);box-shadow:0 4px 0 var(--mark)}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s2) var(--s4);margin-top:var(--s2);font-size:var(--text-sm);font-weight:var(--font-regular);color:var(--ink-soft)}
.legend .dot{width:.9em;height:.9em;vertical-align:-.1em;margin-right:.3em}


/* Fenster und Meldungen */
.overlay{
  position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgb(var(--shade) / .5);
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.modal{display:flex;flex-direction:column;gap:var(--s3);width:100%;max-width:34rem;max-height:90vh;overflow:auto;padding:var(--s5);background:var(--paper);border-radius:var(--r-card);box-shadow:0 20px 40px -20px rgb(var(--shade) / .6)}
.modal h3{font-size:var(--text-2xl)}
.modal p,.modal li{color:var(--ink-soft);font-size:var(--text-base);line-height:var(--leading-body)}
.modal li b{color:var(--ink)}
.modal ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:var(--s2)}
.modal label{font-family:var(--font-display);font-weight:var(--font-bold)}
.modal input{width:100%;padding:var(--s3) var(--s4);border-radius:var(--r-key);border:2.5px solid var(--line);background:var(--paper-hi);color:var(--ink);font-size:var(--text-lg);font-weight:var(--font-regular);outline:none}
.modal input:focus{border-color:var(--blue)}
.modal .small{font-size:var(--text-sm)}
.mbtns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:var(--s3);margin-top:var(--s2)}
.mbtn{padding:var(--s2) var(--s4);font-size:var(--text-base)}
.mbtn.stop{background:var(--red);color:var(--paper-hi);box-shadow:0 4px 0 var(--red-deep)}
.mbtn.stop:hover:not(:disabled){background:var(--red)}
#toast{
  position:fixed;left:50%;bottom:calc(var(--s5) + env(safe-area-inset-bottom, 0px));z-index:60;max-width:calc(100vw - 32px);
  padding:var(--s3) var(--s5);border-radius:var(--r-key);background:var(--ink);color:var(--paper);text-align:center;
  font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-base);
  transform:translate(-50%,200%);visibility:hidden;transition:transform .25s ease-out, visibility .25s;
}
#toast.show{transform:translate(-50%,0);visibility:visible}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

/* Mini-Bilder der Übungen */
.m-h{fill:var(--line)} .m-r{fill:var(--red)} .m-b{fill:var(--blue)}
.m-g{fill:none;stroke:var(--ink-faint);stroke-width:1.3;stroke-dasharray:2 1.6}
.m-x{stroke:var(--paper-hi);stroke-width:1.6;stroke-linecap:round}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .card,.card:hover{transform:none}
}

/* Eigenständige Seite: Abstand zu Kamera-Aussparung und Home-Balken */
:root{padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px)}
.pausenplatz{padding:0 var(--s4);font-size:var(--text-sm);color:var(--ink);text-decoration:none}
@media (max-width:620px){.screen-home .top .brand{order:5;flex-basis:100%}}

<script>
'use strict';
/* =========================================================
   Rechentrainer 1 – Zahlenraum bis 20
   Keine Speicherung im Browser, keine Cookies, kein Netzwerk.
   Der Lernstand lebt nur im Arbeitsspeicher und im PDF.
   ========================================================= */

const $app = document.getElementById('app');
const fileIn = document.getElementById('fileIn');
const toastEl = document.getElementById('toast');

const MODULES = [
  {id:1,  title:'Zahlen darstellen', sub:'Wie viele Plättchen?', color:'#d33a2c'},
  {id:2,  title:'Kraft der 5 & 10',  sub:'Schnell sehen',        color:'#2350b5'},
  {id:3,  title:'Zahlen zerlegen',   sub:'Zahlenhäuser',         color:'#d33a2c'},
  {id:4,  title:'Verliebte Zahlen',  sub:'Zusammen immer 10',    color:'#2350b5'},
  {id:5,  title:'Ergänzen bis 20',   sub:'Wie viele fehlen?',    color:'#d33a2c'},
  {id:6,  title:'Verdoppeln',        sub:'Doppelt so viele',     color:'#2350b5'},
  {id:7,  title:'Halbieren',         sub:'Gerecht teilen',       color:'#d33a2c'},
  {id:8,  title:'Plus im 20er-Feld', sub:'Dazulegen',            color:'#2350b5'},
  {id:9,  title:'Minus im 20er-Feld',sub:'Wegnehmen',            color:'#d33a2c'},
  {id:10, title:'Tausch & Umkehr',   sub:'Verwandte Aufgaben',   color:'#2350b5'}
];
const MOD = id => MODULES.find(m => m.id === id);
const LEVELS = [null, {n:'Leicht'}, {n:'Mittel'}, {n:'Schwer'}];
const LDESC = {
  1:['Zahlen bis 10','Zahlen bis 20','Bis 20 – durcheinander'],
  2:['5 und noch etwas','10 und noch etwas','Gemischt, eine Farbe'],
  3:['Zahlen bis 6','Zahlen bis 10','Bis 20 – im Kopf'],
  4:['Mit Hilfspunkten','Ohne Hilfspunkte','Im Kopf, auch minus'],
  5:['Ab 15 bis 20','Ab 10 bis 20','Zu jeder Zahl – im Kopf'],
  6:['Bis 5 + 5','Bis 10 + 10','Im Kopf + fast verdoppeln'],
  7:['Bis 10','Bis 20','Im Kopf'],

function miniV(id){
  const X = c => 7 + c*10.6 + (c>=5?4:0), Y = r => 17 + r*13, R0 = 4.6;
  let s = '';
  for(let r=0;r<2;r++) for(let c=0;c<10;c++) s += `<circle class="m-h" cx="${X(c)}" cy="${Y(r)}" r="${R0}"/>`;
  const row = (r, str) => [...str].forEach((t,c) => {
    const x=X(c), y=Y(r);
    if(t==='r' || t==='x') s += `<circle class="m-r" cx="${x}" cy="${y}" r="${R0}"/>`;
    if(t==='b') s += `<circle class="m-b" cx="${x}" cy="${y}" r="${R0}"/>`;
    if(t==='g') s += `<circle class="m-g" cx="${x}" cy="${y}" r="${R0-.6}"/>`;
    if(t==='x') s += `<path class="m-x" d="M${x-2.4} ${y-2.4}l4.8 4.8M${x+2.4} ${y-2.4}l-4.8 4.8"/>`;
  });
  switch(id){
    case 1: row(0,'rrrrrrr'); break;
    case 2: row(0,'rrrrrbbb'); break;
    case 3: row(0,'rrrrbb'); s += `<path class="m-l" d="M${X(0)-6} 11.5 ${(X(0)+X(5))/2} 2.5 ${X(5)+6} 11.5"/>`; break;
    case 4: row(0,'rrrrrrrbbb'); s += `<path class="m-r" d="M60 39c-4.5-3.2-8.5-5.6-8.5-9.2a4.2 4.2 0 0 1 8.5-1.3 4.2 4.2 0 0 1 8.5 1.3c0 3.6-4 6-8.5 9.2z"/>`; break;
    case 5: row(0,'rrrrrrrrrr'); row(1,'rrrrrrgggg'); break;
    case 6: row(0,'rrrr'); row(1,'bbbb'); break;
    case 7: row(0,'rrrrrrrr'); s += `<path class="m-d" d="M${(X(3)+X(4))/2} 8v29"/>`; break;
    case 8: row(0,'rrrrrrrrrr'); row(1,'rrrbbbb'); break;
    case 9: row(0,'rrrrrrxxx'); break;
    default: row(0,'rrrbbbbb'); row(1,'bbbbbrrr');
  }
  return `<svg class="mini" viewBox="0 0 120 40" aria-hidden="true" focusable="false">${s}</svg>`;
}

const snd = {
  ctx:null, on:true,
  init(){ if(!this.ctx){ const A = window.AudioContext||window.webkitAudioContext; if(A) this.ctx = new A(); } if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  tone(freq, delay, dur, type='sine', vol=.18, freq2){
    if(!this.on) return; this.init(); const c=this.ctx; if(!c) return;
    const t=c.currentTime+delay, o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t); if(freq2) o.frequency.exponentialRampToValueAtTime(freq2,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.02);
  },
  tap(){ this.tone(440,0,.06,'sine',.12,250); },
  ok(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>this.tone(f,i*.08,.22,'triangle',.18)); },
  bad(){ this.tone(300,0,.3,'triangle',.16,190); },
  star(){ [587.33,880,1174.66,1760].forEach((f,i)=>this.tone(f,i*.1,.35,'sine',.18)); }
};

    ttsVoice = vs.find(v => v.lang && v.lang.toLowerCase().startsWith('de') && v.localService === true) || null;
  }catch(e){ ttsVoice = null; }
}

}
function speak(text){

  speechSynthesis.speak(u);
}

/* ---------------- Hilfsfunktionen ---------------- */
const R = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S = {s:1}; // Platzhalter für die Antwort

function cellsBlank(){ return Array.from({length:20}, () => ({c:'', x:false})); }
// Der Reihe nach füllen: rot, blau, Hilfspunkte (leer gestrichelt); die letzten "struck" Plättchen werden durchgestrichen
function fSeq(red, blue=0, struck=0, ghost=0){
  const c = cellsBlank(); let i=0;
  for(let k=0;k<red&&i<20;k++) c[i++].c='r';
  for(let k=0;k<blue&&i<20;k++) c[i++].c='b';
  const filled=i;
  for(let k=0;k<ghost&&i<20;k++) c[i++].c='g';
  for(let k=0;k<struck;k++){ const j=filled-1-k; if(j>=0) c[j].x=true; }
  return c;
}
// Doppelreihe: oben rot, unten blau
function fRows(top, bot){ const c=cellsBlank(); for(let i=0;i<top;i++) c[i].c='r'; for(let i=0;i<bot;i++) c[10+i].c='b'; return c; }
function fScatter(n){
  const idx=[...Array(20).keys()];
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  const c=cellsBlank(); for(let i=0;i<n;i++) c[idx[i]].c='r'; return c;
}
function T(q, parts, answer, cells, o={}){ return Object.assign({q, parts, answer, cells, hidden:false, hint:'', ref:null, house:null}, o); }

/* ---------------- Aufgaben: 10 Übungen × 3 Stufen ---------------- */
function gen(m, L){
  switch(m){
    case 1: {
      if(L===1){ const n=R(1,10); return T('Wie viele Plättchen siehst du?',[S],n,fSeq(n),{hint:'Wo ist die 5? Zähle von dort weiter.'}); }
      if(L===2){ const n=R(8,20); return T('Wie viele Plättchen siehst du?',[S],n,fSeq(n),{hint:'Eine volle Reihe sind 10.'}); }
      const n=R(5,18); return T('Wie viele sind es? Sie liegen durcheinander!',[S],n,fScatter(n),{hint:'Zähle zuerst die obere Reihe, dann die untere.'});
    }
    case 2: {
      if(L===1){ const x=R(1,5); return T('Kraft der 5: Fünf und wie viele noch?',[5,'+',S,'=',5+x],x,fSeq(5,x),{hint:'Die roten sind 5. Wie viele blaue?'}); }
      if(L===2){ const x=R(1,10); return T('Kraft der 10: Zehn und wie viele noch?',[10,'+',S,'=',10+x],x,fSeq(10,x),{hint:'Die obere Reihe ist voll: das sind 10.'}); }
      const v=R(1,3);
      if(v===1){ const n=R(6,19); return T('Wie viele? Denk an die 5 und die 10!',[S],n,fSeq(n),{hint:'Volle Reihe = 10. Halbe Reihe = 5.'}); }
      if(v===2){ const b=pick([5,10]); const x=b===5?R(1,4):R(1,9); return T('Welche Zahl fehlt?',[S,'+',x,'=',b+x],b,fSeq(b+x),{hint:`Wie viele sind es bis zur ${b===5?'Fünf':'Zehn'}?`}); }
      const x=R(1,9); return T('Wie viele sind es zusammen?',[10,'+',x,'=',S],10+x,fSeq(10+x),{hint:'Zehn und noch ein paar.'});
    }
    case 3: {
      const total = L===1?R(3,6):L===2?R(7,10):R(11,20);
      const a = L===3 ? R(Math.max(1,total-10), Math.min(10,total-1)) : L===2 ? R(0,total) : R(1,total-1);
      const b = total-a;
      const leftGap = L===3 && Math.random()<.4;
      const parts = leftGap ? [total,'=',S,'+',b] : [total,'=',a,'+',S];
      const cells = L===2 ? fSeq(a) : leftGap ? fSeq(0,b,0,a) : fSeq(a,0,0,b);
      return T(`Zerlege die ${total}!`, parts, leftGap?a:b, cells,
        {hidden:L===3, house:{total, left:leftGap?S:a, right:leftGap?b:S}, hint:`Zähle weiter bis ${total}.`});
    }
    case 4: {
      if(L===1){ const a=R(1,9); return T('Verliebte Zahlen: Zusammen sind es 10.',[a,'+',S,'=',10],10-a,fSeq(a,0,0,10-a),{hint:'Zähle die leeren Kreise.'}); }
      if(L===2){ const a=R(0,10), sw=Math.random()<.4; return T('Welche Zahl ist verliebt?', sw?[S,'+',a,'=',10]:[a,'+',S,'=',10],10-a,fSeq(a),{hint:'Wie viele fehlen, bis die Reihe voll ist?'}); }
      const a=R(1,9), v=R(1,3);
      if(v===3) return T('Wie viele bleiben übrig?',[10,'−',a,'=',S],10-a,fSeq(10,0,a),{hidden:true,hint:`Welche Zahl ist mit der ${a} verliebt?`});
      return T('Verliebte Zahlen im Kopf!', v===1?[a,'+',S,'=',10]:[S,'+',a,'=',10],10-a,fSeq(a,0,0,10-a),{hidden:true,hint:'Zusammen immer 10!'});
    }
    case 5: {
      if(L===1){ const a=R(15,19); return T('Wie viele fehlen bis 20?',[a,'+',S,'=',20],20-a,fSeq(a,0,0,20-a),{hint:'Zähle die leeren Kreise.'}); }
      if(L===2){ const a=R(10,19); return T('Wie viele fehlen bis 20?',[a,'+',S,'=',20],20-a,fSeq(a),{hint:'Wie viele Kreise sind noch frei?'}); }
      const t=R(11,20), a=R(Math.max(1,t-10),t-2);
      return T('Wie viele fehlen?',[a,'+',S,'=',t],t-a,fSeq(a,0,0,t-a),{hidden:true,
        hint: a<10 ? `Erst bis 10, dann weiter bis ${t}.` : `Zähle von ${a} weiter bis ${t}.`});
    }
    case 6: {
      if(L===1){ const v=R(1,5); return T(`Verdopple die ${v}!`,[v,'+',v,'=',S],2*v,fRows(v,v),{hint:'Oben und unten gleich viele.'}); }
      if(L===2){ const v=R(3,10); return T(`Verdopple die ${v}!`,[v,'+',v,'=',S],2*v,fRows(v,v),{hint: v>5?'Denk an die 5: 5 + 5 = 10.':'Zähle beide Reihen zusammen.'}); }
      if(Math.random()<.5){ const v=R(4,10); return T(`Verdopple die ${v} im Kopf!`,[v,'+',v,'=',S],2*v,fRows(v,v),{hidden:true,hint:'5 + 5 = 10 hilft dir.'}); }
      const a=R(2,9); return T('Fast verdoppeln!',[a,'+',a+1,'=',S],2*a+1,fRows(a,a+1),{hidden:true,hint:`Rechne zuerst ${a} + ${a}. Dann 1 mehr.`});
    }
    case 7: {
      const h = L===1 ? R(1,5) : L===2 ? R(1,10) : R(2,10), t=2*h;
      return T(`Halbiere die ${t}!`,[t,'=',S,'+',S],h, L===2?fSeq(t):fRows(h,h), {hidden:L===3,hint:'Beide Teile sind gleich gross.'});
    }
    case 8: {
      if(L===1){ const a=R(1,8), b=R(1,10-a); return T('Lege dazu. Wie viele sind es?',[a,'+',b,'=',S],a+b,fSeq(a,b),{hint:'Zähle rot und blau zusammen.'}); }
      if(L===2){ const a=R(11,17), b=R(1,19-a); return T('Rechne die Plus-Aufgabe.',[a,'+',b,'=',S],a+b,fSeq(a,b),{hint:`Rechne ${a-10} + ${b}. Die 10 bleibt.`}); }
      const a=R(3,9), b=R(11-a,9);
      return T('Plus über die 10!',[a,'+',b,'=',S],a+b,fSeq(a,b),{hidden:true,hint:`Fülle zuerst die 10 auf: ${a} + ${10-a} = 10. Dann noch ${b-(10-a)} dazu.`});
    }
    case 9: {
      if(L===1){ const a=R(2,10), b=R(1,a); return T('Nimm die durchgestrichenen weg.',[a,'−',b,'=',S],a-b,fSeq(a,0,b),{hint:'Zähle nur die Plättchen ohne Kreuz.'}); }
      if(L===2){ const a=R(11,19), b=R(1,a-10); return T('Nimm weg!',[a,'−',b,'=',S],a-b,fSeq(a,0,b),{hint:`Rechne ${a-10} − ${b}. Die 10 bleibt.`}); }
      const a=R(11,18), b=R(a-9,9);
      return T('Minus über die 10!',[a,'−',b,'=',S],a-b,fSeq(a,0,b),{hidden:true,hint:`Zuerst bis zur 10: ${a} − ${a-10} = 10. Dann noch ${b-(a-10)} weg.`});
    }
    default: {
      const tausch = (a,b,hid) => T('Tauschaufgabe: Die Zahlen tauschen den Platz!',[b,'+',a,'=',S],a+b,fSeq(b,a),{ref:[a,'+',b,'=',a+b],hidden:hid,hint:'Tauschen ändert das Ergebnis nicht.'});
      const umkehr = (a,b,hid) => T('Umkehraufgabe: Rechne zurück!',[a+b,'−',b,'=',S],a,fSeq(a+b,0,b),{ref:[a,'+',b,'=',a+b],hidden:hid,hint:'Die Aufgaben sind verwandt. Schau die grüne Aufgabe an!'});
      if(L===1){ let a,b; do{ a=R(1,8); b=R(1,10-a); }while(a===b); return tausch(a,b,false); }
      if(L===2){ const a=R(1,8), b=R(1,10-a); return umkehr(a,b,false); }
      const a=R(2,10), b=R(2,Math.min(10,20-a)), v=R(1,3);
      return v===1 ? tausch(a,b,true) : v===2 ? umkehr(a,b,true) : umkehr(b,a,true);
    }
  }
}
const taskKey = t => JSON.stringify(t.parts.map(p => p===S?'?':p)) + '|' + t.answer + (t.ref?'r':'');
function makeTasks(m, L){
  const out=[], seen=new Set(); let guard=0;
  while(out.length<ROUND && guard<400){
    guard++;
    const t=gen(m,L), k=taskKey(t);
    if(out.length && taskKey(out[out.length-1])===k) continue;   // nie zweimal gleich hintereinander
    if(seen.has(k) && guard<200) continue;                         // möglichst abwechslungsreich
    seen.add(k); out.push(t);
  }
  return out;
}

/* ---------------- Spielablauf ---------------- */
function startRound(){
  clearTimers();
  const tasks = makeTasks(st.m, st.L);
  st.round = { list: tasks.map((t,i)=>Object.assign({}, t, {oi:i, retry:false})), pos:0, results:Array(ROUND).fill(null), streak:0 };
  st.screen='play'; beginTask();
}
function beginTask(){
  const r=st.round;
  r.cur=r.list[r.pos]; r.input=''; r.tries=0; r.help=false; r.phase='ask'; r.msg=''; r.mood=''; r.shake=false;
  r.frameHidden = st.mode==='practice' && r.cur.hidden; r.blitzEnd=0;
  if(st.mode==='blitz') startBlitz();
  render();
}
function startBlitz(){
  const r=st.round; clearTimeout(blitzTimer);
  const ms=BLITZ_MS[st.L]; r.frameHidden=false; r.blitzMs=ms; r.blitzEnd=Date.now()+ms;
  blitzTimer = setTimeout(() => {
    if(st.round!==r || st.screen!=='play' || !['ask','wrong1'].includes(r.phase)) return;
    r.frameHidden=true; r.blitzEnd=0; render();
  }, ms);
}
function digit(d){
  const r=st.round; if(!r || !['ask','wrong1'].includes(r.phase)) return;
  snd.tap();
  if(r.input==='0') r.input=String(d); else if(r.input.length<2) r.input+=String(d);
  r.shake=false; updateSlots();
}
function delDigit(){ const r=st.round; if(!r || !['ask','wrong1'].includes(r.phase)) return; snd.tap(); r.input=r.input.slice(0,-1); updateSlots(); }
function submit(){
  const r=st.round; if(!r || !['ask','wrong1'].includes(r.phase) || r.input==='') return;
  const t=r.cur, v=parseInt(r.input,10);
  clearTimeout(blitzTimer); r.blitzEnd=0;
  if(v===t.answer){
    snd.ok(); r.phase='correct'; r.streak++; r.frameHidden=false; r.mood='hop';
    const clean = r.tries===0 && !r.help;
    if(!t.retry){ r.results[t.oi] = clean?'g':'y'; if(clean) st.stars++; }
    r.msg = pick(clean?PRAISE:PRAISE2);
    if(r.streak%5===0){ r.msg=`${r.streak} richtig hintereinander!`; setTimeout(()=>{ snd.star(); confetti(); },250); }
    render(); nextTimer=setTimeout(nextTask, 1150);
  } else {
    r.tries++; r.streak=0; snd.bad();
    if(r.tries===1){
      r.phase='wrong1'; r.input=''; r.shake=true; r.frameHidden=false; r.mood='';
      r.msg = 'Fast! ' + (t.hint || 'Schau noch einmal genau.');
      render();
      setTimeout(()=>{ if(st.round===r && r.shake){ r.shake=false; updateSlots(); } }, 700);
    } else {
      r.phase='reveal'; r.input=String(t.answer); r.frameHidden=false; r.mood='';
      if(!t.retry){
        r.results[t.oi]='o';
        r.list.splice(Math.min(r.pos+3, r.list.length), 0, Object.assign({}, t, {retry:true}));
        r.msg=`Die Lösung ist ${t.answer}. Diese Aufgabe kommt gleich nochmal.`;
      } else r.msg=`Die Lösung ist ${t.answer}.`;
      render();
    }
  }
}
function nextTask(){
  clearTimeout(nextTimer);
  const r=st.round; if(!r || st.screen!=='play') return;
  r.pos++;
  if(r.pos>=r.list.length) endRound(); else beginTask();
}
function endRound(){
  clearTimers();
  const r=st.round, score=r.results.filter(x=>x==='g').length, p=prog(st.m,st.L);
  p.r++; p.t+=ROUND; p.c+=score;
  if(st.mode==='practice') p.b=Math.max(p.b,score); else p.bb=Math.max(p.bb,score);
  r.score=score; st.dirty=true; st.screen='end';
  if(score>=8) setTimeout(()=>{ snd.star(); confetti(); },200);
  render();
}
function spoken(parts){ return parts.map(p => p===S?'wie viel' : p==='+'?'plus' : p==='−'?'minus' : p==='='?'gleich' : String(p)).join(' '); }

// Plättchen-Regen: Wendeplättchen fallen und drehen sich – rot auf der einen, blau auf der anderen Seite
function confetti(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.createElement('canvas'); cv.className='confetti'; document.body.appendChild(cv);
  cv.width=innerWidth; cv.height=innerHeight; const ctx=cv.getContext('2d');
  const cs=getComputedStyle(document.documentElement);
  const RED=cs.getPropertyValue('--red').trim()||'#d33a2c', BLUE=cs.getPropertyValue('--blue').trim()||'#2350b5';
  const ps=Array.from({length:70},()=>({x:Math.random()*cv.width,y:-Math.random()*cv.height*.6,vx:(Math.random()-.5)*4,vy:Math.random()*3+3,s:Math.random()*8+12,ph:Math.random()*6.28,vp:Math.random()*.2+.08,rot:Math.random()*3}));
  const t0=performance.now();
  (function f(t){
    ctx.clearRect(0,0,cv.width,cv.height); let alive=false;
    for(const p of ps){
      p.x+=p.vx; p.y+=p.vy; p.vy+=.05; p.ph+=p.vp; if(p.y<cv.height+20) alive=true;
      const k=Math.cos(p.ph);
      ctx.fillStyle = k>=0 ? RED : BLUE;
      ctx.beginPath(); ctx.ellipse(p.x,p.y,p.s/2,Math.max(.8,Math.abs(k)*p.s/2),p.rot,0,Math.PI*2); ctx.fill();
    }
    if(alive && t-t0<4000) requestAnimationFrame(f); else cv.remove();
  })(t0);
}

/* ---------------- PDF: Lernstand erzeugen (ohne Bibliothek) ---------------- */
function pdfEsc(s){
  return String(s).normalize('NFC')
    .replace(/[\u2212\u2013\u2014]/g,'-').replace(/\u2026/g,'...').replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D\u201E]/g,'"')
    .replace(/[^\x20-\x7E\xA0-\xFF]/g,'')
    .replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
}
const b64e = s => { const by=new TextEncoder().encode(s); let bin=''; by.forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin); };
const b64d = s => { const bin=atob(s), by=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) by[i]=bin.charCodeAt(i); return new TextDecoder().decode(by); };

function makeReportPDF(){
  const W=595.28, H=841.89, ops=[];
  const f = n => (Math.round(n*100)/100).toString();
  const col = c => c.map(v=>f(v/255)).join(' ');
  const INK=[59,47,42], MUTED=[140,123,111], GREEN=[34,176,125], YEL=[255,197,49], GREY=[200,188,172];
  const text = (x,y,s,size=10,bold=false,c=INK) => ops.push(`BT /${bold?'F2':'F1'} ${size} Tf ${col(c)} rg ${f(x)} ${f(H-y)} Td (${pdfEsc(s)}) Tj ET`);
  const ctext = (cx,y,s,size=10,bold=false,c=INK) => text(cx - String(s).length*size*(bold?.29:.26), y, s, size, bold, c);
  const rect = (x,y,w,h,c) => ops.push(`${col(c)} rg ${f(x)} ${f(H-y-h)} ${f(w)} ${f(h)} re f`);
  const circ = (cx,cy,r) => { const k=.5523*r, Y=H-cy;
    return `${f(cx+r)} ${f(Y)} m ${f(cx+r)} ${f(Y+k)} ${f(cx+k)} ${f(Y+r)} ${f(cx)} ${f(Y+r)} c ${f(cx-k)} ${f(Y+r)} ${f(cx-r)} ${f(Y+k)} ${f(cx-r)} ${f(Y)} c ${f(cx-r)} ${f(Y-k)} ${f(cx-k)} ${f(Y-r)} ${f(cx)} ${f(Y-r)} c ${f(cx+k)} ${f(Y-r)} ${f(cx+r)} ${f(Y-k)} ${f(cx+r)} ${f(Y)} c`; };
  const dot = (cx,cy,r,fill,stroke) => { if(fill) ops.push(`${col(fill)} rg ${circ(cx,cy,r)} f`); if(stroke) ops.push(`1.3 w ${col(stroke)} RG ${circ(cx,cy,r)} S`); };
  const star = (cx,cy,r,c) => { let p=''; for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*.45:r; p+=`${f(cx+rr*Math.cos(a))} ${f(H-(cy+rr*Math.sin(a)))} ${i?'l':'m'} `; } ops.push(`${col(c)} rg ${p}h f`); };
  const line = (x1,y1,x2,y2,c,w=1) => ops.push(`${w} w ${col(c)} RG ${f(x1)} ${f(H-y1)} m ${f(x2)} ${f(H-y2)} l S`);
  const wrap = (s,size,maxW) => { const maxC=Math.floor(maxW/(size*.5)); const out=[]; let cur='';
    for(const w of s.split(' ')){ if((cur+' '+w).trim().length>maxC){ if(cur) out.push(cur); cur=w; } else cur=(cur+' '+w).trim(); }
    if(cur) out.push(cur); return out; };
  const hex = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));

  const date = new Date().toLocaleDateString('de-CH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  let doneLv=0, totT=0, totC=0;
  MODULES.forEach(m=>[1,2,3].forEach(L=>{ const p=peek(m.id,L); if(p.b>=8) doneLv++; totT+=p.t; totC+=p.c; }));

  // Kopf
  rect(0,0,W,98,[255,236,196]);
  star(54,46,17,YEL);
  text(82,44, st.name?`Lernstand von ${st.name}`:'Mein Lernstand', 22, true);
  text(82,64, 'Rechentrainer 1 · Zahlenraum bis 20', 11, false, MUTED);
  text(82,80, 'Erstellt am '+date, 10, false, MUTED);

  // Zusammenfassung
  const bw=(W-80-24)/3, by=114;
  [['Gesammelte Sterne', String(st.stars), [255,247,224]],
   ['Geschaffte Stufen', `${doneLv} von 30`, [227,248,238]],
   ['Beim 1. Versuch richtig', totT?`${Math.round(totC/totT*100)} %`:'-', [234,242,255]]]
   .forEach(([lab,val,bg],i) => { const x=40+i*(bw+12); rect(x,by,bw,56,bg); text(x+12,by+18,lab,9,false,MUTED); if(i===0) star(x+22,by+38,10,YEL); text(x+(i===0?38:12),by+45,val,20,true); });

  // Tabelle
  const cols=[300,370,440], blitzX=515, ty=190;
  rect(40,ty,W-80,24,[245,236,222]);
  text(50,ty+16,'Übung',10,true);
  ['Leicht','Mittel','Schwer'].forEach((n,i)=>ctext(cols[i],ty+16,n,10,true));
  ctext(blitzX,ty+16,'Blitz',10,true);
  const rowH=34, y0=ty+24;
  MODULES.forEach((m,i) => {
    const y=y0+i*rowH;
    if(i%2) rect(40,y,W-80,rowH,[252,248,240]);
    dot(52,y+17,6,hex(m.color));
    text(66,y+15,`${m.id}. ${m.title}`,11,true);
    text(66,y+27,m.sub,8.5,false,MUTED);
    [1,2,3].forEach((L,j) => {
      const p=peek(m.id,L), s=lvState(m.id,L), cx=cols[j];
      if(s==='done'){ dot(cx-17,y+17,6,GREEN); text(cx-7,y+21,`${p.b}/10`,10,true); }
      else if(s==='played'){ dot(cx-17,y+17,6,YEL); text(cx-7,y+21, p.b>0?`${p.b}/10`:'geübt', 10); }
      else { dot(cx-17,y+17,5.5,null,GREY); text(cx-7,y+21,'offen',9,false,MUTED); }
    });
    let bb=0, bl=0; [1,2,3].forEach(L=>{ const p=peek(m.id,L); if(p.bb>=bb && p.bb>0){ bb=p.bb; bl=L; } });
    ctext(blitzX,y+21, bb?`${bb}/10 (Stufe ${bl})`:'-', 9, false, bb?INK:MUTED);
  });
  const tEnd=y0+10*rowH;
  line(40,tEnd,W-40,tEnd,[230,216,194]);

  // Legende
  const ly=tEnd+18;
  dot(48,ly-3,5,GREEN); text(58,ly,'geschafft (mind. 8 von 10 beim 1. Versuch)',8.5,false,MUTED);
  dot(250,ly-3,5,YEL);  text(260,ly,'geübt (bestes Ergebnis)',8.5,false,MUTED);
  dot(370,ly-3,4.5,null,GREY); text(380,ly,'noch offen',8.5,false,MUTED);
  text(440,ly,'Blitz: bestes Ergebnis',8.5,false,MUTED);

  // Nächste Schritte
  const steps=[], notStarted=[], mastered=[];
  MODULES.forEach(m => {
    if(![1,2,3].some(L=>peek(m.id,L).r>0)){ notStarted.push(m.id); return; }
    if([1,2,3].every(L=>lvState(m.id,L)==='done')){ mastered.push(m.id); return; }
    const L=recLevel(m.id); steps.push(`Übung ${m.id} «${m.title}»: weiter mit Stufe ${LEVELS[L].n}`);
  });
  const lines=[];
  if(!steps.length && !mastered.length) lines.push('Noch keine Übungsrunde gespielt. Start-Tipp: Übung 1 «Zahlen darstellen», Stufe Leicht.');
  steps.slice(0,5).forEach(s=>lines.push(s));
  if(steps.length>5) lines.push(`... und ${steps.length-5} weitere angefangene Übungen`);
  if(mastered.length) lines.push(`Alle Stufen geschafft: Übung ${mastered.join(', ')}`);
  if(notStarted.length && (steps.length||mastered.length)) lines.push(`Noch nicht begonnen: Übung ${notStarted.join(', ')}`);
  let sy=ly+30;
  text(40,sy,'So geht es weiter',13,true); sy+=18;
  lines.slice(0,7).forEach(l=>{ dot(46,sy-3,2.5,INK); text(56,sy,l,10); sy+=15; });

  // Hinweis für Erwachsene
  const hy=Math.max(sy+8,700);
  const hint='Stufen: Leicht mit vollständigem 20er-Feld und Hilfspunkten, Mittel mit weniger Hilfen und grösserem Zahlenraum, Schwer im Kopf (Bild nur auf Wunsch). Eine Stufe gilt als geschafft, wenn in einer Runde mindestens 8 von 10 Aufgaben beim ersten Versuch und ohne Hilfe richtig gelöst wurden. Falsch gelöste Aufgaben werden in der Runde wiederholt.';
  const hl=wrap(hint,8.5,W-104);
  rect(40,hy,W-80,24+hl.length*11,[234,242,255]);
  text(52,hy+15,'Hinweis für Erwachsene',9.5,true);
  hl.forEach((l,i)=>text(52,hy+28+i*11,l,8.5,false,[70,80,100]));

  // Fusszeile
  wrap('Weitermachen: In der App «PDF laden» antippen und diese Datei wählen. Die App speichert keine Daten und überträgt nichts ins Internet.',8,W-80)
    .forEach((l,i)=>text(40,812+i*10,l,8,false,MUTED));

  // Eingebetteter Lernstand (zum Wiederladen)
  const data = b64e(JSON.stringify({app:'rechentrainer1', v:1, name:st.name, stars:st.stars, progress:st.progress}));
  return assemblePDF(ops.join('\n'), data, st.name?`Lernstand ${st.name}`:'Lernstand Rechentrainer');
}

function assemblePDF(content, data, title){
  const objs=[];
  objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objs[2]='<< /Type /Pages /Kids [5 0 R] /Count 1 >>';
  objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  objs[5]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents 6 0 R >>';
  objs[6]=`<< /Length ${content.length} >>\nstream\n${content}\nendstream`;
  objs[7]=`<< /Title (${pdfEsc(title)}) /Producer (Rechentrainer 1) >>`;
  let out='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'; const off=[];
  for(let i=1;i<objs.length;i++){ off[i]=out.length; out+=`${i} 0 obj\n${objs[i]}\nendobj\n`; }
  out+=`%RT-DATA:${data}\n`;
  const xref=out.length;
  out+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`;
  for(let i=1;i<objs.length;i++) out+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  out+=`trailer\n<< /Size ${objs.length} /Root 1 0 R /Info 7 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  const bytes=new Uint8Array(out.length);
  for(let i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&255;
  return bytes;
}

function downloadPDF(bytes){
  const d=new Date(), ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const nm=st.name.replace(/[^A-Za-zÀ-ÿ0-9 _-]/g,'').trim().replace(/\s+/g,'_');
  const blob=new Blob([bytes],{type:'application/pdf'}), url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`Lernstand_Rechentrainer_${nm?nm+'_':''}${ds}.pdf`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}

/* ---------------- PDF: Lernstand wieder laden ---------------- */
function applyState(obj){
  if(!obj || obj.app!=='rechentrainer1' || typeof obj.progress!=='object') throw new Error('format');
  const num=(v,max)=>{ v=Math.floor(Number(v)); return Number.isFinite(v)&&v>=0 ? Math.min(v,max) : 0; };
  const progress={};
  for(let m=1;m<=10;m++) for(let L=1;L<=3;L++){
    const p=obj.progress[m] && obj.progress[m][L]; if(!p) continue;
    (progress[m] || (progress[m]={}))[L] = {r:num(p.r,1e6), b:num(p.b,10), bb:num(p.bb,10), t:num(p.t,1e7), c:num(p.c,1e7)};
  }
  st.progress=progress; st.stars=num(obj.stars,1e7);
  st.name = typeof obj.name==='string' ? obj.name.slice(0,30) : '';
  st.dirty=false; st.screen='home'; st.modal=null; render();
  toast(`Willkommen zurück${st.name?', '+st.name:''}! Dein Lernstand ist geladen.`);
}
fileIn.addEventListener('change', () => {
  const file = fileIn.files && fileIn.files[0]; fileIn.value='';
  if(!file) return;
  const fr=new FileReader();
  fr.onload = () => {
    try{
      const txt=new TextDecoder('latin1').decode(new Uint8Array(fr.result));
      const mm=txt.match(/%RT-DATA:([A-Za-z0-9+\/=]+)/);
      if(!mm){ toast('In diesem PDF ist kein Lernstand. Wähle ein PDF, das du mit dieser App gespeichert hast.'); return; }
      applyState(JSON.parse(b64d(mm[1])));
    }catch(e){ toast('Das PDF konnte nicht gelesen werden. Versuche es mit einer anderen Datei.'); }
  };
  fr.onerror = () => toast('Das PDF konnte nicht gelesen werden. Versuche es mit einer anderen Datei.');
  fr.readAsArrayBuffer(file);
});

/* ---------------- Bedienung ---------------- */
const act = {
  sound(){ st.sound=!st.sound; snd.on=st.sound; if(st.sound) snd.tap(); render(); },
  home(){ clearTimers(); st.round=null; st.screen='home'; st.modal=null; render(); },
  openMod(d){ snd.tap(); st.m=+d.m; st.L=recLevel(st.m); st.screen='module'; render(); },
  level(d){ snd.tap(); st.L=+d.l; render(); },
  start(d){ snd.tap(); st.mode=d.mode; startRound(); },
  toModule(){ clearTimers(); st.round=null; st.screen='module'; render(); },
  d(d){ digit(d.d); }, del(){ delDigit(); }, ok(){ submit(); }, next(){ snd.tap(); nextTask(); },
  help(){ const r=st.round; if(!r) return; snd.tap(); r.help=true; r.frameHidden=false; render(); },
  peek(){ const r=st.round; if(!r) return; snd.tap(); r.help=true; startBlitz(); render(); },
  speak(){ const t=st.round && st.round.cur; if(!t) return; speak(`${t.q} ${t.ref?spoken(t.ref)+'. ':''}${spoken(t.parts)}`); },
  quit(){ st.modal='quit'; render(); },
  quitYes(){ clearTimers(); st.modal=null; st.round=null; st.screen='module'; render(); },
  closeModal(){ st.modal=null; render(); },
  again(){ startRound(); }, up(){ st.L=Math.min(3,st.L+1); startRound(); }, down(){ st.L=Math.max(1,st.L-1); startRound(); },
  saveOpen(){ st.modal='save'; render(); },
  savePdf(){
    const inp=document.getElementById('nameIn');
    st.name=(inp?inp.value:'').trim().slice(0,30);
    try{ downloadPDF(makeReportPDF()); st.dirty=false; st.modal=null; render(); toast('PDF erstellt. Gut aufbewahren!'); }
    catch(e){ console.error(e); toast('Das PDF konnte nicht erstellt werden. Bitte nochmal versuchen.'); }
  },
  load(){ if(st.dirty){ st.modal='loadWarn'; render(); return; } fileIn.click(); },
  loadNow(){ st.modal=null; render(); fileIn.click(); },
  info(){ st.modal='info'; render(); },
};
$app.addEventListener('click', e => {
  const b=e.target.closest('[data-a]'); if(!b || b.disabled) return;
  const fn=act[b.dataset.a]; if(fn) fn(b.dataset);
});
document.addEventListener('keydown', e => {
  if(e.target && e.target.tagName==='INPUT'){ if(e.key==='Enter' && st.modal==='save') act.savePdf(); return; }
  if(st.modal){ if(e.key==='Escape') act.closeModal(); return; }
  if(st.screen!=='play') return;
  if(/^[0-9]$/.test(e.key)) digit(e.key);
  else if(e.key==='Backspace'){ e.preventDefault(); delDigit(); }
  else if(e.key==='Enter'){ e.preventDefault(); if(st.round && st.round.phase==='reveal') nextTask(); else submit(); }
});
window.addEventListener('beforeunload', e => { if(st.dirty){ e.preventDefault(); e.returnValue=''; } });

render();
</script>
