<style>
/* Layout: Sonniger Frühlingstag – heller Himmel oben, Wiese unten, weisse Tierkarten mit bunten Kreisen. Bewusst immer hell. */
:root{
  color-scheme:light;
  --sky:#e3f4ff; --meadow:#effbe3; --paper:#ffffff; --ink:#2b3a42; --ink-soft:#607078; --line:#e2edf2;
  --accent:#ff8a3d; --accent-ink:#ffffff; --moss:#2f9e5e; --sun:#ffd43b; --sun-soft:#fff6cc;
  --garten:#d9f7c6; --wald:#c9f0d9; --wasser:#cdeefe; --berge:#ece3fb; --luft:#fff1b8;
  --kid:#ff8a3d; --ground:#9edb6e; --mole:#4a3f39; --crane:#8d949a; --crane-d:#2e3236;
  --shadow:0 6px 18px rgba(64,140,190,.14);
  --font-display: ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Varela Round","Trebuchet MS",system-ui,sans-serif;
  --font-body: "Andika","Verdana","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:linear-gradient(180deg,var(--sky) 0,var(--sky) 220px,var(--meadow) 620px) var(--meadow);background-attachment:fixed;color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.5;min-height:100vh}
body::after{content:"";position:fixed;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 18px rgba(255,212,59,.35),0 0 0 40px rgba(255,212,59,.15);z-index:-1;pointer-events:none}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(2.2rem,7vw,3.3rem);color:var(--moss)}
h2{font-size:1.35rem}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* Start */
.intro{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.intro p{margin:0;color:var(--ink-soft);font-size:1.1rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{border:2px solid var(--line);background:var(--paper);box-shadow:var(--shadow);border-radius:999px;padding:6px 14px;cursor:pointer;font-family:var(--font-display);font-weight:700}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px 14px;background:var(--paper);border:3px solid transparent;border-radius:26px;box-shadow:var(--shadow);cursor:pointer;text-align:center;transition:transform .15s}
.card:hover{transform:translateY(-4px) rotate(-1deg);border-color:var(--sun)}
.blob{width:96px;height:96px;border-radius:44% 56% 52% 48%/50% 44% 56% 50%;display:grid;place-items:center;font-size:56px;line-height:1}
.blob svg{width:70px;height:70px}
.card b{font-family:var(--font-display);font-size:1.15rem}
.card small{color:var(--ink-soft);font-size:.85rem}

/* Detail */
.back{display:inline-block;text-decoration:none;border:0;background:none;color:var(--moss);font-family:var(--font-display);font-weight:700;font-size:1.05rem;cursor:pointer;padding:4px 0;margin-bottom:10px}
.head{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.head .blob{width:120px;height:120px;font-size:72px}
.head .blob svg{width:88px;height:88px}
.head-txt{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.head-txt .sub{color:var(--ink-soft)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.8rem;padding:2px 10px;border-radius:999px;background:var(--meadow);border:1px solid var(--line)}
.tag.neu{border-color:var(--accent);color:var(--accent)}
.video{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-family:var(--font-display);font-weight:700;padding:10px 20px;border-radius:999px;align-self:flex-start;box-shadow:0 4px 0 #e06a1f}
.video .play{width:0;height:0;border-left:12px solid currentColor;border-top:8px solid transparent;border-bottom:8px solid transparent}
.video-note{font-size:.85rem;color:var(--ink-soft)}
.layout{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px;align-items:start}
@media (max-width:760px){.layout{grid-template-columns:1fr}}
.panel{background:var(--paper);border:0;border-radius:26px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.reader{font-size:1.2rem;line-height:1.75;margin:0;max-width:62ch}
.reader.l1{font-size:1.55rem;line-height:1.9}
.reader.l2{font-size:1.35rem;line-height:1.8}
.slider{display:flex;flex-direction:column;gap:4px;background:var(--sun-soft);border-radius:14px;padding:10px 14px}
.slider label{font-family:var(--font-display);font-weight:700;font-size:.95rem}
.slider input{width:100%;accent-color:var(--accent);height:32px;cursor:pointer}
.ticks{display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink-soft)}
.ticks span.on{color:var(--accent);font-weight:700}
.read{align-self:flex-start;border:0;background:var(--moss);color:#fff;border-radius:999px;padding:6px 18px;cursor:pointer;font-family:var(--font-display);font-weight:700}
.readbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vlabel{font-size:.85rem;color:var(--ink-soft)}
#voice{font:inherit;font-size:.9rem;padding:5px 10px;border-radius:999px;border:2px solid var(--line);background:var(--sky);max-width:100%;min-width:0}
dl.steck{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0}
dl.steck dt{font-family:var(--font-display);font-weight:700;color:var(--moss);font-size:.95rem}
dl.steck dd{margin:0;min-width:0}
.fakt{background:var(--sun-soft);border:3px dashed var(--sun);border-radius:26px;padding:16px 18px}
.fakt h3{font-size:1.05rem;margin-bottom:4px}
.fakt p{margin:0}
.scene{width:100%;height:auto;display:block}
.scene text{fill:var(--ink);font-family:var(--font-display)}
.me{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.95rem}
.me input{width:5.5em;padding:4px 8px;border:2px solid var(--line);border-radius:10px;background:var(--sky);font-variant-numeric:tabular-nums}
.vergleich{font-size:1.1rem;font-family:var(--font-display);margin:0}
footer{margin-top:36px;color:var(--ink-soft);font-size:.85rem;max-width:65ch}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>

const state = {filter:"alle", level:3, kidH:125};
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const glyph = t => t.sym ? `<svg viewBox="0 0 100 100" aria-hidden="true"><use href="#sym-${t.sym}"/></svg>` : `<span aria-hidden="true">${t.g}</span>`;
const bg = t => `var(--${t.raum[0]})`;

function renderHome(){
  stopSpeak();
  const list = TIERE.filter(t => state.filter==="alle" || t.raum.includes(state.filter));
  app.innerHTML = `
    <a class="back" href="../index.html">← Pausenplatz</a>
    <header class="intro">
      <h1>Tierbibliothek</h1>
      <p>Wilde Tiere aus unserer Heimat. Wähle ein Tier und werde zum Tier-Profi!</p>
    </header>
    <div class="chips" role="group" aria-label="Lebensraum wählen">
      <button class="chip" data-f="alle" aria-pressed="${state.filter==="alle"}">Alle Tiere</button>
      ${Object.entries(RAUM).map(([k,r])=>`<button class="chip" data-f="${k}" aria-pressed="${state.filter===k}">${r.label}</button>`).join("")}
    </div>
    <div class="grid">
      ${list.map(t=>`<button class="card" data-id="${t.id}">
        <span class="blob" style="background:${bg(t)}">${glyph(t)}</span>
        <b>${esc(t.name)}</b><small>${t.raum.map(r=>RAUM[r].label).join(" · ")}</small>
      </button>`).join("")}
    </div>
    <footer>Die Texte sind eigene, kindgerechte Zusammenfassungen. Die Videos der Sendungen von BR/KiKA findest du über den Knopf «Folge anschauen» in der ARD Mediathek.</footer>`;
  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{state.filter=b.dataset.f;renderHome();});
  app.querySelectorAll(".card").forEach(b=>b.onclick=()=>{location.hash=b.dataset.id;});
}

function vergleichSatz(t){
  const m=t.m.cm, k=state.kidH, r=m/k;
  const adj = t.m.art==="lang"?"lang":t.m.art==="hoch"?"hoch":"breit mit offenen Flügeln";
  const A = cap(t.art);
  if(r<0.6){ const n=Math.round(k/m); return `Du bist etwa ${n}-mal so gross, wie ${t.art} ${adj} ist.`; }
  if(r<0.9) return `${A} ist fast so ${adj}, wie du gross bist.`;
  if(r<=1.1) return `${A} ist ungefähr so ${adj}, wie du gross bist!`;
  if(r<1.75) return `${A} ist ${adj==="lang"?"länger":adj==="hoch"?"höher":"breiter mit offenen Flügeln"}, als du gross bist.`;
  return `${A} ist etwa ${Math.round(r)}-mal so ${adj}, wie du gross bist.`;
}

function scene(t){
  const W=360,G=212,k=state.kidH,m=t.m.cm;
  const kidW=k*0.32;
  const horiz = t.m.art==="hoch"? m*0.9 : m;
  const vert  = t.m.art==="hoch"? m : t.m.art==="lang"? m*0.7 : m*0.45;
  const sc=Math.min(170/Math.max(k,vert), (W-80)/(kidW+horiz));
  const h=k*sc, kx=36+kidW*sc/2;
  const kid=`<g fill="var(--kid)">
    <circle cx="${kx}" cy="${G-h*0.9}" r="${h*0.085}"/>
    <rect x="${kx-h*0.11}" y="${G-h*0.79}" width="${h*0.22}" height="${h*0.36}" rx="${h*0.06}"/>
    <rect x="${kx-h*0.16}" y="${G-h*0.77}" width="${h*0.05}" height="${h*0.3}" rx="${h*0.025}"/>
    <rect x="${kx+h*0.11}" y="${G-h*0.77}" width="${h*0.05}" height="${h*0.3}" rx="${h*0.025}"/>
    <rect x="${kx-h*0.09}" y="${G-h*0.46}" width="${h*0.075}" height="${h*0.46}" rx="${h*0.03}"/>
    <rect x="${kx+h*0.015}" y="${G-h*0.46}" width="${h*0.075}" height="${h*0.46}" rx="${h*0.03}"/></g>
    <line x1="14" y1="${G}" x2="14" y2="${G-h}" stroke="var(--ink-soft)" stroke-width="1.5"/>
    <line x1="10" y1="${G-h}" x2="18" y2="${G-h}" stroke="var(--ink-soft)" stroke-width="1.5"/>
    <text x="22" y="${G-h-6}" font-size="12">du: ${k} cm</text>`;
  const ax=36+kidW*sc+30, s=m*sc;
  let animal="", tiny=s<12;
  const draw=(x,size)=> t.sym
    ? `<use href="#sym-${t.sym}" x="${x}" y="${G-size}" width="${size}" height="${size}"/>`
    : `<text x="${x}" y="${G-size*0.12}" font-size="${t.m.art==="hoch"?size:size/1.12}">${t.g}</text>`;
  animal = draw(ax, Math.max(s,3));
  let dim="";
  if(t.m.art==="hoch"){
    dim=`<line x1="${ax+s*0.95+8}" y1="${G}" x2="${ax+s*0.95+8}" y2="${G-s}" stroke="var(--accent)" stroke-width="2"/>
         <text x="${Math.min(ax+s*0.95+14,W-50)}" y="${G-s/2}" font-size="12">${m} cm</text>`;
  } else if(!tiny){
    const y = G - (t.m.art==="lang"? s*0.8 : s*0.75) - 8;
    dim=`<line x1="${ax}" y1="${y}" x2="${ax+s}" y2="${y}" stroke="var(--accent)" stroke-width="2"/>
         <line x1="${ax}" y1="${y-4}" x2="${ax}" y2="${y+4}" stroke="var(--accent)" stroke-width="2"/>
         <line x1="${ax+s}" y1="${y-4}" x2="${ax+s}" y2="${y+4}" stroke="var(--accent)" stroke-width="2"/>
         <text x="${ax}" y="${y-6}" font-size="12">${String(m).replace(".",",")} cm</text>`;
  }
  let zoom="";
  if(tiny){
    const zx=Math.min(ax+60,W-90);
    zoom=`<circle cx="${ax+s/2}" cy="${G-s/2}" r="${Math.max(s,6)+4}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="${ax+s/2+10}" y1="${G-12}" x2="${zx-6}" y2="${G-50}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="${zx+30}" cy="${G-70}" r="38" fill="var(--paper)" stroke="var(--accent)" stroke-width="2"/>
      ${t.sym?`<use href="#sym-${t.sym}" x="${zx+6}" y="${G-94}" width="48" height="48"/>`:`<text x="${zx+8}" y="${G-56}" font-size="40">${t.g}</text>`}
      <text x="${zx}" y="${G-118}" font-size="12">vergrössert · ${String(m).replace(".",",")} cm</text>`;
  }
  return `<svg class="scene" viewBox="0 0 ${W} 230" role="img" aria-label="Grössenvergleich: Kind ${k} cm, ${esc(t.name)} ${m} cm">
    <rect x="0" y="${G}" width="${W}" height="18" fill="var(--ground)" rx="4"/>
    ${kid}${animal}${dim}${zoom}</svg>`;
}

function renderTier(t){
  stopSpeak();
  app.innerHTML = `
    <button class="back" id="back">← Alle Tiere</button>
    <div class="head">
      <span class="blob" style="background:${bg(t)}">${glyph(t)}</span>
      <div class="head-txt">
        <h1>${esc(t.name)}</h1>
        ${t.sub?`<span class="sub">${esc(t.sub)}</span>`:""}
        <div class="tags">${t.raum.map(r=>`<span class="tag">${RAUM[r].label}</span>`).join("")}${t.neu?`<span class="tag neu">zugewandert</span>`:""}</div>
        <a class="video" href="${ARD(t.v.titel)}" target="_blank" rel="noopener"><span class="play"></span>Folge anschauen</a>
        <span class="video-note">«${esc(t.v.titel)}» aus ${esc(t.v.reihe)}</span>
      </div>
    </div>
    <div class="layout">
      <div class="col">
        <section class="panel" aria-labelledby="h-text">
          <h2 id="h-text">Das weiss ich über ${esc(t.art)}</h2>
          <div class="slider">
            <label for="lvl">Text: einfacher oder genauer?</label>
            <input type="range" id="lvl" min="1" max="3" step="1" value="${state.level}">
            <div class="ticks"><span data-l="1">Ganz einfach</span><span data-l="2">Einfach</span><span data-l="3">Genau</span></div>
          </div>
          <p class="reader" id="reader"></p>
          <div class="readbar" id="readbar" hidden>
            <button class="read" id="read">Vorlesen</button>
            <label for="voice" class="vlabel">Stimme</label>
            <select id="voice"></select>
          </div>
        </section>
        <section class="panel" aria-labelledby="h-gr">
          <h2 id="h-gr">Wie gross im Vergleich zu dir?</h2>
          <div id="scene"></div>
          <p class="vergleich" id="satz"></p>
          <div class="me"><label for="kidh">Ich bin</label><input type="number" id="kidh" min="80" max="200" value="${state.kidH}"> cm gross</div>
        </section>
      </div>
      <div class="col">
        <section class="panel" aria-labelledby="h-st">
          <h2 id="h-st">Steckbrief</h2>
          <dl class="steck">${Object.entries(t.s).map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
        </section>
        <section class="fakt"><h3>Wusstest du?</h3><p>${esc(t.f)}</p></section>
      </div>
    </div>`;
  document.getElementById("back").onclick=()=>{history.length>1&&location.hash?location.hash="":renderHome();};
  const lvl=document.getElementById("lvl"), reader=document.getElementById("reader");
  const upd=()=>{
    state.level=+lvl.value; reader.textContent=t.t[state.level-1]; reader.className="reader l"+state.level;
    app.querySelectorAll(".ticks span").forEach(s=>s.classList.toggle("on",+s.dataset.l===state.level));
    stopSpeak();
  };
  lvl.oninput=upd; upd();
  const drawScene=()=>{document.getElementById("scene").innerHTML=scene(t);document.getElementById("satz").textContent=vergleichSatz(t);};
  drawScene();
  document.getElementById("kidh").oninput=e=>{const v=+e.target.value;if(v>=80&&v<=200){state.kidH=v;drawScene();}};
  setupVoice(()=>t.name+". "+reader.textContent);
  window.scrollTo(0,0);
}

/* Vorlesen: wählt automatisch die angenehmste deutsche Stimme des Geräts */
const GOOD=["natural","neural","online","premium","enhanced","verbessert","google deutsch","katja","leni","seraphina","amala","vicki","anna","petra","helena","marlene"];
const BAD=["compact","espeak","eloquence","grandma","grandpa","flo","rocko","reed","sandy","shelley","eddy"];
function scoreVoice(v){
  const n=(v.name||"").toLowerCase(); let sc=0;
  if(v.lang==="de-CH")sc+=3; else if((v.lang||"").startsWith("de"))sc+=2; else return -99;
  GOOD.forEach((g,i)=>{if(n.includes(g))sc+= i<6?6:3;});
  BAD.forEach(b=>{if(n.includes(b))sc-=6;});
  if(!v.localService)sc+=1;
  return sc;
}
function germanVoices(){try{return speechSynthesis.getVoices().filter(v=>(v.lang||"").startsWith("de")).sort((a,b)=>scoreVoice(b)-scoreVoice(a));}catch(e){return [];}}
let chosenVoice=null;
try{chosenVoice=localStorage.getItem("tb-voice");}catch(e){}
function setupVoice(getText){
  if(!("speechSynthesis" in window))return;
  const bar=document.getElementById("readbar"), rb=document.getElementById("read"), sel=document.getElementById("voice");
  bar.hidden=false;
  const fill=()=>{
    const vs=germanVoices();
    sel.innerHTML=vs.map(v=>`<option value="${esc(v.name)}">${esc(v.name.replace(/^Microsoft |^Google /,"").replace(/ - .*$/,""))}</option>`).join("");
    sel.hidden=vs.length<2; document.querySelector(".vlabel").hidden=vs.length<2;
    if(chosenVoice&&vs.some(v=>v.name===chosenVoice))sel.value=chosenVoice; else if(vs[0])sel.value=vs[0].name;
  };
  fill(); speechSynthesis.onvoiceschanged=fill;
  sel.onchange=()=>{chosenVoice=sel.value;try{localStorage.setItem("tb-voice",chosenVoice);}catch(e){} stopSpeak();};
  rb.onclick=()=>{
    try{
      if(speechSynthesis.speaking){stopSpeak();return;}
      const u=new SpeechSynthesisUtterance(getText());
      const v=germanVoices().find(x=>x.name===sel.value)||germanVoices()[0];
      if(v){u.voice=v;u.lang=v.lang;}else u.lang="de-DE";
      u.rate=state.level===1?0.82:0.9; u.pitch=1.08;
      u.onend=()=>{rb.textContent="Vorlesen";};
      speechSynthesis.speak(u); rb.textContent="Stopp";
    }catch(e){bar.hidden=true;}
  };
}
function stopSpeak(){try{if("speechSynthesis" in window)speechSynthesis.cancel();}catch(e){} const rb=document.getElementById("read"); if(rb)rb.textContent="Vorlesen";}

function route(){
  const id=location.hash.slice(1); const t=TIERE.find(x=>x.id===id);
  t?renderTier(t):renderHome();
}
window.addEventListener("hashchange",route);
route();
</script>
