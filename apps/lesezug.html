/* Konzept «Lesezug»: Lesen lernen als Fahrt über eine Bahnlinie mit sieben Bahnhöfen.
   Laute sind Wagen, die man aneinanderkoppelt – das ist genau die Synthese.
   Blau ist die Linie, Signalgelb zeigt, wo man gerade ist. Silbenbögen blau/rot wie im Schulzimmer. */
:root{
  --text:"Lesezug Schulschrift","Andika","Chalkboard SE","Trebuchet MS",system-ui,sans-serif;
  --sign:"Lesezug Schild","Lesezug Schulschrift",system-ui,sans-serif;

  --paper:#f3eee3; --surface:#fffdf8; --ink:#1b2632; --ink-soft:#56616c; --rule:#dcd3c2; --rule-strong:#b9ad97;
  --line:#1f4f7a; --line-ink:#ffffff; --line-soft:#e2eaf2;
  --signal:#ffc531; --signal-ink:#1b2632;
  --go:#2c7a4b; --go-soft:#e1f0e5; --stop:#b8432e; --stop-soft:#f8e2db; --wait:#c98a12; --wait-soft:#fbefd2;
  --syl1:#1f5fbf; --syl2:#c23b2c;

  --s1:4px; --s2:8px; --s3:12px; --s4:20px; --s5:32px; --s6:52px;
  --r-card:22px; --r-sign:12px; --r-pill:999px;
  --lift:0 1px 0 rgba(27,38,50,.08),0 10px 24px -16px rgba(27,38,50,.45);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:1.15rem;line-height:1.5;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--signal);outline-offset:3px;box-shadow:0 0 0 7px var(--ink)}
[hidden]{display:none!important}
img{max-width:100%}
h1,h2,h3{font-family:var(--sign);font-weight:500;margin:0;line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.view{min-height:100vh;min-height:100dvh}
.wrap{max-width:1080px;margin:0 auto;padding:var(--s4) clamp(14px,3.5vw,36px) var(--s6)}

/* ---------- Knöpfe ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:10px 26px;border-radius:var(--r-pill);
  border:3px solid var(--ink);background:var(--surface);font-family:var(--sign);font-size:1.2rem;font-weight:500;
  box-shadow:0 4px 0 var(--ink);transition:transform .12s var(--ease),box-shadow .12s var(--ease)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn.go{background:var(--line);color:var(--line-ink)}
.btn.sig{background:var(--signal);color:var(--signal-ink)}
.btn.quiet{border-color:transparent;box-shadow:none;background:transparent;text-decoration:underline;text-underline-offset:4px;min-height:44px;padding:6px 12px}
.btn.small{min-height:44px;font-size:1rem;padding:6px 16px}
.btn[disabled]{opacity:.4;pointer-events:none}
.icon{width:1.3em;height:1.3em;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.round{width:60px;height:60px;padding:0;border-radius:50%;min-height:0}
.round .icon{width:28px;height:28px}

/* ---------- Startseite: Liniennetz ---------- */
.home-top{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s4)}
.mark{font-family:var(--sign);font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.mark i{display:inline-block;width:26px;height:10px;border-radius:5px;background:var(--line);position:relative}
.mark i::after{content:"";position:absolute;right:-3px;top:-4px;width:18px;height:18px;border-radius:50%;background:var(--signal);border:3px solid var(--ink)}
.spacer{flex:1}
.driver{display:flex;align-items:center;gap:10px;background:var(--surface);border:3px solid var(--ink);border-radius:var(--r-pill);padding:4px 16px 4px 4px;min-height:56px}
.driver .dpic{width:44px;height:44px;border-radius:50%;background:var(--paper);padding:3px;display:grid}
.driver .picto{width:100%;height:100%}
.driver b{font-family:var(--sign);font-weight:500}
.home-h{font-size:clamp(2.6rem,9vw,5.6rem);margin:var(--s3) 0 var(--s2)}
.home-h em{font-style:normal;background:linear-gradient(transparent 62%,var(--signal) 62% 92%,transparent 92%)}
.home-lead{color:var(--ink-soft);max-width:34ch;margin-bottom:var(--s5)}
.novoice{background:var(--wait-soft);border-left:6px solid var(--wait);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:var(--s4);font-size:1rem}

/* vertikale Linie (Handy, iPad hochkant) */
.net{list-style:none;margin:0;padding:0;position:relative}
.net::before{content:"";position:absolute;left:37px;top:30px;bottom:30px;width:16px;border-radius:8px;background:var(--line)}
.stop{position:relative;display:grid;grid-template-columns:90px 1fr;align-items:center;margin-bottom:var(--s3)}
.stop-btn{grid-column:1/-1;display:grid;grid-template-columns:90px 1fr auto;align-items:center;text-align:left;border:0;background:none;padding:0}
.dot{width:74px;height:74px;border-radius:50%;background:var(--surface);border:6px solid var(--ink);display:grid;place-items:center;
  font-family:var(--sign);font-size:2rem;position:relative;z-index:1;margin-left:8px;transition:transform .2s var(--ease)}
.stop.here .dot{background:var(--signal)}
.card{background:var(--surface);border:3px solid var(--ink);border-radius:var(--r-card);padding:14px 18px;box-shadow:var(--lift);display:flex;align-items:center;gap:14px;min-height:88px;
  transition:transform .15s var(--ease)}
.stop-btn:hover .card{transform:translateX(4px)}
.stop-btn:active .dot{transform:scale(.92)}
.card .st-ico{width:46px;height:46px;flex:none;color:var(--line)}
.card h2{font-size:1.75rem}
.card p{color:var(--ink-soft);font-size:1rem;line-height:1.3}
.lamps{display:flex;gap:5px;margin-top:6px}
.lamps span{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:var(--surface)}
.lamps span.on{background:var(--go)}
.desk-link{margin-top:var(--s5);display:flex;justify-content:center}

@media (min-width:960px){
  .net{display:grid;grid-template-columns:repeat(7,1fr);gap:0 10px;padding-top:6px}
  .net::before{left:7%;right:7%;top:35px;bottom:auto;width:auto;height:16px}
  .stop{display:block;margin:0}
  .stop-btn{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;gap:14px}
  .dot{margin:0}
  .card{flex-direction:column;min-height:220px;padding:16px 10px;width:100%;justify-content:flex-start}
  .stop-btn:hover .card{transform:translateY(-4px)}
  .card h2{font-size:1.45rem}
  .stop:nth-child(even) .card{margin-top:28px}
}

/* ---------- Kinder wählen ---------- */
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px;margin-top:var(--s4)}
.kid{position:relative;aspect-ratio:1;border:3px solid var(--ink);border-radius:var(--r-card);background:var(--surface);padding:12px;display:grid;place-items:center;box-shadow:var(--lift)}
.kid img,.kid .picto{width:100%;height:100%;object-fit:contain}
.kid .no{position:absolute;left:8px;top:6px;font-family:var(--sign);font-size:1.1rem}
.kid.guest{font-family:var(--sign);font-size:1.4rem;background:var(--paper);border-style:dashed}

/* ---------- Übungsansicht ---------- */
.play-top{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s4)}
.sign{display:flex;align-items:center;gap:10px;background:var(--line);color:var(--line-ink);border-radius:var(--r-sign);padding:6px 14px 6px 6px;font-family:var(--sign);font-size:1.25rem;min-height:52px}
.sign .n{width:40px;height:40px;border-radius:50%;background:var(--signal);color:var(--signal-ink);display:grid;place-items:center;border:3px solid var(--ink)}
.train{display:flex;gap:4px;align-items:flex-end;flex:1;justify-content:flex-end;min-width:0}
.train span{flex:0 1 26px;height:18px;border-radius:5px 5px 3px 3px;border:2.5px solid var(--ink);background:var(--surface);position:relative}

/* =====================================================================
   LESEZUG – Lesen lernen in 7 Bahnhöfen
   Datenschutz: keine Namen, keine Verbindungen ins Internet.
   Ergebnisse bleiben im Browser dieses Geräts (localStorage).
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wait = ms => new Promise(r => setTimeout(r, ms));
const sum = a => a.reduce((x, y) => x + y, 0);
const icon = id => `<svg class="icon"><use href="#${id}"/></svg>`;

/* ---------- Speicher ---------- */
const KEY = 'lesezug-v1';
let storageOK = true;
function freshDB(){
  return { v:1, cur:null,
    set:{ kids:0, pin:null, laute:LAUTE.slice(), on:[1,2,3,4,5,6,7], color:true, cs:'both', len:8, fixed:{} },
    kids:{} };
}
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.v === 1){ d.set = Object.assign(freshDB().set, d.set); d.kids ||= {}; return d; } }
  catch(e){ storageOK = false; }
  return freshDB();
}
let DB = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ storageOK = false; } }

/* Kinder: Erkennungsbild Nr. 1–37 (wie in der Anlaute-App). Ohne Kinderliste: «p0» = dieses Gerät. */
let guest = false;
const GUEST = { lv:{}, win:{}, log:[] };
const kidKeys = () => Array.from({length: Math.min(37, DB.set.kids)}, (_, i) => 'p' + (i + 1));
const kidNo = k => +String(k).slice(1);
const kidPic = k => kidNo(k) ? pictoSVG(WDEF[kidNo(k) - 1][0]) : '';
const kidWord = k => kidNo(k) ? WDEF[kidNo(k) - 1][1] : 'Dieses Gerät';
const kidLabel = k => kidNo(k) ? `Nr. ${kidNo(k)} · ${kidWord(k)}` : 'Ohne Kinderliste';
function curKid(){
  if(guest) return null;
  if(!DB.set.kids) return 'p0';
  return (DB.cur && kidKeys().includes(DB.cur)) ? DB.cur : null;
}
function kd(k = curKid()){
  if(!k) return GUEST;
  return DB.kids[k] ||= { lv:{}, win:{}, log:[] };
}
const fkey = k => k || 'gast';
const fixedLv = (k, st) => (DB.set.fixed[fkey(k)] || {})[st] || 0;
function level(st, k = curKid()){
  const f = fixedLv(k, st); if(f) return f;
  return kd(k).lv[st] || 1;
}
/* Regler: Einstellungen pro Kind, direkt in der Aufgabe änderbar */
function tune(k = curKid()){
  DB.tune ||= {};
  const t = DB.tune[fkey(k)] ||= {};
  if(!t.laute) t.laute = LAUTE.slice();
  if(!t.cs) t.cs = DB.set.cs || 'both';
  if(t.color === undefined) t.color = DB.set.color !== false;
  if(!t.len) t.len = DB.set.len || 8;
  t.focus ||= {}; t.gap ||= 0; t.ms ||= 0; t.wpm ||= 0;
  return t;
}

/* ---------- Ton: eigene Laut-Aufnahmen ---------- */
const AC = window.AudioContext || window.webkitAudioContext;
let actx = null; const BUF = {}; let curSrc = null;
try{ if(navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){}
function initAudio(){
  if(!AC || actx) return;
  try{ actx = new AC(); }catch(e){ actx = null; return; }
  Object.entries(AUDIO).forEach(([k, uri]) => {
    const bin = atob(uri.split(',')[1]); const arr = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    try{ const p = actx.decodeAudioData(arr.buffer, b => { BUF[k] = b; }, () => {}); if(p && p.catch) p.catch(() => {}); }catch(e){}
  });
}
function unlockAudio(){
  initAudio();
  if(actx && actx.state !== 'running'){
    try{ actx.resume(); const s = actx.createBufferSource(); s.buffer = actx.createBuffer(1, 1, 22050); s.connect(actx.destination); s.start(0); }catch(e){}
  }
}
initAudio();
['pointerdown','touchend','keydown'].forEach(ev => document.addEventListener(ev, unlockAudio, {capture:true, passive:true}));

function playLaut(k){
  return new Promise(async res => {
    const b = BUF[k];
    if(!actx || !b) return res();
    try{
      if(actx.state !== 'running'){ try{ await Promise.race([actx.resume(), wait(600)]); }catch(e){} }
      const s = actx.createBufferSource(); s.buffer = b; s.connect(actx.destination);
      let done = false;
      const fin = () => { if(!done){ done = true; clearTimeout(to); if(curSrc === s) curSrc = null; res(); } };
      const to = setTimeout(fin, b.duration * 1000 + 400);
      s.onended = fin; curSrc = s; s.start(0);
    }catch(e){ res(); }
  });
}
/* Rückmeldetöne: werden im Gerät erzeugt, keine Dateien */
function chime(ok){
  if(!actx) return;
  try{
    const t = actx.currentTime;
    const notes = ok ? [[784, 0], [1046, .11]] : [[220, 0], [196, .13]];
    notes.forEach(([f, d]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = ok ? 'sine' : 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t + d); g.gain.linearRampToValueAtTime(ok ? .22 : .16, t + d + .02);
      g.gain.exponentialRampToValueAtTime(.001, t + d + (ok ? .35 : .3));
      o.connect(g); g.connect(actx.destination); o.start(t + d); o.stop(t + d + .4);
    });
  }catch(e){}
}

/* ---------- Stimme: normale Stimme des Geräts (keine Premium-Stimmen) ---------- */
let VOICE = null;
function voiceRank(v){
  const s = (v.voiceURI + ' ' + v.name).toLowerCase();
  if(/premium|enhanced|erweitert|verbessert|neural|natural|online/.test(s)) return 50;
  if(/grandma|grandpa|rocko|eddy|bahh|bells|boing|bubbles|cellos|wobble|whisper|zarvox|trinoids|organ|jester|superstar|bad news|good news|albert|fred|junior|ralph|kathy|sandy|shelley|flo\b|reed/.test(s)) return 40;
  if(/anna|helena|petra|markus|yannick|viktor|martin|marlene|vicki|hans|katja|stefan|hedda|google deutsch/.test(s)) return 0;
  return 5;
}
function findVoice(){
  if(!('speechSynthesis' in window)) return null;
  const vs = speechSynthesis.getVoices().filter(v => /^de/i.test(v.lang) && v.localService !== false && voiceRank(v) < 40);
  vs.sort((a, b) => voiceRank(a) - voiceRank(b) || (/de-CH/i.test(b.lang) - /de-CH/i.test(a.lang)));
  return vs[0] || null;
}
function initVoice(){ VOICE = findVoice(); if(!$('#home').hidden) drawHome(); }
if('speechSynthesis' in window){ VOICE = findVoice(); speechSynthesis.onvoiceschanged = initVoice; }
const hasVoice = () => !!VOICE;
function speakOne(text, rate = .85){
  return new Promise(res => {
    if(!VOICE) return res();
    try{
      const u = new SpeechSynthesisUtterance(text); u.voice = VOICE; u.lang = VOICE.lang; u.rate = rate;
      let done = false; const fin = () => { if(!done){ done = true; clearTimeout(to); res(); } };
      const to = setTimeout(fin, 1600 + text.length * 170 / rate);
      u.onend = u.onerror = fin; speechSynthesis.speak(u);
    }catch(e){ res(); }
  });
}
let seq = 0;
function stopSound(){
  seq++;
  if(curSrc){ try{ curSrc.stop(); }catch(e){} curSrc = null; }
  if('speechSynthesis' in window && (speechSynthesis.speaking || speechSynthesis.pending)){ speechSynthesis.cancel(); return true; }
  return false;
}
/* Liste: 'Text' | {t:'Text', r:Tempo} | {l:'M'} Laut-Aufnahme | {p:ms} Pause | {f:Funktion} */
async function say(list, btn){
  list = Array.isArray(list) ? list : [list];
  const had = stopSound(); const id = seq;
  if(had) await wait(90);
  if(btn) btn.classList.add('speaking');
  for(const x of list){
    if(id !== seq) break;
    if(typeof x === 'string') await speakOne(x);
    else if(x.l){ if(BUF[x.l]) { await playLaut(x.l); await wait(120); } }
    else if(x.p) await wait(x.p);
    else if(x.f) x.f();
    else if(x.t) await speakOne(x.t, x.r || .85);
  }
  if(btn) btn.classList.remove('speaking');
  return id === seq;
}

/* ---------- Ansichten ---------- */
const VIEWS = ['home','pick','play','end','gate','desk'];
function show(v){ VIEWS.forEach(x => $('#' + x).hidden = x !== v); window.scrollTo(0, 0); }
document.addEventListener('click', e => { if(e.target.closest('[data-home]')){ stopSound(); stopTimers(); R = null; drawHome(); show('home'); } });
function toast(t){ const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role','status'); d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 2600); }

/* Bilder mit Schrift darauf (Öl-Flasche) nicht in Leseaufgaben */
const RK = () => LKEYS;
/* ---------- Bilder & Schrift ---------- */
function picHTML(key){
  const it = LEX[key];
  return pictoSVG(it.img.slice(2));
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function glyph(L){
  const lo = L.toLowerCase(), up = cap(lo);
  if(tune().cs === 'klein') return lo;
  if(tune().cs === 'gross') return up;
  return lo === up ? lo : `${up}&#8202;${lo}`;
}
/* Wort mit Silbenbögen */
function sylHTML(it, gap = false){
  return `<span class="${gap ? 'sylgap' : ''}">` + it.syl.map((s, i) => `<span class="syl ${i % 2 ? 'b' : 'a'}">${esc(s)}</span>`).join('') + '</span>';
}

/* Buchstabenfilter: nur Wörter mit eingeführten Buchstaben */
function letterSet(){
  const s = new Set();
  tune().laute.forEach(L => L.toLowerCase().split('').forEach(c => s.add(c)));
  return s;
}
function okLetters(word){
  if(tune().laute.length >= LAUTE.length) return true;
  const s = letterSet();
  return word.toLowerCase().replace(/[^a-zäöüß]/g, '').split('').every(c => s.has(c));
}
function filt(list, getWord, min = 4){
  const f = list.filter(x => okLetters(getWord(x)));
  return f.length >= min ? f : list;
}

/* ---------- Fahrt (Runde) ---------- */
let R = null; let TIMERS = [];
const later = (fn, ms) => { const t = setTimeout(fn, ms); TIMERS.push(t); return t; };
function stopTimers(){ TIMERS.forEach(clearTimeout); TIMERS = []; if(LLT) { clearInterval(LLT); LLT = null; } }

function withKid(fn){
  if(guest || curKid()) return fn();
  PENDING = fn; openPick();
}
let PENDING = null;
function openPick(){
  const box = $('#kids'); box.innerHTML = '';
  kidKeys().forEach(k => {
    const b = document.createElement('button');
    b.className = 'kid'; b.setAttribute('aria-label', `Nummer ${kidNo(k)}, ${kidWord(k)}`);
    b.innerHTML = `<span class="no">${kidNo(k)}</span>${kidPic(k)}`;
    b.onclick = () => { DB.cur = k; guest = false; save(); const fn = PENDING; PENDING = null; if(fn) fn(); else { drawHome(); show('home'); } };
    box.append(b);
  });
  const g = document.createElement('button');
  g.className = 'kid guest'; g.textContent = 'Gast'; g.setAttribute('aria-label', 'Gast, ohne Auswertung');
  g.onclick = () => { guest = true; DB.cur = null; save(); const fn = PENDING; PENDING = null; if(fn) fn(); else { drawHome(); show('home'); } };
  box.append(g);
  show('pick');
  say('Welches Bild gehört dir? Tippe darauf.');
}

function startStation(st){
  withKid(() => {
    stopTimers();
    document.body.classList.toggle('nocolor', !tune().color);
    closeTune();
    R = { st, i:0, res:[], len: tune().len, lv0: level(st), last:null, cur:null };
    $('#sign').innerHTML = `<span class="n">${st}</span>${ST[st].name}`;
    show('play'); drawTrain(); next();
  });
}
function drawTrain(){
  const t = $('#train'); let h = '';
  for(let i = 0; i < R.len; i++){
    const r = R.res[i];
    h += `<span class="${r === 1 ? 'ok' : r === 0 ? 'no' : i === R.i ? 'now' : ''}"></span>`;
  }
  t.innerHTML = h + '<span class="loco"></span>';
}
function next(){
  stopTimers(); stopSound();
  if(R.i >= R.len) return endRound();
  const lv = level(R.st);
  const foc = tune().focus[R.st];
  const subs = (foc && (foc !== 'SW' || hasVoice())) ? [foc] : PLAN[R.st][lv].filter(s => s !== 'SW' || hasVoice());
  /* Abwechslung: nicht zweimal dieselbe Aufgabenart, schwächere Art etwas öfter */
  let pool = subs.length > 1 ? subs.filter(s => s !== R.last) : subs;
  const log = kd().log.slice(-60);
  const weight = s => { const l = log.filter(e => e.u === s); if(l.length < 3) return 2; return 1 + (1 - sum(l.map(e => e.ok)) / l.length) * 2; };
  const tot = sum(pool.map(weight)); let x = Math.random() * tot; let sub = pool[0];
  for(const s of pool){ x -= weight(s); if(x <= 0){ sub = s; break; } }
  R.last = sub;
  R.cur = { sub, lv, t0: Date.now(), done:false, say:null };
  $('#stage').innerHTML = ''; $('#opts').innerHTML = ''; $('#opts').className = 'opts'; $('#acts').innerHTML = '';
  $('#fb').textContent = ''; $('#fb').className = 'fb'; $('#ptext').textContent = '';
  drawTrain();
  GEN[sub](lv);
}
const ONCE = ['SZ','SO','SF','WB','BW','SB','JN','MA','KT','BZ','BS','LL','BL','BB','L'];
function prompt(text, sayList){
  $('#ptext').textContent = text;
  R.cur.say = sayList;
  $('#again').hidden = !sayList;
  R.told ||= new Set();
  const once = ONCE.includes(R.cur.sub);
  if(sayList && (!once || !R.told.has(R.cur.sub))) say(sayList, $('#again'));
  R.told.add(R.cur.sub);
}
$('#again').onclick = () => { if(!R || !R.cur) return; if(R.cur.replay) R.cur.replay(); else if(R.cur.say) say(R.cur.say, $('#again')); };

/* Ergebnis festhalten und Stufe anpassen */
function record(ok, info = {}){
  const k = curKid(); const d = kd(k);
  const e = Object.assign({ t: Date.now(), s: R.st, u: R.cur.sub, l: R.cur.lv, ok: ok ? 1 : 0, ms: Date.now() - R.cur.t0 }, info);
  d.log.push(e); if(d.log.length > 2500) d.log.splice(0, d.log.length - 2500);
  R.res[R.i] = ok ? 1 : 0;
  /* Anpassung an das Niveau */
  const w = (d.win[R.st] ||= []); w.push(ok ? 1 : 0); if(w.length > 8) w.shift();
  if(!fixedLv(k, R.st)){
    const lv = level(R.st, k), max = ST[R.st].max;
    if(w.length >= 6 && sum(w.slice(-6)) >= 5 && lv < max){ d.lv[R.st] = lv + 1; d.win[R.st] = []; }
    else if(w.length >= 4 && sum(w.slice(-4)) <= 1 && lv > 1){ d.lv[R.st] = lv - 1; d.win[R.st] = []; }
  }
  if(k) save();
}
const PRAISE = ['Richtig!','Genau!','Super!','Stimmt!','Toll gelesen!'];
/* Gemeinsame Auswertung: el = getippte Karte, rightEl = richtige Karte */
function judge(ok, el, rightEl, info, after){
  if(R.cur.done) return; R.cur.done = true;
  $('#opts').classList.add('locked');
  record(ok, info);
  drawTrain();
  chime(ok);
  if(el) el.classList.add(ok ? 'ok' : 'wrong');
  const fb = $('#fb');
  if(ok){
    fb.textContent = pick(PRAISE); fb.className = 'fb ok';
    (async () => { if(after) await say(after); later(advance, after && hasVoice() ? 350 : 1000); })();
  } else {
    if(rightEl) rightEl.classList.add('right');
    document.querySelectorAll('#opts .opt').forEach(o => { if(o !== el && o !== rightEl) o.classList.add('dim'); });
    fb.textContent = 'So ist es richtig.'; fb.className = 'fb no';
    if(after) later(() => say(after), 450);
    $('#acts').innerHTML = `<button class="btn go" id="goOn">Weiter</button>`;
    $('#goOn').onclick = advance; $('#goOn').focus({preventScroll:true});
  }
}
function advance(){ if(!R) return; R.i++; next(); }

function endRound(){
  stopSound();
  const ok = sum(R.res), lv1 = level(R.st);
  const up = lv1 > R.lv0, down = lv1 < R.lv0;
  let t = '';
  for(let i = 0; i < R.len; i++) t += `<span class="${R.res[i] ? 'ok' : 'no'}"></span>`;
  $('#endBody').innerHTML = `
    <h1>${ok >= R.len - 1 ? 'Endstation – super gefahren!' : ok >= R.len / 2 ? 'Endstation erreicht!' : 'Endstation. Gut geübt!'}</h1>
    <div class="train">${t}<span class="loco"></span></div>
    <p class="score">${ok} von ${R.len} Wagen grün</p>
    ${up ? `<p class="levelup">Du fährst jetzt auf Stufe ${lv1}. Das wird spannender!</p>` : ''}
    ${down ? `<p class="muted">Die nächste Fahrt ist etwas leichter.</p>` : ''}
    <div class="actions"><button class="btn go" id="endAgain">Nochmals fahren</button><button class="btn" data-home>Zum Liniennetz</button></div>`;
  $('#endAgain').onclick = () => startStation(R.st);
  show('end');
  say(up ? `Super! Du fährst jetzt auf Stufe ${lv1}.` : ok >= R.len / 2 ? 'Endstation! Gut gemacht.' : 'Endstation. Du hast gut geübt.');
}

/* ---------- Bausteine für Antworten ---------- */
function optBtn(cls, html, label){
  const b = document.createElement('button'); b.className = 'opt ' + cls; b.innerHTML = html;
  if(label) b.setAttribute('aria-label', label);
  $('#opts').append(b); return b;
}
function picOpts(keys, target, info, after){
  $('#opts').className = 'opts';
  let right = null;
  keys.forEach(k => {
    const b = optBtn('pic', picHTML(k), LEX[k].w);
    if(k === target) right = b;
    b.onclick = () => judge(k === target, b, right, Object.assign({c:k}, info(k)), after);
  });
}
function textOpts(items, target, cls, info, after, render = x => esc(x)){
  let right = null;
  items.forEach(x => {
    const b = optBtn(cls, render(x));
    if(x === target) right = b;
    b.onclick = () => judge(x === target, b, right, Object.assign({c:x}, info(x)), after);
  });
}
function ynOpts(answer, info, after){
  $('#opts').className = 'opts yn';

function lev(a, b){
  const m = a.length, n = b.length; const d = Array.from({length:m + 1}, (_, i) => [i]);
  for(let j = 1; j <= n; j++) d[0][j] = j;
  for(let i = 1; i <= m; i++) for(let j = 1; j <= n; j++) d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[m][n];
}
const VOW = ['a','e','i','o','u'];
function mutate(w){
  const lo = w.toLowerCase(); const ch = lo.split(''); const capd = w[0] !== lo[0];
  const tries = [];
  ch.forEach((c, i) => {
    if(VOW.includes(c)) VOW.filter(v => v !== c).forEach(v => tries.push(ch.slice(0,i).concat(v, ch.slice(i+1)).join('')));
    if(LOOK[c]) LOOK[c].forEach(v => v.length === 1 && tries.push(ch.slice(0,i).concat(v, ch.slice(i+1)).join('')));
    if(i < ch.length - 1 && ch[i] !== ch[i+1]) { const s = ch.slice(); [s[i], s[i+1]] = [s[i+1], s[i]]; tries.push(s.join('')); }
  });
  const out = shuffle([...new Set(tries)]).filter(x => x !== lo);
  return out.map(x => capd ? cap(x) : x);
}
function similar(w, pool, n){
  const lo = w.toLowerCase();
  const real = shuffle(pool.filter(x => x.toLowerCase() !== lo)).map(x => [x, lev(x.toLowerCase(), lo) + (x[0].toLowerCase() === lo[0] ? 0 : 1.5)]).sort((a, b) => a[1] - b[1]).slice(0, 6).map(x => x[0]);
  return real.slice(0, n);
}

};

  h += `<div class="trow"><label for="tLen"><b>Aufgaben pro Fahrt</b> <span id="tLenOut">${T.len}</span></label><input type="range" id="tLen" min="4" max="16" step="2" value="${T.len}"></div>
  <div class="actions" style="justify-content:flex-start"><button class="btn go small" id="tApply">Neue Aufgabe mit diesen Einstellungen</button><button class="btn small" id="tClose">Schliessen</button></div>`;
  const box = $('#tune'); box.innerHTML = h;
  const persist = () => { if(curKid() || guest) save(); };
  $('#tLv').oninput = e => {

    if(v) DB.set.fixed[key][st] = v; else delete DB.set.fixed[key][st];
    if(!v){ kd(k).win[st] = []; }
    const c = level(st, k);
    $('#tLvOut').textContent = v ? 'Stufe ' + v : 'Automatisch (jetzt ' + c + ')';
    $('#tLvDesc').textContent = LVDESC[st][v || c];
    e.target.setAttribute('aria-valuetext', v ? 'Stufe ' + v : 'automatisch');
    persist();
  };
  box.querySelectorAll('#tFoc [data-f]').forEach(b => b.onclick = () => { if(b.dataset.f) T.focus[st] = b.dataset.f; else delete T.focus[st]; box.querySelectorAll('#tFoc [data-f]').forEach(x => x.setAttribute('aria-pressed', x === b)); persist(); });
  box.querySelectorAll('#tLaute [data-l]').forEach(b => b.onclick = () => {
    const L = b.dataset.l;
    if(T.laute.includes(L)){ if(T.laute.length <= 3){ toast('Mindestens drei Buchstaben.'); return; } T.laute = T.laute.filter(x => x !== L); } else T.laute = LAUTE.filter(x => x === L || T.laute.includes(x));
    b.setAttribute('aria-pressed', T.laute.includes(L)); persist();
  });
  box.querySelectorAll('[data-la]').forEach(b => b.onclick = () => { T.laute = b.dataset.la === 'all' ? LAUTE.slice() : ['A','M','L']; persist(); drawTune(); });
  box.querySelectorAll('#tCs [data-v]').forEach(b => b.onclick = () => { T.cs = b.dataset.v; box.querySelectorAll('#tCs [data-v]').forEach(x => x.setAttribute('aria-pressed', x === b)); persist(); });
  box.querySelectorAll('#tCol [data-v]').forEach(b => b.onclick = () => { T.color = b.dataset.v === '1'; document.body.classList.toggle('nocolor', !T.color); box.querySelectorAll('#tCol [data-v]').forEach(x => x.setAttribute('aria-pressed', x === b)); persist(); });
  const rng = (id, out, key, fmt) => { const el = $('#' + id); if(el) el.oninput = e => { T[key] = +e.target.value; $('#' + out).textContent = fmt(T[key]); persist(); }; };
  rng('tGap', 'tGapOut', 'gap', v => v ? v + ' ms' : 'nach Stufe');
  rng('tMs', 'tMsOut', 'ms', v => v ? (v / 1000).toLocaleString('de-CH') + ' s' : 'nach Stufe');
  rng('tWpm', 'tWpmOut', 'wpm', v => v ? v + ' Wörter/min' : 'nach Stufe');
  $('#tLen').oninput = e => { T.len = +e.target.value; $('#tLenOut').textContent = T.len; if(R.len !== T.len && T.len > R.i){ R.len = T.len; drawTrain(); } persist(); };
  $('#tApply').onclick = () => { closeTune(); next(); };
  $('#tClose').onclick = closeTune;
}

function dialog({title, text, ok = 'Ja', cancel = 'Abbrechen', danger = false, input = false}){

/* ---------- Auswertung ---------- */
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const fmtD = t => new Date(t).toLocaleDateString('de-CH', {day:'numeric', month:'numeric'});
function stStatus(acc, n){ if(n < 5) return 'n'; if(acc >= .8) return 'g'; if(acc >= .6) return 'y'; return 'r'; }
const STATUS_TXT = { g:'sicher', y:'im Aufbau', r:'hier hakt es', n:'zu wenig Daten' };

function count(arr){ const m = {}; arr.forEach(x => m[x] = (m[x] || 0) + 1); return Object.entries(m).sort((a, b) => b[1] - a[1]); }
function analyze(k){
  const log = (DB.kids[k] || {log:[]}).log;
  const res = { st:{}, stuck:null, last: log.length ? log[log.length - 1].t : null, total: log.length };
  for(let st = 1; st <= 7; st++){
    const L = log.filter(e => e.s === st);
    const rec = L.slice(-20);
    const acc = rec.length ? sum(rec.map(e => e.ok)) / rec.length : 0;
    const subs = {};
    L.slice(-60).forEach(e => { const s = subs[e.u] ||= {n:0, ok:0}; s.n++; s.ok += e.ok; });
    const errs = L.slice(-60).filter(e => !e.ok);
    const r = { n: L.length, recN: rec.length, acc, status: stStatus(acc, rec.length), lv: level(st, k), fixed: fixedLv(k, st), subs, patterns:[], tips:[] };
    /* Verlauf: Trefferquote pro Übungstag */
    const days = {}; L.forEach(e => { const d = new Date(e.t).toDateString(); (days[d] ||= []).push(e.ok); });
    r.days = Object.values(days).slice(-12).map(a => sum(a) / a.length);
    PATTERN[st] && PATTERN[st](r, L.slice(-60), errs);
    res.st[st] = r;
  }
  for(const st of DB.set.on){ if(res.st[st].status === 'r' && res.st[st].recN >= 8){ res.stuck = st; break; } }
  return res;
}
const subAcc = (r, u) => r.subs[u] && r.subs[u].n >= 3 ? r.subs[u].ok / r.subs[u].n : null;
const weakSubs = r => Object.entries(r.subs).filter(([u, s]) => s.n >= 3 && s.ok / s.n < .6).map(([u]) => u);

const PATTERN = {
  1(r, L, errs){
    const sk = errs.filter(e => e.u === 'SK'); const la = errs.filter(e => e.u === 'LA');
    const few = sk.filter(e => e.e === 'zu-wenige').length, many = sk.filter(e => e.e === 'zu-viele').length;
    if(sk.length >= 2) r.patterns.push(few > many ? `Klatscht oft zu wenige Silben (${few}×) – lange Wörter werden zusammengezogen.` : `Klatscht oft zu viele Silben (${many}×) – trennt eher nach Lauten als nach Silben.`);
    const laFew = la.filter(e => e.e === 'zu-wenige').length;
    if(la.length >= 2) r.patterns.push(laFew >= la.length / 2 ? `Hört beim Laute-Zählen zu wenige Laute (${laFew}×), meist gehen Selbstlaute in der Mitte verloren.` : `Zählt beim Laute-Zählen zu viele Laute.`);
    const fr = errs.filter(e => e.e === 'falscher-reim').length, nr = errs.filter(e => e.e === 'reim-nicht-erkannt').length;
    if(fr + nr >= 2) r.patterns.push(fr > nr ? `Sagt bei Reimen oft «Ja», obwohl es sich nicht reimt (${fr}×) – achtet vermutlich auf den Anfang statt auf das Ende.` : `Erkennt echte Reime oft nicht (${nr}×).`);
    const aj = errs.filter(e => e.u === 'AJ' || e.u === 'AW');
    if(aj.length >= 2) r.patterns.push(`Anlaut unsicher bei: ${[...new Set(aj.map(e => e.u === 'AW' ? e.x : e.n))].slice(0, 6).join(', ')}.`);
    const w = weakSubs(r);
    if(w.includes('SK')) r.tips.push('Silben schwingen: Wörter langsam sprechen und dabei gehen oder klatschen, zuerst mit Namen der Kinder.');
    if(w.includes('RJ') || w.includes('RW') || w.includes('RO')) r.tips.push('Reimpaare mit Bildkarten legen, das Reimende betont sprechen («Maus – H-aus»). Reimverse und Reimkette im Kreis.');
    if(w.includes('AJ') || w.includes('AW') || w.includes('IL')) r.tips.push('Anlaut dehnen («Mmmmond»), Mundbild im Spiegel zeigen, Anlaut-Sammelkiste mit Gegenständen.');
    if(w.includes('LA')) r.tips.push('Laute mit Plättchen legen: für jeden Laut ein Plättchen, dabei das Wort ganz gedehnt sprechen.');
  },
  2(r, L, errs){
    const conf = count(errs.filter(e => e.u === 'LB' || e.u === 'BL').map(e => `«${e.x}» → «${e.c}»`)).slice(0, 4);
    if(conf.length) r.patterns.push('Verwechslungen (gehört → gewählt): ' + conf.map(([p, n]) => `${p}${n > 1 ? ' (' + n + '×)' : ''}`).join(', ') + '.');
    const per = {}; L.filter(e => ['LB','BL','BB'].includes(e.u)).forEach(e => { const p = per[e.x] ||= {n:0, ok:0}; p.n++; p.ok += e.ok; });
    const unsure = Object.entries(per).filter(([x, p]) => p.n >= 2 && p.ok / p.n < .5).map(([x]) => x);
    if(unsure.length) r.patterns.push(`Noch unsicher: ${unsure.join(', ')}.`);
    const look = errs.filter(e => e.e === 'sieht-aehnlich').length, klang = errs.filter(e => e.e === 'klang-aehnlich').length;
    if(look >= 2) r.tips.push('Formähnliche Buchstaben (b/d/p, m/n) nicht gleichzeitig einführen. Bewegungsspur nachfahren, Merkbild zu jedem Buchstaben.');
    if(klang >= 2) r.tips.push('Klangähnliche Laute gegenüberstellen: Mundbild und Lautgebärde zeigen, Hand an den Hals («summt es?»).');
    if(!r.tips.length && r.status === 'r') r.tips.push('Weniger Buchstaben gleichzeitig üben: im Regler der Aufgabe nur die bekannten Buchstaben auswählen.');
  },
  3(r, L, errs){
    const an = errs.filter(e => e.e === 'nur-anlaut').length, en = errs.filter(e => e.e === 'nur-ende').length;
    if(errs.length >= 2 && an >= errs.length / 2) r.patterns.push(`Rät vom ersten Laut aus (${an} von ${errs.length} Fehlern): Das Wort wird nicht ganz zusammengezogen.`);
    else if(en >= 2) r.patterns.push(`Hält sich an das Wortende (${en}×): Anfangslaute gehen beim Zusammenziehen verloren.`);
    const by = {}; L.forEach(e => { const b = e.n <= 3 ? '2–3' : e.n === 4 ? '4' : '5+'; const x = by[b] ||= {n:0, ok:0}; x.n++; x.ok += e.ok; });
    const parts = ['2–3','4','5+'].filter(b => by[b] && by[b].n >= 3).map(b => `${b} Laute ${pct(by[b].ok, by[b].n)} %`);
    if(parts.length) r.patterns.push('Gelingt bei ' + parts.join(' · ') + '.');
    const h = subAcc(r, 'H'), l = subAcc(r, 'L');
    if(h !== null && l !== null && h - l > .25) r.patterns.push('Hörend gelingt das Zusammenziehen besser als mit Buchstaben: Laut-Buchstaben-Zuordnung prüfen.');
    if(r.status === 'r' || an >= 2) r.tips.push('Gedehnt lesen statt einzeln lautieren: «Mmmaaammmaaa» statt «M – a – m – a». Laute ineinander gleiten lassen, mit dem Finger unter dem Wort ziehen.');
    if(by['4'] && by['4'].n >= 3 && by['4'].ok / by['4'].n < .6) r.tips.push('Zuerst Silben aus zwei Lauten koppeln (ma, mo, la), dann erst längere Wörter. Im Regler Stufe 1 einstellen.');
  },
  4(r, L, errs){
    if(errs.filter(e => e.e === 'reihenfolge').length >= 2) r.patterns.push('Ordnet Silben oft in falscher Reihenfolge: Bild wird erkannt, die Silben werden aber nicht gelesen.');
    if(errs.filter(e => e.e === 'falsche-silbe').length >= 2) r.patterns.push('Fehlende Silbe wird oft falsch ergänzt.');
    if(r.status !== 'g' && r.n >= 5) r.tips.push('Silbenteppich mit wenigen Buchstaben, Silben mit Bögen unterstreichen lassen. Silbenbögen im Regler auf blau/rot lassen.');
  },
  5(r, L, errs){
    const sw = count(errs.filter(e => e.u === 'SW').map(e => e.x)).slice(0, 8);
    if(sw.length) r.patterns.push('Häufige Wörter noch nicht sicher: ' + sw.map(([w]) => w).join(', ') + '.');
    const ung = errs.filter(e => e.e === 'ungenau-gelesen').length, anf = errs.filter(e => e.e === 'nur-anfang').length;
    if(ung >= 2) r.patterns.push(`Liest ungenau (${ung}×): wählt Wörter, die fast gleich aussehen.`);
    if(anf >= 2) r.patterns.push(`Liest nur den Wortanfang (${anf}×) und rät den Rest.`);
    const sAcc = subAcc(r, 'SW'), wAcc = subAcc(r, 'WB');
    if(sAcc !== null && sAcc < .6) r.tips.push('Häufige Wörter als Wortkarten im Spiel «Blitzlicht» oder Memo üben, wenige Wörter pro Woche.');
    if(ung + anf >= 2) r.tips.push('Mit dem Finger bis ans Wortende lesen. Wortpaare vergleichen (Hut – Hat): «Was ist anders?»');
  },
  6(r, L, errs){
    const ma = count(errs.filter(e => e.u === 'MA' && e.e).map(e => e.e));
    const MTXT = {'falsche-farbe':'falsche Farbe','falsches-ding':'falsches Ding','nur-teil':'nur einen Teil erledigt','zu-viel-angemalt':'zu viel angemalt'};
    if(ma.length) r.patterns.push('Anweisungen: ' + ma.map(([e, n]) => `${MTXT[e] || e} (${n}×)`).join(', ') + '.');
    const kt = subAcc(r, 'KT'), jn = subAcc(r, 'JN'), sb = subAcc(r, 'SB');
    if(sb !== null && jn !== null && sb - jn > .25) r.patterns.push('Erkennt Nomen im Satz, versteht aber den ganzen Satz noch nicht sicher (Ja/Nein-Fragen schwächer).');
    if(kt !== null && kt < .6) r.patterns.push('Kurztexte: Informationen aus dem Text werden noch nicht sicher gefunden.');
    if(r.status !== 'g' && r.n >= 5) r.tips.push('Nach jedem Satz kurz innehalten: «Was habe ich gelesen?» Lesemalblätter mit einer Anweisung pro Zeile.');
  },
  7(r, L, errs){
    const bz = L.filter(e => e.u === 'BZ');
    const by = {}; bz.forEach(e => { const x = by[e.n] ||= {n:0, ok:0}; x.n++; x.ok += e.ok; });
    const okMs = Object.entries(by).filter(([ms, x]) => x.n >= 3 && x.ok / x.n >= .75).map(([ms]) => +ms).sort((a, b) => a - b)[0];
    if(okMs) r.patterns.push(`Erkennt Wörter sicher bei ${okMs} ms Blitzzeit.`);
    const miss = count(errs.filter(e => e.u === 'BZ').map(e => e.x)).slice(0, 8);
    if(miss.length) r.patterns.push('Im Blitz verpasst: ' + miss.map(([w]) => w).join(', ') + '.');
    const ll = L.filter(e => e.u === 'LL');
    const llOk = ll.filter(e => e.ok).map(e => e.n);
    if(llOk.length) r.patterns.push(`Lauflicht mit Verständnis geschafft bis ${Math.max(...llOk)} Wörter pro Minute.`);
    if(ll.length >= 3 && sum(ll.map(e => e.ok)) / ll.length < .6) r.tips.push('Lauflicht ist zu schnell für das Verstehen: Tempo bremsen, gleichen Text mehrmals lesen (wiederholtes Lesen).');
    if(r.status === 'r') r.tips.push('Blitzzeit verlängern: im Regler eine längere Blitzzeit einstellen. Häufige Wörter zuerst ohne Zeitdruck sichern.');
  }
};

let TAB = 'kind', SELKID = null;
function openDesk(tab){ TAB = tab || TAB; if(tab === 'kind') SELKID = curKid(); show('desk'); drawDesk(); }
document.querySelectorAll('.tabs [data-tab]').forEach(b => b.onclick = () => { TAB = b.dataset.tab; drawDesk(); });
function deskKids(){
  const ks = kidKeys();

function lampCell(r, stuck){

function kindHTML(){

  const k = SELKID, a = analyze(k);
  let h = '';
  if(noData) return `<div class="panel empty"><h2>Noch keine Fahrten</h2><p class="hint" style="margin:0 auto">Sobald ein Kind übt, sehen Sie hier für jeden Bahnhof, wie sicher es ist, welche Fehler typisch sind und wo es hängt – zum Beispiel beim Zusammenziehen der Laute.${DB.set.kids ? '' : ' Wenn mehrere Kinder dasselbe Gerät benutzen: unter «Einstellungen» die Anzahl Kinder festlegen.'}</p></div>`;
  if(ks.length > 1) h += `<div class="kidsel noprint" role="group" aria-label="Kind wählen">${ks.map(x => `<button data-kid="${x}" aria-current="${x === k}" aria-label="${kidLabel(x)}"><small>${kidNo(x) || ''}</small>${kidPic(x) || 'Gerät'}</button>`).join('')}</div>`;
  h += `<div class="panel"><div class="kidhead">${kidPic(k) ? `<span class="kpic">${kidPic(k)}</span>` : ''}<div style="flex:1"><h2>${kidLabel(k)}</h2>
    <p class="muted">${a.total ? `${a.total} Aufgaben · zuletzt geübt am ${fmtD(a.last)}` : 'Noch keine Aufgaben gelöst.'}${a.stuck ? ` · <span class="stuckname">hängt bei ${a.stuck} ${ST[a.stuck].name}</span>` : ''}</p></div>
    <button class="btn small noprint" data-print>${icon('i-print')}Drucken</button></div></div>`;
  h += '<div class="stgrid">';
  DB.set.on.forEach(n => {
    const r = a.st[n];
    const subs = Object.entries(r.subs).map(([u, s]) => {
      const p = s.ok / s.n; const c = p >= .8 ? 'var(--go)' : p >= .6 ? 'var(--signal)' : 'var(--stop)';
      return `<div class="subrow"><span>${SUBS[u]}</span><span class="track"><i style="width:${Math.round(p * 100)}%;background:${c}"></i></span><span class="small">${Math.round(p * 100)}%</span></div>`;
    }).join('');
    const spark = r.days.length > 1 ? `<div class="spark" title="Trefferquote pro Übungstag">${r.days.map(p => `<i style="height:${Math.max(3, p * 26)}px;background:${p >= .8 ? 'var(--go)' : p >= .6 ? 'var(--signal)' : 'var(--stop)'}"></i>`).join('')}</div>` : '';
    h += `<article class="stcard ${a.stuck === n ? 'stuck' : ''}"><header><span class="hd">${n}</span><h3>${ST[n].name}</h3><span class="lamp ${r.status}" title="${STATUS_TXT[r.status]}"></span></header>
      <p class="small muted">${r.recN ? `${Math.round(r.acc * 100)} % richtig (letzte ${r.recN}) · ${r.n} Aufgaben total · ${STATUS_TXT[r.status]}` : 'Noch nicht geübt.'}</p>
      ${spark}${subs}
      ${r.patterns.map(p => `<p class="pattern">${esc(p)}</p>`).join('')}
      ${r.tips.slice(0, 2).map(p => `<p class="tip">${esc(p)}</p>`).join('')}
      <p class="small"><b>Stufe ${r.lv}</b> von ${ST[n].max} · ${r.fixed ? 'im Regler festgehalten' : 'passt sich automatisch an'}</p>
    </article>`;
  });
  h += '</div>';
  if(a.total) h += `<div class="actions noprint" style="justify-content:flex-start"><button class="btn small danger" data-delkid="${k}">Daten dieses Kindes löschen</button></div>`;
  return h;
}
const LEVELTXT = {
  1:'Stufe 1: Reime erkennen, Silben bei kurzen Wörtern, Anlaut ja/nein. Stufe 2: Reimwort finden, Bild zum Anlaut, Laute zählen (2–3). Stufe 3: Reim-Ausreisser, lange Wörter, Laut im Wort, Laute zählen (4–5).',
  2:'Stufe 1: 3 Buchstaben zur Auswahl, gut unterscheidbar. Stufe 2: 4 Buchstaben, einer klingt ähnlich, dazu Buchstabe → Laut. Stufe 3: 6 Buchstaben mit klang- und formähnlichen.',
  3:'Stufe 1: 2–3 Laute hören und koppeln. Stufe 2: 4 Laute, Ablenker mit gleichem Anlaut; dazu Buchstaben-Wagen mit 3 Lauten. Stufe 3: 5 und mehr Laute.',
  7:'Blitzzeit: Stufe 1 = 1,5 s, 2 = 1 s, 3 = 0,7 s, 4 = 0,45 s (mit Blitzsätzen), 5 = 0,3 s. Lauflicht: 20 bis 58 Wörter pro Minute.'
};
function einstHTML(){
  const s = DB.set;
  return `<div class="panel"><h2>Kinder</h2>
    <div class="field"><div><b>Anzahl Kinder</b><p class="hint">Jedes Kind wählt ein Erkennungsbild (Nr. 1 bis ${s.kids || 'n'}). Gleiche Bilder und Nummern wie in der Anlaute-App. Keine Namen in der App.</p></div>
      <div class="stepper"><button class="btn round" data-kids="-1" aria-label="Ein Kind weniger">${icon('i-minus')}</button><b>${s.kids}</b><button class="btn round" data-kids="1" aria-label="Ein Kind mehr">${icon('i-plus')}</button></div></div>
    <div class="field"><div><b>Liste zum Ausdrucken</b><p class="hint">Bilder mit Nummern, daneben Platz für die Namen von Hand.</p></div><button class="btn small" data-printlist>${icon('i-print')}Liste drucken</button></div></div>

  <div class="panel"><h2>Liniennetz</h2>
    <div class="field"><div><b>Sichtbare Bahnhöfe</b><p class="hint">Ausgeschaltete Bahnhöfe sehen die Kinder nicht.</p></div>
      <div class="chips">${[1,2,3,4,5,6,7].map(n => `<button data-on="${n}" aria-pressed="${s.on.includes(n)}">${n} ${ST[n].name}</button>`).join('')}</div></div>
    <h3>Differenzierung</h3>
    <p class="hint">Stufe, Aufgabenart, bekannte Buchstaben, Pausen, Blitzzeit und Tempo stellen Sie direkt in der Aufgabe ein: oben rechts auf «Regler» tippen. Die Einstellung gilt für das Kind, das gerade übt. Steht die Stufe auf «Auto», passt sich die App selbst an: nach 5 richtigen von 6 Aufgaben eine Stufe höher, nach 3 Fehlern in 4 Aufgaben eine tiefer.</p>
  </div>

  <div class="panel"><h2>Stimme</h2>
    <p class="hint">${hasVoice() ? `Vorlesestimme für Anleitungen und Wörter: <b>${esc(VOICE.name)}</b> (normale Stimme des Geräts).` : '<b>Keine deutsche Stimme gefunden.</b> Die eingesprochenen Laute funktionieren, aber Anleitungen und Wörter werden nicht vorgelesen.'}</p>
    <p class="hint" style="margin-top:8px">Die Laute kommen immer aus Ihren eigenen Aufnahmen. Premium-Stimmen werden bewusst nicht verwendet.</p></div>

  <div class="panel"><h2>Daten und Zugang</h2>
    <p class="hint">Alle Ergebnisse bleiben im Browser dieses Geräts. Nichts wird ins Internet übertragen. Wird der Browserverlauf gelöscht, sind auch die Ergebnisse weg.</p>
    <div class="actions" style="justify-content:flex-start"><button class="btn small" data-pinnew>PIN ändern</button><button class="btn small danger" data-wipe>Alle Lerndaten löschen</button></div>
    ${storageOK ? '' : '<p class="msg">Achtung: Dieser Browser lässt kein Speichern zu (privates Surfen?). Ergebnisse gehen beim Schliessen verloren.</p>'}</div>`;
}
function bindDesk(){
  const B = $('#deskBody');
  B.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => { TAB = b.dataset.goto; drawDesk(); });
  B.querySelectorAll('[data-kid]').forEach(b => b.onclick = () => { SELKID = b.dataset.kid; TAB = 'kind'; drawDesk(); });
  B.querySelectorAll('[data-print]').forEach(b => b.onclick = () => window.print());
  B.querySelectorAll('[data-fix]').forEach(b => b.onclick = () => {
    const [n, v] = b.dataset.fix.split(':').map(Number);
    const f = DB.set.fixed[SELKID] ||= {};
    if(v) f[n] = v; else { delete f[n]; }
    if(!v && kd(SELKID).lv[n] === undefined) kd(SELKID).lv[n] = 1;
    save(); drawDesk();
  });
  B.querySelectorAll('[data-delkid]').forEach(b => b.onclick = async () => {
    if(await dialog({title:'Daten löschen?', text:`Alle Ergebnisse von ${kidLabel(b.dataset.delkid)} werden gelöscht. Das lässt sich nicht rückgängig machen.`, ok:'Löschen', danger:true})){
      delete DB.kids[b.dataset.delkid]; delete DB.set.fixed[b.dataset.delkid]; save(); drawDesk(); toast('Gelöscht.');
    }
  });
  B.querySelectorAll('[data-kids]').forEach(b => b.onclick = () => { DB.set.kids = Math.max(0, Math.min(37, DB.set.kids + +b.dataset.kids)); save(); drawDesk(); });
  B.querySelectorAll('[data-laut]').forEach(b => b.onclick = () => {
    const L = b.dataset.laut, s = DB.set.laute;
    if(s.includes(L)){ if(s.length <= 3){ toast('Mindestens drei Laute auswählen.'); return; } s.splice(s.indexOf(L), 1); } else s.push(L);
    DB.set.laute = LAUTE.filter(x => s.includes(x)); save(); b.setAttribute('aria-pressed', DB.set.laute.includes(L));
  });
  B.querySelectorAll('[data-lauteall]').forEach(b => b.onclick = () => { DB.set.laute = b.dataset.lauteall === '1' ? LAUTE.slice() : ['A','M','L']; save(); drawDesk(); if(b.dataset.lauteall === '0') toast('Nur A, M, L bleiben. Wählen Sie die eingeführten Laute dazu.'); });
  B.querySelectorAll('[data-on]').forEach(b => b.onclick = () => {
    const n = +b.dataset.on, on = DB.set.on;
    if(on.includes(n)){ if(on.length === 1) return; on.splice(on.indexOf(n), 1); } else on.push(n);
    DB.set.on = on.sort((a, b) => a - b); save(); drawDesk();
  });
  B.querySelectorAll('[data-color]').forEach(b => b.onclick = () => { DB.set.color = b.dataset.color === '1'; document.body.classList.toggle('nocolor', !DB.set.color); save(); drawDesk(); });
  B.querySelectorAll('[data-cs]').forEach(b => b.onclick = () => { DB.set.cs = b.dataset.cs; save(); drawDesk(); });
  B.querySelectorAll('[data-len]').forEach(b => b.onclick = () => { DB.set.len = +b.dataset.len; save(); drawDesk(); });
  B.querySelectorAll('[data-pinnew]').forEach(b => b.onclick = () => { DB.set.pin = null; save(); openGate(); });
  B.querySelectorAll('[data-wipe]').forEach(b => b.onclick = async () => {
    if(await dialog({title:'Alle Lerndaten löschen?', text:'Die Ergebnisse aller Kinder werden gelöscht. Einstellungen und PIN bleiben. Das lässt sich nicht rückgängig machen.', ok:'Alles löschen', danger:true})){
      DB.kids = {}; DB.set.fixed = {}; DB.cur = null; save(); drawDesk(); toast('Alle Lerndaten gelöscht.');
    }
  });
  B.querySelectorAll('[data-printlist]').forEach(b => b.onclick = () => {
    const ks = kidKeys(); if(!ks.length){ toast('Zuerst die Anzahl Kinder festlegen.'); return; }
    $('#deskBody').innerHTML = `<div class="panel"><h2>Erkennungsbilder Lesezug</h2><p class="hint noprint">Wird gedruckt …</p>
      <table class="matrix" style="min-width:0"><tbody>${ks.map(k => `<tr><td class="who" style="width:90px"><span class="wpic" style="width:56px;height:56px">${kidPic(k)}</span>${kidNo(k)}</td><td style="text-align:left">${kidWord(k)}</td><td style="width:55%;border-bottom:1px solid var(--ink)"></td></tr>`).join('')}</tbody></table></div>`;
    setTimeout(() => { window.print(); drawDesk(); }, 200);
  });
}

/* ---------- Lernstand-Code fürs Lehrerzimmer ---------- */
const lsqrHas = k => !!(DB.kids[k] && DB.kids[k].log && DB.kids[k].log.length);
LernstandQR.init({
  app:'lesezug', title:'Lesezug',
  kids(){ return deskKids().filter(lsqrHas).map(k => ({ id:k, label:kidLabel(k), short: kidNo(k) ? 'Nr. ' + kidNo(k) : 'Gerät', pic: kidPic(k) })); },
  current(){ return curKid(); },
  build(k){
    if(!k || !lsqrHas(k)) return null;
    const a = analyze(k);
    const b = [];
    b.push({k:'kpi', i:[[String(a.total), 'Aufgaben gelöst'], [a.last ? new Date(a.last).toLocaleDateString('de-CH') : '–', 'zuletzt geübt'], [a.stuck ? `${a.stuck} ${ST[a.stuck].name}` : '–', 'hängt bei']]});
    b.push({k:'tab', h:['Bahnhof','Stand','richtig (zuletzt)','Aufgaben','Stufe'], r: DB.set.on.map(n => { const r = a.st[n]; return [`${n} ${ST[n].name}`, [STATUS_TXT[r.status], r.status], r.recN ? `${Math.round(r.acc * 100)} % (letzte ${r.recN})` : '–', String(r.n), `${r.lv} von ${ST[n].max}${r.fixed ? ', fest' : ''}`]; })});
    b.push({k:'legend', i:[['g','sicher (ab 80 %)'],['y','im Aufbau (60 bis 79 %)'],['r','hier hakt es'],['n','zu wenig Daten']]});
    DB.set.on.forEach(n => {
      const r = a.st[n]; if(!r.n) return;
      b.push({k:'h', s:r.status, x:`${n} ${ST[n].name}${a.stuck === n ? ' · hier hängt es' : ''}`});
      if(r.days.length > 1) b.push({k:'spark', o:1, i:r.days.map(p => Math.round(p * 100)), x:'Trefferquote pro Übungstag'});
      const subs = Object.entries(r.subs).map(([u, s]) => { const p = Math.round(s.ok / s.n * 100); return [SUBS[u] || u, p, p >= 80 ? 'g' : p >= 60 ? 'y' : 'r']; });
      if(subs.length) b.push({k:'bars', i:subs});
      r.patterns.slice(0, 3).forEach((p, i) => b.push(i ? {k:'p', o:1, x:p} : {k:'p', x:p}));
      if(r.status === 'r' || r.status === 'y') r.tips.slice(0, 1).forEach(p => b.push({k:'p', s:'tip', o:1, x:p}));
    });
    return { s:'Lesen lernen in 7 Bahnhöfen', w: kidNo(k) ? `Erkennungsbild Nr. ${kidNo(k)} · ${kidWord(k)}` : 'ohne Kinderliste (dieses Gerät)', b };
  }
});
$('#lsqrBtn').onclick = () => { if(typeof stopSound === 'function') stopSound(); LernstandQR.open(); };

/* ---------- Start ---------- */
drawHome(); show('home');

</script>
