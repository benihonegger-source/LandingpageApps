/* Layout: Materialtisch. Die Fläche ist Karton, darauf liegen Karteikarten, ein Zettel und das 20er-Feld.
   Rot und Blau gehören den Wendeplättchen. Blau führt durch die App (Hauptfarbe), Leuchtstift-Gelb markiert (Akzent). */
:root{
  color-scheme:light;
  /* ---- Farben ---- */
  --table:#e3d2b3;      /* Karton */
  --table-deep:#cbb187;
  --paper:#fcf8f0;
  --paper-hi:#fffdf8;
  --paper-2:#f3ebda;
  --line:#e2d4bb;
  --ink:#2a231e;
  --ink-soft:#5c4f43;
  --ink-faint:#9a8a78;
  --red:#d33a2c; --red-deep:#9f2a1f; --red-soft:#f8e0db;
  --blue:#2350b5; --blue-hi:#2b5cc8; --blue-deep:#173a88; --blue-soft:#dfe7f7; --blue-line:#bccbea;
  --mark:#f5bd1f; --mark-soft:#fdeaa8; --mark-ink:#6b4a00;
  --ok:#2c7a50; --ok-deep:#1d5638; --ok-soft:#d8ecdc;
  --again:#cf6428;
  --fox:#e0742c; --fox-deep:#b4561a; --fox-cream:#fff4e3;
  --shade:42 35 30; /* RGB-Werte für Schatten */

  /* ---- Schrift ---- */
  --font-display: "Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-text: "Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
  --ratio:1.25;
  --text-base: clamp(1.05rem, .97rem + .4vw, 1.3rem);
  --text-sm: calc(var(--text-base) / var(--ratio));
  --text-xs: calc(var(--text-sm) / var(--ratio));
  --text-lg: calc(var(--text-base) * var(--ratio));
  --text-xl: calc(var(--text-lg) * var(--ratio));
  --text-2xl: calc(var(--text-xl) * var(--ratio));
  --text-3xl: calc(var(--text-2xl) * var(--ratio));
  --text-4xl: calc(var(--text-3xl) * var(--ratio));
  --text-5xl: calc(var(--text-4xl) * var(--ratio));
  --text-6xl: calc(var(--text-5xl) * var(--ratio));
  --font-regular:400; --font-bold:700; /* Outfit ist in zwei Schnitten eingebettet */
  --leading-body:1.5; --leading-heading:1.2; --leading-solid:1;
  --tracking-label:.07em;

  /* ---- Raum (wächst mit der Basisgrösse) ---- */
  --s1:calc(var(--text-base) * .25); --s2:calc(var(--text-base) * .5); --s3:calc(var(--text-base) * .75);
  --s4:var(--text-base); --s5:calc(var(--text-base) * 1.5); --s6:calc(var(--text-base) * 2); --s7:calc(var(--text-base) * 3);
  --r-card:6px; --r-key:14px; --r-pill:999px;
  --lift: 0 1px 0 rgb(var(--shade) / .08), 0 12px 20px -14px rgb(var(--shade) / .55);
  --press: 0 4px 0 var(--table-deep);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:clip}
body{
  margin:0;min-height:100%;background:var(--table);color:var(--ink);
  background-image:radial-gradient(rgb(var(--shade) / .06) 1px, transparent 1.3px);background-size:7px 7px;
  font-family:var(--font-text);font-size:var(--text-base);font-weight:var(--font-regular);line-height:var(--leading-body);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0;text-align:inherit}
input{font:inherit;-webkit-user-select:text;user-select:text}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:var(--font-bold);line-height:var(--leading-heading);text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{
  max-width:68rem;margin:0 auto;display:flex;flex-direction:column;gap:var(--s5);
  padding-block:var(--s4) var(--s7);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.ico{width:1.25em;height:1.25em;flex:none;display:block}

/* ---- Knöpfe: Kartonplättchen, die man hinunterdrückt ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:44px;min-width:44px;
  border-radius:var(--r-key);background:var(--paper);color:var(--ink);box-shadow:var(--press);
  font-family:var(--font-display);font-weight:var(--font-bold);line-height:var(--leading-heading);
  transition:transform .08s ease-out, box-shadow .08s ease-out, background-color .15s;
}
.btn:hover:not(:disabled){background:var(--paper-hi)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--table-deep)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--blue);color:var(--paper-hi);box-shadow:0 4px 0 var(--blue-deep)}
.btn.primary:hover:not(:disabled){background:var(--blue-hi)}
.btn.primary:active:not(:disabled){box-shadow:0 1px 0 var(--blue-deep)}
.iconbtn{width:calc(var(--text-base) * 2.7);height:calc(var(--text-base) * 2.7);padding:0}
.iconbtn .ico{width:50%;height:50%}

/* ---- Kopfzeile ---- */
.top{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.spacer{flex:1}
.brand{display:flex;align-items:center;gap:var(--s3)}
.brand b{display:block;font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-xl);line-height:var(--leading-heading)}
.brand small{display:block;font-size:var(--text-sm);font-weight:var(--font-regular);color:var(--ink-soft)}
.chips{display:inline-flex;gap:3px}
.chip{width:1.05em;height:1.05em;border-radius:50%;display:inline-block}
.chip.r{background:var(--red);box-shadow:inset 0 -2px 0 var(--red-deep)}
.chip.b{background:var(--blue);box-shadow:inset 0 -2px 0 var(--blue-deep)}
.brand .chips .chip{width:1.4em;height:1.4em}
.stars{
  display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;padding:var(--s1) var(--s4) var(--s1) var(--s3);
  background:var(--paper);border-radius:var(--r-pill);box-shadow:var(--lift);
  font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-lg);font-variant-numeric:tabular-nums;
}
.stars .ico{color:var(--mark);width:1.3em;height:1.3em}

/* ---- Fuchs ---- */
.fox{display:block;width:calc(var(--text-base) * 3.4);height:auto;flex:none;overflow:visible}
.fx-o{fill:var(--fox)} .fx-d{fill:var(--fox-deep)} .fx-c{fill:var(--fox-cream)} .fx-i{fill:var(--ink)} .fx-w{fill:var(--paper-hi)}
.fx-l{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.fox.hop{animation:hop .55s ease-out}

/* ---- Startseite: Raster mit bewusstem Bruch ---- */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:end;gap:var(--s4);padding-top:var(--s3)}
.hero .fox{width:calc(var(--text-base) * 5.2);transform:rotate(-9deg) translateY(14%)}
.hero-txt{display:flex;flex-direction:column;gap:var(--s2);padding-bottom:var(--s2);min-width:0}
.eyebrow{font-size:var(--text-sm);font-weight:var(--font-bold);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-soft)}
.hero h1{font-size:var(--text-4xl);max-width:13ch}
.hero h1 em{font-style:normal;padding-inline:.06em;background:linear-gradient(transparent 58%, var(--mark) 58%, var(--mark) 92%, transparent 92%)}
@media (min-width:760px){
  .hero{grid-template-columns:1fr 3fr 1fr}
  .hero .fox{grid-column:1;justify-self:end;width:calc(var(--text-base) * 6.4)}
  .hero-txt{grid-column:2}
  .hero h1{font-size:var(--text-5xl)}
}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,11.5rem),1fr));gap:var(--s5) var(--s4);padding-top:var(--s2)}
.card{
  position:relative;display:flex;flex-direction:column;gap:var(--s2);text-align:left;
  padding:var(--s4) var(--s4) var(--s3);background:var(--paper);border-radius:var(--r-card);box-shadow:var(--lift);
  transform:rotate(var(--tilt,0deg));transition:transform .18s ease-out, box-shadow .18s ease-out;
}
.card:nth-child(4n+1){--tilt:-1.3deg}
.card:nth-child(4n+2){--tilt:.9deg}
.card:nth-child(4n+3){--tilt:-.5deg}
.card:nth-child(4n){--tilt:1.4deg}
.card:hover{transform:rotate(0deg) translateY(-4px)}
.card:active{transform:rotate(0deg) translateY(1px);box-shadow:0 1px 0 rgb(var(--shade) / .1)}
.card .num{position:absolute;bottom:var(--s2);right:var(--s3);font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-2xl);line-height:var(--leading-solid);color:var(--line)}
.card .mini{width:100%;max-width:9.5rem;height:auto;margin-bottom:var(--s1)}
.card .tt{font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-lg);line-height:var(--leading-heading)}
.card .st{font-size:var(--text-sm);font-weight:var(--font-regular);color:var(--ink-soft);line-height:var(--leading-heading)}
.pips{display:flex;gap:var(--s2);margin-top:auto;padding-top:var(--s2)}
.pip{width:.85em;height:.85em;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink-faint)}
.pip.played{background:var(--mark);box-shadow:none}
.pip.done{background:var(--ok);box-shadow:none}

.slip{
  position:relative;display:flex;flex-wrap:wrap;gap:var(--s4);align-items:center;justify-content:space-between;
  margin-top:var(--s4);padding:var(--s5);background:var(--paper);border-radius:var(--r-card);box-shadow:var(--lift);transform:rotate(-.4deg);
}
.slip::before{content:"";position:absolute;top:-10px;left:50%;width:5.5rem;height:22px;transform:translateX(-50%) rotate(-3deg);background:var(--mark-soft);opacity:.9}
.sliptxt{display:flex;flex-direction:column;gap:var(--s1);max-width:30rem;min-width:0}
.sliptxt h2{font-size:var(--text-xl)}
.sliptxt p{font-size:var(--text-sm);font-weight:var(--font-regular);color:var(--ink-soft)}
.sliptxt p.warn{color:var(--mark-ink);background:var(--mark-soft);padding:var(--s1) var(--s2);border-radius:4px}
.slip-btns{display:flex;flex-wrap:wrap;gap:var(--s3)}
.slip-btns .btn{padding:var(--s2) var(--s4);font-size:var(--text-base)}
.privacy{display:flex;align-items:center;justify-content:center;gap:var(--s2);font-size:var(--text-sm);font-weight:var(--font-regular);color:var(--ink-soft);text-align:center}

/* ---- Übungsseite ---- */
.modhead{display:flex;align-items:center;gap:var(--s3);min-width:0}
.modhead .mini{width:calc(var(--text-base) * 5.5);height:auto;flex:none;background:var(--paper);border-radius:var(--r-card);padding:var(--s1);box-shadow:var(--lift)}
.modhead small{display:block;font-size:var(--text-sm);font-weight:var(--font-bold);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-soft)}
.modhead h1{font-size:var(--text-2xl)}
.step{display:flex;align-items:center;gap:var(--s3);font-size:var(--text-lg);margin-top:var(--s2)}
.step i{font-style:normal;display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--ink);color:var(--paper);font-size:var(--text-sm)}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4)}
.level{position:relative;flex-direction:column;gap:var(--s1);padding:var(--s5) var(--s3) var(--s4);border-radius:var(--r-card);border:3px solid transparent;text-align:center}
.level.sel{border-color:var(--blue);background:var(--paper-hi)}
.level .lv{font-size:var(--text-xl);margin-bottom:var(--s1)}
.level .nm{font-size:var(--text-xl)}
.level .ds{font-family:var(--font-text);font-size:var(--text-sm);font-weight:var(--font-regular);color:var(--ink-soft);min-height:2.6em}
.level .stt{display:inline-flex;align-items:center;gap:var(--s1);margin-top:var(--s2);padding:var(--s1) var(--s3);border-radius:var(--r-pill);background:var(--paper-2);font-family:var(--font-text);font-size:var(--text-xs);font-weight:var(--font-regular)}
.level.done .stt{background:var(--ok-soft);color:var(--ok)}
.level.played .stt{background:var(--mark-soft);color:var(--mark-ink)}
.tip{position:absolute;top:-.9em;left:50%;transform:translateX(-50%) rotate(-3deg);padding:.15em .75em;border-radius:4px;background:var(--mark);color:var(--ink);font-size:var(--text-xs);letter-spacing:var(--tracking-label);text-transform:uppercase;white-space:nowrap}
.lv{display:inline-flex;gap:.22em;vertical-align:middle}
.lv i{width:.62em;height:.62em;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink-faint)}
.lv i.on{background:var(--red);box-shadow:inset 0 -2px 0 var(--red-deep)}
.modes{display:grid;grid-template-columns:1.6fr 1fr;gap:var(--s4)}
.mode{flex-direction:column;gap:var(--s1);padding:var(--s5) var(--s3);font-size:var(--text-2xl);text-align:center}
.mode .ico{width:1.1em;height:1.1em}
.mode .chips .chip{width:.8em;height:.8em}
.mode small{font-family:var(--font-text);font-size:var(--text-sm);font-weight:var(--font-regular);opacity:.85}
@media (max-width:640px){.levels,.modes{grid-template-columns:1fr}}

/* ---- Spielseite ---- */
.tag{display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;padding:var(--s1) var(--s4);background:var(--paper);border-radius:var(--r-pill);box-shadow:var(--lift);font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-sm)}
.tag .lv{font-size:var(--text-base)}
.tag .ico{color:var(--blue)}
.progress{display:flex;gap:var(--s1);flex-wrap:wrap;align-items:center}
.dot{display:inline-block;width:1em;height:1em;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 2px var(--table-deep)}
.dot.cur{box-shadow:inset 0 0 0 2px var(--table-deep),0 0 0 3px var(--table),0 0 0 5px var(--blue)}
.dot.g{background:var(--ok);box-shadow:none}
.dot.y{background:var(--mark);box-shadow:none}
.dot.o{background:var(--again);box-shadow:none}
.dot.g.cur,.dot.y.cur,.dot.o.cur{box-shadow:0 0 0 3px var(--table),0 0 0 5px var(--blue)}
.playgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s5)}
@media (min-width:900px) and (orientation:landscape){
  .playgrid{grid-template-columns:minmax(0,1fr) 20rem;align-items:start}
  .padarea{position:sticky;top:calc(env(safe-area-inset-top, 0px) + var(--s4))}
}
.taskcard{display:flex;flex-direction:column;align-items:center;gap:var(--s4);min-width:0;padding:var(--s5) var(--s4);background:var(--paper);border-radius:var(--r-card);box-shadow:var(--lift)}
.qrow{display:flex;align-items:center;gap:var(--s3);align-self:stretch}
.q{flex:1;min-width:0;font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-xl);line-height:var(--leading-heading)}
.q.center{text-align:center}
.speak{width:calc(var(--text-base) * 2.6);height:calc(var(--text-base) * 2.6);flex:none;background:var(--blue-soft);color:var(--blue);box-shadow:0 4px 0 var(--blue-line)}
.speak .ico{width:55%;height:55%}
.badge{display:inline-flex;align-items:center;gap:var(--s1);padding:var(--s1) var(--s3);border-radius:4px;background:var(--mark-soft);color:var(--mark-ink);font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-xs);white-space:nowrap}
.ref{padding:var(--s1) var(--s4);border-radius:var(--r-key);background:var(--ok-soft);color:var(--ok);font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-2xl);line-height:var(--leading-heading);font-variant-numeric:tabular-nums}

/* 20er-Feld: Kartonschale mit Mulden */
.frame{width:100%;max-width:40rem;padding:var(--s2);background:var(--table);border-radius:12px;box-shadow:inset 0 2px 7px rgb(var(--shade) / .22)}
.fgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) .7rem repeat(5,minmax(0,1fr));gap:clamp(4px,1.2vw,9px) clamp(3px,1vw,8px);padding:var(--s2)}
.sep{display:block;border-left:2px dashed var(--table-deep);margin:12% 0 12% calc(50% - 1px)}
.cell{position:relative;display:grid;place-items:center;aspect-ratio:1/1;max-width:100%;border-radius:50%;background:rgb(var(--shade) / .1);box-shadow:inset 0 2px 3px rgb(var(--shade) / .28)}
.d{display:block;position:relative;width:88%;height:88%;border-radius:50%}
.d.r{background:var(--red);box-shadow:inset 0 -3px 0 var(--red-deep),0 2px 2px rgb(var(--shade) / .3)}
.d.b{background:var(--blue);box-shadow:inset 0 -3px 0 var(--blue-deep),0 2px 2px rgb(var(--shade) / .3)}
.d.g{background:transparent;border:2.5px dashed var(--ink-faint)}
.d.x{opacity:.6}
.d.x::before,.d.x::after{content:"";position:absolute;left:14%;right:14%;top:44%;height:12%;border-radius:3px;background:var(--paper-hi);transform:rotate(45deg)}
.d.x::after{transform:rotate(-45deg)}
.hidecard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s3);width:100%;max-width:40rem;min-height:9rem;padding:var(--s4);border-radius:12px;border:2.5px dashed var(--table-deep);background:var(--paper-2);text-align:center;font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-lg)}
.hidecard .ico.big{width:2.6em;height:2.6em;color:var(--ink-soft)}
.hidecard .fox{width:calc(var(--text-base) * 3.6)}
.smallbtn{padding:var(--s2) var(--s4);font-size:var(--text-base);background:var(--mark-soft);box-shadow:0 4px 0 var(--mark)}
.smallbtn:active:not(:disabled){box-shadow:0 1px 0 var(--mark)}
.timebar{width:100%;max-width:40rem;height:.6rem;border-radius:var(--r-pill);background:var(--blue-soft);overflow:hidden}
.timebar i{display:block;height:100%;background:var(--blue);border-radius:var(--r-pill);animation:shrink linear forwards}

/* Zahlenhaus */
.house{display:flex;flex-direction:column;align-items:center;width:12rem;max-width:100%}
.roof{display:grid;place-items:end center;width:100%;height:4.4rem;padding-bottom:.35rem;background:var(--ink);clip-path:polygon(50% 0,100% 100%,0 100%);color:var(--paper);font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-2xl);line-height:var(--leading-solid)}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);width:84%;padding:var(--s2);background:var(--paper-2);border:3px solid var(--ink);border-top:0;border-radius:0 0 6px 6px}
.room{padding:var(--s1);border-radius:6px;background:var(--paper-hi);text-align:center;font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-2xl);line-height:var(--leading-heading)}
.room.l{color:var(--red);box-shadow:inset 0 0 0 2.5px var(--red)}
.room.r{color:var(--blue);box-shadow:inset 0 0 0 2.5px var(--blue)}

/* Rechnung: die gesuchte Zahl ist das Grösste auf dem Bildschirm */
.formula{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.22em;font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-5xl);line-height:var(--leading-solid);font-variant-numeric:tabular-nums}
.formula .op{color:var(--ink-faint)}
.slot{display:inline-grid;place-items:center;min-width:1.5em;height:1.3em;padding:0 .18em;border-radius:12px;font-size:var(--text-6xl);background:var(--mark-soft);color:var(--ink);box-shadow:inset 0 0 0 5px var(--mark)}
.slot.empty{color:var(--mark-ink)}
@media (max-width:560px){.formula{font-size:var(--text-4xl)}.slot{font-size:var(--text-5xl)}}
.slot.ok{background:var(--ok-soft);color:var(--ok);box-shadow:inset 0 0 0 5px var(--ok);animation:pop .35s ease-out}
.slot.bad{background:var(--red-soft);color:var(--red-deep);box-shadow:inset 0 0 0 5px var(--red);animation:shake .3s 2}
.slot.rev{background:var(--blue-soft);color:var(--blue);box-shadow:inset 0 0 0 5px var(--blue)}
.mascot{display:flex;align-items:center;justify-content:center;gap:var(--s3);align-self:stretch;min-height:3.5rem}
.mascot .fox{width:calc(var(--text-base) * 3.2)}
.bubble{position:relative;max-width:32rem;padding:var(--s2) var(--s4);border-radius:14px;background:var(--paper-2);font-family:var(--font-display);font-weight:var(--font-regular);font-size:var(--text-lg);line-height:var(--leading-heading)}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-9px;border:9px solid transparent;border-right-color:var(--paper-2);border-left:0}

/* Zahlenfeld */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);width:100%;max-width:24rem;margin:0 auto}
.key{height:calc(var(--text-base) * 3.5);font-size:var(--text-3xl);line-height:var(--leading-solid);font-variant-numeric:tabular-nums}
.key .ico{width:.8em;height:.8em}
.key.del{background:var(--paper-2);color:var(--ink-soft)}
.key.ok{background:var(--ok);color:var(--paper-hi);box-shadow:0 4px 0 var(--ok-deep)}
.key.ok:hover:not(:disabled){background:var(--ok)}
.key.ok:active:not(:disabled){box-shadow:0 1px 0 var(--ok-deep)}
.next{grid-column:1/-1;height:calc(var(--text-base) * 3.5);font-size:var(--text-2xl)}

/* Ende einer Runde */
.end{display:flex;flex-direction:column;align-items:center;gap:var(--s3);width:100%;max-width:36rem;margin:0 auto;padding:var(--s6) var(--s5);background:var(--paper);border-radius:var(--r-card);box-shadow:var(--lift);text-align:center}
.end .fox{width:calc(var(--text-base) * 6)}
.bigstars{display:flex;gap:var(--s3)}
.bigstars .ico{width:calc(var(--text-base) * 3.2);height:calc(var(--text-base) * 3.2);color:var(--mark)}
.bigstars .ico.off{color:var(--line)}
.score{font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-3xl);line-height:var(--leading-heading)}
.sub{font-size:var(--text-lg);font-weight:var(--font-regular);color:var(--ink-soft)}
.progress.big .dot{width:1.5em;height:1.5em}
.won{display:inline-flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s4);border-radius:4px;background:var(--ok-soft);color:var(--ok);font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-base)}
.endbtns{display:grid;gap:var(--s3);width:100%;margin-top:var(--s2)}
.wide{padding:var(--s3) var(--s4);font-size:var(--text-xl)}
.wide.easier{background:var(--mark-soft);box-shadow:0 4px 0 var(--mark)}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s2) var(--s4);margin-top:var(--s2);font-size:var(--text-sm);font-weight:var(--font-regular);color:var(--ink-soft)}
.legend .dot{width:.9em;height:.9em;vertical-align:-.1em;margin-right:.3em}


/* Fenster und Meldungen */
.overlay{
  position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgb(var(--shade) / .5);
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.modal{display:flex;flex-direction:column;gap:var(--s3);width:100%;max-width:34rem;max-height:90vh;overflow:auto;padding:var(--s5);background:var(--paper);border-radius:var(--r-card);box-shadow:0 20px 40px -20px rgb(var(--shade) / .6)}
.modal h3{font-size:var(--text-2xl)}
.modal p,.modal li{color:var(--ink-soft);font-size:var(--text-base);line-height:var(--leading-body)}
.modal li b{color:var(--ink)}
.modal ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:var(--s2)}
.modal label{font-family:var(--font-display);font-weight:var(--font-bold)}
.modal input{width:100%;padding:var(--s3) var(--s4);border-radius:var(--r-key);border:2.5px solid var(--line);background:var(--paper-hi);color:var(--ink);font-size:var(--text-lg);font-weight:var(--font-regular);outline:none}
.modal input:focus{border-color:var(--blue)}
.modal .small{font-size:var(--text-sm)}
.mbtns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:var(--s3);margin-top:var(--s2)}
.mbtn{padding:var(--s2) var(--s4);font-size:var(--text-base)}
.mbtn.stop{background:var(--red);color:var(--paper-hi);box-shadow:0 4px 0 var(--red-deep)}
.mbtn.stop:hover:not(:disabled){background:var(--red)}
#toast{
  position:fixed;left:50%;bottom:calc(var(--s5) + env(safe-area-inset-bottom, 0px));z-index:60;max-width:calc(100vw - 32px);
  padding:var(--s3) var(--s5);border-radius:var(--r-key);background:var(--ink);color:var(--paper);text-align:center;
  font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-base);
  transform:translate(-50%,200%);visibility:hidden;transition:transform .25s ease-out, visibility .25s;
}
#toast.show{transform:translate(-50%,0);visibility:visible}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

/* Mini-Bilder der Übungen */
.m-h{fill:var(--line)} .m-r{fill:var(--red)} .m-b{fill:var(--blue)}
.m-g{fill:none;stroke:var(--ink-faint);stroke-width:1.3;stroke-dasharray:2 1.6}
.m-x{stroke:var(--paper-hi);stroke-width:1.6;stroke-linecap:round}
.m-l{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.m-d{fill:none;stroke:var(--ink-soft);stroke-width:1.5;stroke-dasharray:2.5 2}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-6deg)}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shrink{from{width:100%}to{width:0}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .card,.card:hover{transform:none}
}

/* Eigenständige Seite: Abstand zu Kamera-Aussparung und Home-Balken */
:root{padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px)}
.pausenplatz{padding:0 var(--s4);font-size:var(--text-sm);color:var(--ink);text-decoration:none}
@media (max-width:620px){.screen-home .top .brand{order:5;flex-basis:100%}}

/* ---- Rechentrainer 2: Hunderterfeld, Rechenweg, Startseite in Gruppen ---- */
.group{display:flex;flex-direction:column;gap:var(--s3)}
.gh{font-size:var(--text-2xl)}
.waynote{max-width:44rem;font-size:var(--text-base);color:var(--ink-soft)}
.waynote b{color:var(--ink)}
.way{display:flex;flex-direction:column;gap:var(--s5);margin-top:var(--s2)}
.wayrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s4);align-items:center}
.waylbl{display:flex;flex-direction:column;align-items:center;gap:var(--s1);width:4.6rem;font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-sm);text-align:center}
.waylbl i{font-style:normal;display:grid;place-items:center;width:2.2em;height:2.2em;border-radius:50%;font-size:var(--text-2xl);line-height:var(--leading-solid);color:var(--paper-hi)}
.waylbl.p i{background:var(--blue);box-shadow:inset 0 -3px 0 var(--blue-deep)}
.waylbl.m i{background:var(--red);box-shadow:inset 0 -3px 0 var(--red-deep)}
.cards.way5{grid-template-columns:repeat(auto-fill,minmax(min(100%,10rem),1fr));padding-top:0}
@media (min-width:1000px){.cards.way5{grid-template-columns:repeat(6,minmax(0,1fr))}.cards.way5 .card{padding-inline:var(--s3)}.cards.way5 .tt{font-size:var(--text-base)}}
@media (max-width:640px){.wayrow{grid-template-columns:minmax(0,1fr)}.waylbl{flex-direction:row;width:auto}}
.card .ex{font-family:var(--font-display);font-weight:var(--font-bold);font-size:var(--text-sm);color:var(--ink-soft);font-variant-numeric:tabular-nums}

/* Hunderterfeld: 10 × 10 Mulden, Lücke nach der 5. Spalte und nach der 5. Reihe */
.frame.h100{max-width:min(30rem, 54vh)}
.frame.h100.small{max-width:min(26rem, 42vh)}
.fgrid.h100{grid-template-columns:repeat(5,minmax(0,1fr)) .55rem repeat(5,minmax(0,1fr));gap:clamp(2px,.7vw,5px) clamp(2px,.6vw,4px)}
.fgrid.h100 .sep{margin:8% 0 8% calc(50% - 1px)}
.hsep{grid-column:1/-1;height:0;margin:2px 4%;border-top:2px dashed var(--table-deep)}
.fgrid.h100 .d.r,.fgrid.h100 .d.b{box-shadow:inset 0 -2px 0 rgb(var(--shade) / .28)}
.fgrid.h100 .d.g{border-width:1.5px}

/* Rechnung mit mehreren Lücken: Rechenweg in Schritten */
.formula.main-s{font-size:var(--text-4xl)}
.formula.seq{font-size:var(--text-4xl)}
.formula.seq .slot{font-size:var(--text-5xl)}
.op.comma{margin-right:.2em}
.n.fill{color:var(--ink)}
.n.fill.wait{color:var(--ink-faint)}
.rweg{display:flex;flex-direction:column;align-items:center;gap:var(--s3);align-self:stretch;padding:var(--s3) var(--s4) var(--s4);border-radius:12px;background:var(--paper-2)}
.rweg > small{font-size:var(--text-sm);font-weight:var(--font-bold);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-soft)}
.formula.step-f{font-size:var(--text-3xl)}
.formula.step-f .slot{font-size:var(--text-4xl);height:1.25em}
.slot.done{background:var(--ok-soft);color:var(--ok);box-shadow:inset 0 0 0 4px var(--ok)}
.slot.wait{background:transparent;color:var(--ink-faint);box-shadow:inset 0 0 0 3px var(--line)}
@media (max-width:560px){
  .formula.main-s,.formula.seq{font-size:var(--text-3xl)}
  .formula.seq .slot{font-size:var(--text-4xl)}
  .formula.step-f{font-size:var(--text-2xl)}
  .formula.step-f .slot{font-size:var(--text-3xl)}
}
.ref small{display:block;font-size:var(--text-xs);font-weight:var(--font-bold);letter-spacing:var(--tracking-label);text-transform:uppercase;text-align:center;opacity:.8}

/* Rechenweg-Aufgaben: Bild und Rechnung nebeneinander, wenn Platz ist */
.split{display:flex;flex-direction:column;align-items:center;gap:var(--s4);align-self:stretch}
.sp-pic{display:flex;flex-direction:column;align-items:center;gap:var(--s3);width:100%}
.sp-calc{display:flex;flex-direction:column;align-items:center;gap:var(--s4);width:100%}
@media (min-width:900px) and (orientation:landscape){
  .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);align-items:center}
  .split .frame.h100.small{max-width:min(100%, 50vh)}
  .split .hidecard{min-height:12rem}
}
@media (max-width:560px){.formula.two{font-size:var(--text-3xl)}.formula.two .slot{font-size:var(--text-4xl)}}

/* Zahlenstrahl: Sprung bis zum Zehner, dann weiter */
.zstrahl{width:100%;max-width:40rem;padding:var(--s2);background:var(--paper-hi);border-radius:12px;box-shadow:inset 0 0 0 2px var(--line)}
.zstrahl svg{display:block;width:100%;height:auto;overflow:visible}
.zs-axis{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.zs-tick{stroke:var(--ink-soft);stroke-width:2;stroke-linecap:round}
.zs-tick.big{stroke:var(--ink);stroke-width:3.5}
.zs-ten{font-family:var(--font-display);font-weight:var(--font-bold);font-size:34px;fill:var(--ink);text-anchor:middle}
.zs-z{fill:var(--mark);stroke:var(--mark-ink);stroke-width:2}
.zs-arc{fill:none;stroke-width:5;stroke-linecap:round}
.zs-arc.zp{stroke:var(--blue)} .zs-arc.zp.k2{stroke:var(--blue-deep)}
.zs-arc.zm{stroke:var(--red)} .zs-arc.zm.k2{stroke:var(--red-deep)}
.zs-pill.zp{fill:var(--blue)} .zs-pill.zp.k2{fill:var(--blue-deep)}
.zs-pill.zm{fill:var(--red)} .zs-pill.zm.k2{fill:var(--red-deep)}
.zs-plbl{font-family:var(--font-display);font-weight:var(--font-bold);font-size:28px;fill:var(--paper-hi);text-anchor:middle}
.zs-start{fill:var(--ink)}
.zs-end{fill:var(--paper-hi);stroke:var(--ink-faint);stroke-width:2.5;stroke-dasharray:3 3}
.zs-end.on{fill:var(--ok);stroke:var(--ok-deep);stroke-dasharray:none}
.zs-num{font-family:var(--font-display);font-weight:var(--font-bold);font-size:32px;text-anchor:middle}
.zs-num.st{fill:var(--ink)}
.zs-num.en{fill:var(--ink-faint)} .zs-num.en.on{fill:var(--ok)}
.m-ab{fill:none;stroke:var(--blue);stroke-width:1.8;stroke-linecap:round}
.m-ar{fill:none;stroke:var(--red);stroke-width:1.8;stroke-linecap:round}
.zs-lead{stroke:var(--ink-faint);stroke-width:1.5;stroke-dasharray:2 3}

/* ---------------- Hilfsfunktionen ---------------- */
const R = (a,b) => a + Math.floor(Math.random()*(b-a+1));

function fSeq(red, blue=0, struck=0, ghost=0){
  const c = cellsBlank(); let i=0;
  for(let k=0;k<red&&i<N;k++) c[i++].c='r';
  for(let k=0;k<blue&&i<N;k++) c[i++].c='b';

function fHalves(top, bot){ const c=cellsBlank(); for(let i=0;i<top;i++) c[i].c='r'; for(let i=0;i<bot;i++) c[50+i].c='b'; return c; }

function T(q, parts, answer, cells, o={}){

function stepTask(q, a, op, b, cells, o={}){
  const zb = Z(b)*10, eb = E(b), f = op==='+' ? (x,y)=>x+y : (x,y)=>x-y;
  const mid = f(a,zb), res = f(mid,eb);
  return T(q, [a,op,b,'=',FL(1)], [mid,res], cells, Object.assign({
    steps:[[a,op,zb,'=',SL(0)],[FL(0),op,eb,'=',SL(1)]],

// Tipp für den Einer-Schritt, auch über den Zehner
function einerHint(a, op, e){
  if(op==='+'){
    const bis = 10 - E(a);
    if(E(a)+e <= 10) return `Die Zehner bleiben. Rechne nur die Einer: ${E(a)} + ${e} = ${E(a)+e}.`;
    return `Über den Zehner: erst ${a} + ${bis} = ${a+bis}. Dann noch ${e-bis} dazu.`;
  }
  if(e <= E(a)) return `Die Zehner bleiben. Rechne nur die Einer: ${E(a)} − ${e} = ${E(a)-e}.`;
  return `Über den Zehner: erst ${a} − ${E(a)} = ${a-E(a)}. Dann noch ${e-E(a)} weg.`;
}

// Über den Zehner: zuerst bis zum vollen Zehner springen, dann den Rest. Bild: Zahlenstrahl.
function ueberTask(a, op, b, L){
  const plus = op==='+', z = plus ? 10*(Z(a)+1) : 10*Z(a);
  const j1 = plus ? z-a : a-z, j2 = b-j1, res = plus ? a+b : a-b;
  const line = {a, op, z, res, j:[j1,j2], lo:z-10, hi:z+10, lbl1:L>1};
  const hint = plus ? `Erst bis ${z}: ${a} + ${j1} = ${z}. Dann noch ${j2} dazu.` : `Erst bis ${z}: ${a} − ${j1} = ${z}. Dann noch ${j2} weg.`;
  if(L===1) return T('Spring zuerst bis zum Zehner, dann weiter.',[a,op,b,'=',FL(1)],[j1,res],null,{line,

  if(L===2) return T('Über den Zehner! Der Zahlenstrahl hilft.',[a,op,b,'=',S],res,null,{line,hint});

/* ---------------- Aufgaben: 17 Übungen × 3 Stufen ---------------- */
function gen(m, L){
  switch(m){

        seq.forEach((x,i)=>{ if(i) parts.push(','); parts.push(i===gap?S:x); });
        return T(step>0?`Zähle in ${step}er-Schritten weiter.`:`Zähle in ${-step}er-Schritten rückwärts.`, parts, seq[gap], null,
          {seq:true, hint: step>0 ? `Immer ${step} mehr.` : `Immer ${-step} weniger.`});
      };
      if(L===1){
        if(Math.random()<.6){ const s=10*R(0,6); return mk(s,10,3); }
        const s=5*R(0,12); return mk(s,5,3);
      }
      if(L===2){
        const v=R(1,3);
        if(v===1){ const s=ZE(1,69); return mk(s,10,3); }
        if(v===2){ const s=ZE(31,99); return mk(s,-10,3); }
        const s=2*R(0,46); return mk(s,2,3);
      }
      const step=pick([2,5,10]), back=Math.random()<.5, gap=R(1,3);
      if(!back){ const s=step===10?R(0,69):step===5?5*R(0,14):2*R(0,46); return mk(s,step,gap); }
      const s=step===10?R(31,100):step===5?5*R(3,20):2*R(4,50); return mk(s,-step,gap);
    }
    case 3: { // Ergänzen
      if(L===1){ const a=ZE(11,99), t=10*(Z(a)+1); return T('Wie viele fehlen bis zum nächsten Zehner?',[a,'+',S,'=',t],t-a,fSeq(a,0,0,t-a),{hint:'Zähle die leeren Kreise bis die Reihe voll ist.'}); }
      if(L===2){ const a=10*R(1,9); return T('Wie viele fehlen bis 100?',[a,'+',S,'=',100],100-a,fSeq(a),{hint:'Wie viele Reihen sind noch leer? Jede Reihe ist 10.'}); }
      const a=ZE(11,89), t=10*(Z(a)+1);
      return T('Wie viele fehlen bis 100?',[a,'+',S,'=',100],100-a,fSeq(a),{hidden:true,hint:`Erst bis ${t}: ${t-a}. Dann bis 100: noch ${100-t}.`});
    }
    case 4: { // Verdoppeln
      if(L===1){ const v=10*R(1,5); return T(`Verdopple die ${v}!`,[v,'+',v,'=',S],2*v,fHalves(v,v),{ref:[v/10,'+',v/10,'=',v/5],refLbl:'Kleine Aufgabe',hint:`${v/10} Zehner und ${v/10} Zehner.`}); }
      if(L===2){ const v=Math.random()<.75 ? pick([5,15,25,35,45]) : 10*R(1,5);
        return T(`Verdopple die ${v}!`,[v,'+',v,'=',S],2*v,fHalves(v,v),{hint: v%10 ? `${v} = ${v-5} + 5. Verdopple beide: ${2*(v-5)} + 10.` : `${v/10} Zehner und ${v/10} Zehner.`}); }
      const v=ZE(11,49);
      return T(`Verdopple die ${v} im Kopf!`,[v,'+',v,'=',S],2*v,fHalves(v,v),{hidden:true,hint:`Zehner verdoppeln: ${Z(v)*20}. Einer verdoppeln: ${E(v)*2}. Dann zusammen.`});
    }
    case 5: { // Halbieren
      if(L===1){ const t=20*R(1,5), h=t/2; return T(`Halbiere die ${t}!`,[t,'=',S,'+',S],h,fHalves(h,h),{ref:[t/10,'=',t/20,'+',t/20],refLbl:'Kleine Aufgabe',hint:`Die Hälfte von ${t/10} Zehnern sind ${t/20} Zehner.`}); }
      if(L===2){ const t=Math.random()<.7 ? pick([10,30,50,70,90]) : 20*R(1,5), h=t/2;
        return T(`Halbiere die ${t}!`,[t,'=',S,'+',S],h,fHalves(h,h),{hint: t===10 ? '10 = 5 + 5.' : (t/10)%2 ? `${t} = ${t-10} + 10. Die Hälfte von ${t-10} ist ${(t-10)/2}, die Hälfte von 10 ist 5.` : `Die Hälfte von ${t/10} Zehnern sind ${t/20} Zehner.`}); }
      let t; do{ t=2*R(6,49); }while(t%10===0); const h=t/2, zt=t-E(t);
      return T(`Halbiere die ${t} im Kopf!`,[t,'=',S,'+',S],h,fHalves(h,h),{hidden:true,hint:`Zerlege: ${zt} und ${E(t)}. Halbiere beide: ${zt/2} + ${E(t)/2}.`});
    }

    /* ---------- Rechenweg Plus ---------- */
    case 6: { // Z + Z
      let a,b;
      if(L===1){ do{ a=10*R(1,4); b=10*R(1,4); }while(a+b>50); return T('Zehner plus Zehner.',[a,'+',b,'=',S],a+b,fSeq(a,b),{ref:[a/10,'+',b/10,'=',(a+b)/10],refLbl:'Kleine Aufgabe',hint:`${a/10} Zehner + ${b/10} Zehner = ${(a+b)/10} Zehner.`}); }
      do{ a=10*R(1,9); b=10*R(1,9); }while(a+b>100);
      if(L===2) return T('Zehner plus Zehner.',[a,'+',b,'=',S],a+b,fSeq(a,b),{hint:`Rechne mit Zehnern: ${a/10} + ${b/10}.`});
      if(Math.random()<.35) return T('Welche Zahl fehlt?',[a,'+',S,'=',a+b],b,fSeq(a,b),{hidden:true,hint:`${a/10} Zehner und wie viele Zehner sind ${(a+b)/10} Zehner?`});
      return T('Zehner plus Zehner im Kopf!',[a,'+',b,'=',S],a+b,fSeq(a,b),{hidden:true,hint:`Kleine Aufgabe: ${a/10} + ${b/10} = ${(a+b)/10}.`});
    }
    case 7: { // ZE + Z
      let a,b; const hi = L===1 ? 59 : 99;
      do{ a=ZE(11,hi-10); b=10*R(1,8); }while(a+b>hi);
      const hint=`Die Einer bleiben. Rechne nur die Zehner: ${Z(a)} + ${b/10} = ${Z(a)+b/10}.`;
      if(L<3) return T('Zehner dazu.',[a,'+',b,'=',S],a+b,fSeq(a,b),{hint});
      const v=R(1,3);
      if(v===1) return T('Tauschaufgabe: Rechne mit der grösseren Zahl zuerst.',[b,'+',a,'=',S],a+b,fSeq(a,b),{hidden:true,hint:`Tausche: ${a} + ${b}. ${hint}`});
      if(v===2) return T('Welche Zahl fehlt?',[a,'+',S,'=',a+b],b,fSeq(a,b),{hidden:true,hint:`Die Einer sind gleich geblieben. Wie viele Zehner kamen dazu?`});
      return T('Zehner dazu im Kopf!',[a,'+',b,'=',S],a+b,fSeq(a,b),{hidden:true,hint});
    }
    case 8: { // ZE + E
      let a,b;
      if(L===1){ do{ a=ZE(11,49); b=R(1,10-E(a)); }while(a+b>100); return T('Einer dazu.',[a,'+',b,'=',S],a+b,fSeq(a,b),{ref:[E(a),'+',b,'=',E(a)+b],refLbl:'Kleine Aufgabe',hint:einerHint(a,'+',b)}); }
      do{ a=ZE(11,99); b=R(1,9); }while(E(a)+b>10 || a+b>100);
      return T(L===2?'Einer dazu.':'Einer dazu im Kopf!',[a,'+',b,'=',S],a+b,fSeq(a,b),{hidden:L===3,hint:einerHint(a,'+',b)});
    }
    case 9: { // ZE + ZE ohne Übergang
      let a,b; const hi = L===1 ? 69 : 99;
      do{ a=ZE(11,88); b=ZE(11,88); }while(E(a)+E(b)>9 || a+b>hi);
      if(L===1) return stepTask('Zuerst die Zehner, dann die Einer.',a,'+',b,fSeq(a,b));
      const hint=`Zuerst die Zehner: ${a} + ${Z(b)*10} = ${a+Z(b)*10}. Dann noch ${E(b)} dazu.`;
      return T(L===2?'Plus ohne Übergang.':'Plus im Kopf!',[a,'+',b,'=',S],a+b,fSeq(a,b),{hidden:L===3,hint});
    }
    case 10: { // ZE + ZE mit Übergang
      let a,b;
      do{ a=ZE(12,88); b=ZE(12,88); }while(E(a)+E(b)<=10 || a+b>100);
      if(L<3) return stepTask('Zuerst die Zehner, dann die Einer.',a,'+',b,fSeq(a,b),{hidden:L===2});
      return T('Plus über den Zehner im Kopf!',[a,'+',b,'=',S],a+b,fSeq(a,b),{hidden:true,hint:`Zuerst die Zehner: ${a} + ${Z(b)*10} = ${a+Z(b)*10}. Dann noch ${E(b)} dazu.`});
    }

    /* ---------- Rechenweg Minus (gleicher Weg) ---------- */
    case 11: { // Z − Z
      let a,b;
      if(L===1){ a=10*R(2,5); b=10*R(1,a/10-1); return T('Zehner minus Zehner.',[a,'−',b,'=',S],a-b,fSeq(a,0,b),{ref:[a/10,'−',b/10,'=',(a-b)/10],refLbl:'Kleine Aufgabe',hint:`${a/10} Zehner − ${b/10} Zehner = ${(a-b)/10} Zehner.`}); }
      a=10*R(2,10); b=10*R(1,a/10-1);
      if(L===2) return T('Zehner minus Zehner.',[a,'−',b,'=',S],a-b,fSeq(a,0,b),{hint:`Rechne mit Zehnern: ${a/10} − ${b/10}.`});
      if(Math.random()<.35) return T('Welche Zahl fehlt?',[a,'−',S,'=',a-b],b,fSeq(a,0,b),{hidden:true,hint:`${a/10} Zehner weniger wie viele Zehner sind ${(a-b)/10} Zehner?`});
      return T('Zehner minus Zehner im Kopf!',[a,'−',b,'=',S],a-b,fSeq(a,0,b),{hidden:true,hint:`Kleine Aufgabe: ${a/10} − ${b/10} = ${(a-b)/10}.`});
    }
    case 12: { // ZE − Z
      let a,b; const hi = L===1 ? 59 : 99;
      do{ a=ZE(21,hi); b=10*R(1,Z(a)); }while(a-b<1);
      const hint=`Die Einer bleiben. Rechne nur die Zehner: ${Z(a)} − ${b/10} = ${Z(a)-b/10}.`;
      if(L<3) return T('Zehner weg.',[a,'−',b,'=',S],a-b,fSeq(a,0,b),{hint});
      if(Math.random()<.35) return T('Welche Zahl fehlt?',[a,'−',S,'=',a-b],b,fSeq(a,0,b),{hidden:true,hint:'Die Einer sind gleich geblieben. Wie viele Zehner sind weg?'});
      return T('Zehner weg im Kopf!',[a,'−',b,'=',S],a-b,fSeq(a,0,b),{hidden:true,hint});
    }
    case 13: { // ZE − E
      let a,b;
      if(L===1){ a=ZE(11,49); b=R(1,E(a)); return T('Einer weg.',[a,'−',b,'=',S],a-b,fSeq(a,0,b),{ref:[E(a),'−',b,'=',E(a)-b],refLbl:'Kleine Aufgabe',hint:einerHint(a,'−',b)}); }
      do{ a=ZE(11,99); b=R(1,9); }while(b>E(a));
      return T(L===2?'Einer weg.':'Einer weg im Kopf!',[a,'−',b,'=',S],a-b,fSeq(a,0,b),{hidden:L===3,hint:einerHint(a,'−',b)});
    }
    case 14: { // ZE − ZE ohne Übergang
      let a,b; const hi = L===1 ? 69 : 99;
      do{ a=ZE(22,hi); b=ZE(11,a-1); }while(E(b)>E(a) || Z(b)>=Z(a) || a-b<1);
      if(L===1) return stepTask('Zuerst die Zehner, dann die Einer.',a,'−',b,fSeq(a,0,b));
      const hint=`Zuerst die Zehner: ${a} − ${Z(b)*10} = ${a-Z(b)*10}. Dann noch ${E(b)} weg.`;
      return T(L===2?'Minus ohne Übergang.':'Minus im Kopf!',[a,'−',b,'=',S],a-b,fSeq(a,0,b),{hidden:L===3,hint});
    }
    case 16: { // ZE + E über den Zehner, Zahlenstrahl
      let a,b; do{ a=ZE(11,98); b=R(2,9); }while(E(a)+b<=10 || a+b>100);
      return ueberTask(a,'+',b,L);
    }
    case 17: { // ZE − E über den Zehner, Zahlenstrahl
      let a,b; do{ a=ZE(11,99); b=R(2,9); }while(b<=E(a) || a-b<1);
      return ueberTask(a,'−',b,L);
    }
    default: { // ZE − ZE mit Übergang
      let a,b;
      do{ a=ZE(21,99); b=ZE(11,a-1); }while(E(b)<=E(a) || Z(b)>=Z(a) || a-b<1);
      if(L<3) return stepTask('Zuerst die Zehner, dann die Einer.',a,'−',b,fSeq(a,0,b),{hidden:L===2});
      return T('Minus über den Zehner im Kopf!',[a,'−',b,'=',S],a-b,fSeq(a,0,b),{hidden:true,hint:`Zuerst die Zehner: ${a} − ${Z(b)*10} = ${a-Z(b)*10}. Dann noch ${E(b)} weg.`});
    }
  }
}
const taskKey = t => JSON.stringify(t.parts) + '|' + t.answers.join(',') + (t.ref?'r':'');
function makeTasks(m, L){
  const out=[], seen=new Set(); let guard=0;
  while(out.length<ROUND && guard<400){
    guard++;
    const t=gen(m,L), k=taskKey(t);
    if(out.length && taskKey(out[out.length-1])===k) continue;   // nie zweimal gleich hintereinander
    if(seen.has(k) && guard<200) continue;                         // möglichst abwechslungsreich
    seen.add(k); out.push(t);
  }
  return out;
}

const blank = () => ({r:0,b:0,bb:0,t:0,c:0});

function lvState(m,L){ const p=peek(m,L); return p.b>=8 ? 'done' : p.r>0 ? 'played' : 'open'; }

// Zahlenstrahl: ein Ausschnitt von 20 Zahlen um den Zehner, zwei Sprungbögen
function lineV(l0){
  // Auf dem Handy nur der Ausschnitt um die Sprünge, damit Zahlen und Striche gross bleiben
  const l = Object.assign({}, l0);
  if(window.innerWidth < 600){
    let lo=Math.min(l.a,l.res)-2, hi=Math.max(l.a,l.res)+2;
    while(hi-lo<9){ lo--; if(hi-lo<9) hi++; }
    l.lo=lo; l.hi=hi;
  }
  const r=st.round, W=640, x0=30, x1=W-30, u=(x1-x0)/(l.hi-l.lo), X=n=>x0+(n-l.lo)*u, y=150;
  const cls = l.op==='+' ? 'zp' : 'zm';
  let s=`<line class="zs-axis" x1="${x0-14}" y1="${y}" x2="${x1+14}" y2="${y}"/>`;
  for(let n=l.lo;n<=l.hi;n++){
    const big=n%10===0, mid=n%5===0, h=big?20:mid?13:8;
    s+=`<line class="zs-tick${big?' big':''}" x1="${X(n)}" y1="${y-h}" x2="${X(n)}" y2="${y+h}"/>`;
    if(big) s+=`<text class="zs-ten" x="${X(n)}" y="${y+54}">${n}</text>`;
  }
  // der Zehner, über den man springt, ist markiert
  s+=`<circle class="zs-z" cx="${X(l.z)}" cy="${y}" r="11"/>`;
  const known0 = l.lbl1 || r.vals[0]!==undefined || r.phase==='correct' || r.phase==='reveal';
  const done = r.vals[r.cur.answers.length-1]!==undefined;
  // liegen die beiden Schilder zu nah beieinander, springt der zweite Bogen höher
  const lift = Math.abs((X(l.a)-X(l.res))/2) < 84 ? 48 : 0;
  const arc=(from,to,lbl,k)=>{
    const xa=X(from), xb=X(to), mx=(xa+xb)/2, hgt=Math.min(70, 30+Math.abs(xb-xa)*.3)+(k?lift:0);
    const tw = Math.max(64, String(lbl).length*20+26);
    return `<path class="zs-arc ${cls}${k?' k2':''}" d="M${xa} ${y-4} Q${mx} ${y-hgt*2+4} ${xb} ${y-4}"/>
      <rect class="zs-pill ${cls}${k?' k2':''}" x="${mx-tw/2}" y="${y-hgt-20}" width="${tw}" height="40" rx="20"/>
      <text class="zs-plbl" x="${mx}" y="${y-hgt+10}">${lbl}</text>`;
  };
  s+=arc(l.a, l.z, `${l.op} ${known0 ? l.j[0] : '?'}`, 0);
  s+=arc(l.z, l.res, `${l.op} ${l.j[1]}`, 1);
  s+=`<circle class="zs-start" cx="${X(l.a)}" cy="${y}" r="9"/><line class="zs-lead" x1="${X(l.a)}" y1="${y+12}" x2="${X(l.a)}" y2="${y+68}"/><text class="zs-num st" x="${X(l.a)}" y="${y+100}">${l.a}</text>`;
  s+=`<circle class="zs-end${done?' on':''}" cx="${X(l.res)}" cy="${y}" r="9"/><line class="zs-lead" x1="${X(l.res)}" y1="${y+12}" x2="${X(l.res)}" y2="${y+68}"/><text class="zs-num en${done?' on':''}" x="${X(l.res)}" y="${y+100}">${done?l.res:'?'}</text>`;
  return `<div class="zstrahl"><svg viewBox="0 0 ${W} 262" role="img" aria-label="Zahlenstrahl von ${l.lo} bis ${l.hi}">${s}</svg></div>`;
}
function slotCls(){ const r=st.round; if(r.phase==='correct') return 'ok'; if(r.phase==='reveal'||r.phase==='stepReveal') return 'rev'; if(r.shake) return 'bad'; return r.input===''?'empty':''; }
function slotTxt(){ return st.round.input==='' ? '?' : st.round.input; }
function tokV(p){
  const r=st.round;
  if(p===S || (p && p.slot!==undefined)){
    const k = p===S ? 0 : p.slot;
    if(k < r.k) return `<span class="slot done">${r.vals[k]}</span>`;
    if(k > r.k) return `<span class="slot wait">?</span>`;
    return `<span class="slot ${slotCls()}" data-slot>${slotTxt()}</span>`;
  }
  if(p && p.fill!==undefined){
    const v = r.vals[p.fill];
    return v===undefined ? `<span class="n fill wait">?</span>` : `<span class="n fill">${v}</span>`;
  }
  if(typeof p==='number') return `<span class="n">${p}</span>`;
  if(p===',') return `<span class="op comma">,</span>`;
  return `<span class="op">${p}</span>`;
}
function updateSlots(){
  document.querySelectorAll('[data-slot]').forEach(el => { el.textContent=slotTxt(); el.className='slot '+slotCls(); });
}
function padV(){
  const r=st.round, lock = ['correct','reveal','stepReveal'].includes(r.phase), dis = lock?'disabled':'';
  let k='';
  for(const d of [1,2,3,4,5,6,7,8,9]) k+=`<button class="btn key" data-a="d" data-d="${d}" ${dis}>${d}</button>`;

  if(r.phase==='reveal' || r.phase==='stepReveal') k+=`<button class="btn primary next" data-a="next">Weiter ${ic('arrow')}</button>`;
  return `<div class="pad">${k}</div>`;
}

function playV(){

function toast(msg){

  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2800);
}

/* ---------------- Spielablauf ---------------- */
function startRound(){
  clearTimers();
  const tasks = makeTasks(st.m, st.L);
  st.round = { list: tasks.map((t,i)=>Object.assign({}, t, {oi:i, retry:false})), pos:0, results:Array(ROUND).fill(null), streak:0 };
  st.screen='play'; beginTask();
}
function beginTask(){
  const r=st.round;
  r.cur=r.list[r.pos]; r.input=''; r.tries=0; r.triesK=0; r.k=0; r.vals=[]; r.revealed=false;
  r.help=false; r.phase='ask'; r.msg=''; r.mood=''; r.shake=false;
  r.frameHidden = st.mode==='practice' && r.cur.hidden; r.blitzEnd=0;
  if(st.mode==='blitz' && (r.cur.cells || r.cur.line)) startBlitz();
  render();
}
function startBlitz(){
  const r=st.round; clearTimeout(blitzTimer);
  const ms=BLITZ_MS[st.L]; r.frameHidden=false; r.blitzMs=ms; r.blitzEnd=Date.now()+ms;
  blitzTimer = setTimeout(() => {
    if(st.round!==r || st.screen!=='play' || !['ask','wrong1'].includes(r.phase)) return;
    r.frameHidden=true; r.blitzEnd=0; render();
  }, ms);
}
function digit(d){
  const r=st.round; if(!r || !['ask','wrong1'].includes(r.phase)) return;
  snd.tap();
  if(r.input==='0') r.input=String(d); else if(r.input.length<3) r.input+=String(d);
  r.shake=false; updateSlots();
}
function delDigit(){ const r=st.round; if(!r || !['ask','wrong1'].includes(r.phase)) return; snd.tap(); r.input=r.input.slice(0,-1); updateSlots(); }
function retryLater(t){ st.round.list.splice(Math.min(st.round.pos+3, st.round.list.length), 0, Object.assign({}, t, {retry:true})); }
function submit(){
  const r=st.round; if(!r || !['ask','wrong1'].includes(r.phase) || r.input==='') return;
  const t=r.cur, v=parseInt(r.input,10), k=r.k, last = k===t.answers.length-1, ans=t.answers[k];
  if(v===ans){
    r.vals[k]=v;
    if(!last){                       // Zwischenschritt geschafft: weiter zum nächsten Schritt
      snd.step(); r.k++; r.input=''; r.triesK=0; r.phase='ask'; r.shake=false; r.mood='';
      r.msg = t.steps ? `Genau! Jetzt noch ${t.steps[k+1][1]} ${t.steps[k+1][2]}.` : pick(STEPOK);
      render(); return;
    }
    clearTimeout(blitzTimer); r.blitzEnd=0;
    snd.ok(); r.phase='correct'; r.streak++; r.frameHidden=false; r.mood='hop';
    const clean = r.tries===0 && !r.help && !r.revealed;
    if(!t.retry){
      if(r.revealed){ r.results[t.oi]='o'; retryLater(t); }
      else { r.results[t.oi] = clean?'g':'y'; if(clean) st.stars++; }
    }
    r.msg = r.revealed && !t.retry ? 'Geschafft! Diese Aufgabe kommt gleich nochmal.' : pick(clean?PRAISE:PRAISE2);
    if(clean && r.streak%5===0){ r.msg=`${r.streak} richtig hintereinander!`; setTimeout(()=>{ snd.star(); confetti(); },250); }
    render(); nextTimer=setTimeout(nextTask, r.revealed ? 1800 : 1150);
  } else {
    r.tries++; r.triesK++; r.streak=0; snd.bad();
    const hint = (t.hints && t.hints[k]) || t.hint || 'Schau noch einmal genau.';
    if(r.triesK===1){
      r.phase='wrong1'; r.input=''; r.shake=true; r.frameHidden=false; r.mood='';
      clearTimeout(blitzTimer); r.blitzEnd=0;
      r.msg = 'Fast! ' + hint;
      render();
      setTimeout(()=>{ if(st.round===r && r.shake){ r.shake=false; updateSlots(); } }, 700);
    } else {
      r.vals[k]=ans; r.input=String(ans); r.frameHidden=false; r.mood=''; r.revealed=true;
      if(!last){ r.phase='stepReveal'; r.msg=`Das gibt ${ans}. Rechne jetzt den nächsten Schritt.`; render(); return; }
      r.phase='reveal';
      if(!t.retry){ r.results[t.oi]='o'; retryLater(t); r.msg=`Die Lösung ist ${ans}. Diese Aufgabe kommt gleich nochmal.`; }
      else r.msg=`Die Lösung ist ${ans}.`;
      render();
    }
  }
}
function nextStep(){
  const r=st.round; if(!r || r.phase!=='stepReveal') return;
  r.k++; r.input=''; r.triesK=0; r.phase='ask'; r.msg=''; r.shake=false; render();
}
function nextTask(){
  clearTimeout(nextTimer);
  const r=st.round; if(!r || st.screen!=='play') return;
  r.pos++;
  if(r.pos>=r.list.length) endRound(); else beginTask();
}
function endRound(){
  clearTimers();
  const r=st.round, score=r.results.filter(x=>x==='g').length, p=prog(st.m,st.L);
  p.r++; p.t+=ROUND; p.c+=score;
  if(st.mode==='practice') p.b=Math.max(p.b,score); else p.bb=Math.max(p.bb,score);
  r.score=score; st.dirty=true; st.screen='end';
  if(score>=8) setTimeout(()=>{ snd.star(); confetti(); },200);
  render();
}
function spoken(parts){
  const r=st.round;
  return parts.map(p => {
    if(p===S || (p && p.slot!==undefined)) return 'wie viel';
    if(p && p.fill!==undefined) return r && r.vals[p.fill]!==undefined ? String(r.vals[p.fill]) : 'wie viel';
    return p==='+'?'plus' : p==='−'?'minus' : p==='='?'gleich' : String(p);
  }).join(' ');
}

// Plättchen-Regen: Wendeplättchen fallen und drehen sich – rot auf der einen, blau auf der anderen Seite
function confetti(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.createElement('canvas'); cv.className='confetti'; document.body.appendChild(cv);
  cv.width=innerWidth; cv.height=innerHeight; const ctx=cv.getContext('2d');
  const cs=getComputedStyle(document.documentElement);
  const RED=cs.getPropertyValue('--red').trim()||'#d33a2c', BLUE=cs.getPropertyValue('--blue').trim()||'#2350b5';
  const ps=Array.from({length:70},()=>({x:Math.random()*cv.width,y:-Math.random()*cv.height*.6,vx:(Math.random()-.5)*4,vy:Math.random()*3+3,s:Math.random()*8+12,ph:Math.random()*6.28,vp:Math.random()*.2+.08,rot:Math.random()*3}));
  const t0=performance.now();
  (function f(t){
    ctx.clearRect(0,0,cv.width,cv.height); let alive=false;
    for(const p of ps){
      p.x+=p.vx; p.y+=p.vy; p.vy+=.05; p.ph+=p.vp; if(p.y<cv.height+20) alive=true;
      const k=Math.cos(p.ph);
      ctx.fillStyle = k>=0 ? RED : BLUE;
      ctx.beginPath(); ctx.ellipse(p.x,p.y,p.s/2,Math.max(.8,Math.abs(k)*p.s/2),p.rot,0,Math.PI*2); ctx.fill();
    }
    if(alive && t-t0<4000) requestAnimationFrame(f); else cv.remove();
  })(t0);
}

/* ---------------- Bedienung ---------------- */
const act = {
  sound(){ st.sound=!st.sound; snd.on=st.sound; if(st.sound) snd.tap(); render(); },
  home(){ clearTimers(); st.round=null; st.screen='home'; st.modal=null; render(); },
  openMod(d){ snd.tap(); st.m=+d.m; st.L=recLevel(st.m); st.screen='module'; render(); },
  nextMod(d){ clearTimers(); st.round=null; act.openMod(d); },
  level(d){ snd.tap(); st.L=+d.l; render(); },
  start(d){ snd.tap(); st.mode=d.mode; startRound(); },
  toModule(){ clearTimers(); st.round=null; st.screen='module'; render(); },
  d(d){ digit(d.d); }, del(){ delDigit(); }, ok(){ submit(); },
  next(){ snd.tap(); if(st.round && st.round.phase==='stepReveal') nextStep(); else nextTask(); },
  help(){ const r=st.round; if(!r) return; snd.tap(); r.help=true; r.frameHidden=false; render(); },
  peek(){ const r=st.round; if(!r) return; snd.tap(); r.help=true; startBlitz(); render(); },
  speak(){
    const r=st.round, t=r && r.cur; if(!t) return;
    let txt = `${t.q} ${t.ref?spoken(t.ref)+'. ':''}${spoken(t.parts)}`;
    if(t.steps) txt += `. Schritt ${r.k+1}: ${spoken(t.steps[r.k])}`;
    speak(txt);
  },
  quit(){ st.modal='quit'; render(); },
  quitYes(){ clearTimers(); st.modal=null; st.round=null; st.screen='module'; render(); },
  closeModal(){ st.modal=null; render(); },
  again(){ startRound(); }, up(){ st.L=Math.min(3,st.L+1); startRound(); }, down(){ st.L=Math.max(1,st.L-1); startRound(); },
  info(){ st.modal='info'; render(); },
  qr(){ LernstandQR.open(); },
};
$app.addEventListener('click', e => {
  const b=e.target.closest('[data-a]'); if(!b || b.disabled) return;
  const fn=act[b.dataset.a]; if(fn) fn(b.dataset);
});
document.addEventListener('keydown', e => {
  if(e.target && e.target.tagName==='INPUT') return;
  if(st.modal){ if(e.key==='Escape') act.closeModal(); return; }
  if(st.screen!=='play') return;
  if(/^[0-9]$/.test(e.key)) digit(e.key);
  else if(e.key==='Backspace'){ e.preventDefault(); delDigit(); }
  else if(e.key==='Enter'){ e.preventDefault(); const ph=st.round && st.round.phase; if(ph==='reveal'||ph==='stepReveal') act.next(); else submit(); }
});
let narrow = window.innerWidth < 600;   // Zahlenstrahl neu zeichnen, wenn das Gerät gedreht wird
window.addEventListener('resize', () => { const n = window.innerWidth < 600; if(n!==narrow){ narrow=n; if(st.screen==='play' && st.round && st.round.cur.line) render(); } });
window.addEventListener('beforeunload', e => { if(st.dirty){ e.preventDefault(); e.returnValue=''; } });

/* ---------------- Lernstand-Code fürs Lehrerzimmer ---------------- */
LernstandQR.init({
  app:'rechentrainer2', title:'Rechentrainer 2',
  build(){
    let doneLv=0, totT=0, totC=0, any=false;
    MODULES.forEach(m=>[1,2,3].forEach(L=>{ const p=peek(m.id,L); if(p.b>=8) doneLv++; totT+=p.t; totC+=p.c; if(p.r) any=true; }));
    if(!any) return null;
    const cellOf=(id,L)=>{ const p=peek(id,L), s=lvState(id,L); return s==='done' ? [`${p.b}/10`,'g'] : s==='played' ? [p.b>0?`${p.b}/10`:'geübt','y'] : ['offen','n']; };
    const short = m => m.grp==='g' ? `${m.id}. ${m.title}` : `${m.grp==='p'?'+':'−'}${m.step} ${m.title}`;
    const rows=MODULES.map(m=>{
      let bb=0, bl=0; [1,2,3].forEach(L=>{ const p=peek(m.id,L); if(p.bb>=bb && p.bb>0){ bb=p.bb; bl=L; } });
      return [short(m), cellOf(m.id,1), cellOf(m.id,2), cellOf(m.id,3), m.noBlitz?'':bb?`${bb}/10 (St. ${bl})`:'–'];
    });
    const steps=[], notStarted=[], mastered=[];
    MODULES.forEach(m=>{
      if(![1,2,3].some(L=>peek(m.id,L).r>0)){ notStarted.push(short(m).split(' ')[0].replace('.','')); return; }
      if([1,2,3].every(L=>lvState(m.id,L)==='done')){ mastered.push(short(m).split(' ')[0].replace('.','')); return; }
      steps.push(`${label(m)} (${m.title}): weiter mit Stufe ${LEVELS[recLevel(m.id)].n}`);
    });
    const lines=steps.slice();
    if(mastered.length) lines.push(`Alle Stufen geschafft: ${mastered.join(', ')}`);
    if(notStarted.length) lines.push(`Noch nicht begonnen: ${notStarted.join(', ')}`);
    return { s:'Zahlenraum bis 100', b:[
      {k:'kpi', i:[[String(st.stars),'Sterne gesammelt'],[`${doneLv} von ${MODULES.length*3}`,'Stufen geschafft'],[totT?`${Math.round(totC/totT*100)} %`:'–','beim 1. Versuch richtig']]},
      {k:'tab', h:['Übung','Leicht','Mittel','Schwer','Blitz (bestes)'], r:rows},
      {k:'legend', i:[['g','geschafft: mind. 8 von 10 beim 1. Versuch'],['y','geübt (bestes Ergebnis)'],['n','noch offen']]},
      {k:'h', x:'So geht es weiter'},
      {k:'list', i:lines},
      {k:'p', s:'muted', o:1, x:'+1 bis +6 / −1 bis −6: Rechenweg Plus und Minus (Z±Z, ZE±Z, ZE±E, ZE±E über den Zehner, ZE±ZE ohne und mit Übergang). Leicht: mit Hunderterfeld oder Zahlenstrahl. Mittel: weniger Hilfen. Schwer: im Kopf.'}
    ]};
  }
});

render();
</script>
